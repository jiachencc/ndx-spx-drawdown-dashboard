<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持仓水位 · 美股指数看板</title>
<meta name="description" content="个人持仓水位记录：成本位置视角、份数与成本模糊化隐私、当前状态与操作日志。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0d13'/%3E%3Cpath d='M10 46 L24 30 L34 38 L54 16' stroke='%232dd4a7' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M40 16 h14 v14' stroke='%232dd4a7' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="font.css">
<style>
  :root {
    --bg: #0a0d13;
    --bg-grad-1: #0e1526;
    --card: #121826;
    --card2: #1a2234;
    --line: #232e44;
    --line-soft: #1c2538;
    --tx: #e2e9f5;
    --tx2: #8fa0ba;
    --tx3: #6f7f9a;
    --green: #2dd4a7;
    --red: #f26d7d;
    --yellow: #f7c14e;
    --blue: #5ba3ff;
    --cyan: #46c9f0;
    --mono: "JetBrains Mono", "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --radius: 14px;
  }
  body.light {
    --bg: #eef2f8;
    --bg-grad-1: #e6ecf6;
    --card: #ffffff;
    --card2: #f3f6fb;
    --line: #dde4ef;
    --line-soft: #eaf0f7;
    --tx: #16243b;
    --tx2: #52627e;
    --tx3: #64748b;
    --green: #0ea372;
    --red: #e23b53;
    --yellow: #c8901a;
    --blue: #2f7be0;
    --cyan: #0a9fc4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: radial-gradient(1200px 600px at 85% -10%, rgba(91,163,255,.06), transparent 60%), var(--bg);
    color: var(--tx);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
    padding: 18px 14px 40px;
    font-feature-settings: "tnum";
    transition: background .3s, color .3s;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .header h1 { font-size: 20px; font-weight: 800; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
  .header .sub { font-size: 11.5px; color: var(--tx3); margin-top: 4px; }
  .meta { display: flex; gap: 8px; align-items: center; }
  .theme-btn {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 5px 12px; font-family: var(--mono); font-size: 11.5px; color: var(--tx2);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: border-color .2s, color .2s;
  }
  .theme-btn:hover { border-color: var(--blue); color: var(--blue); }
  a.theme-btn { text-decoration: none; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px; min-width: 0;
  }
  .privacy {
    border-color: rgba(247,193,78,.35); background: rgba(247,193,78,.06);
    color: var(--tx2); font-size: 11.5px; line-height: 1.6; display: flex; gap: 8px; align-items: flex-start;
  }
  .privacy b { color: var(--yellow); }
  .src-line { font-size: 11px; color: var(--tx3); margin: 10px 2px; line-height: 1.7; }
  .src-tag { display: inline-block; padding: 1px 6px; border-radius: 5px; font-family: var(--mono); font-size: 9.5px; font-weight: 700; vertical-align: 1px; }
  .src-tag.auto { background: rgba(45,212,167,.12); color: var(--green); border: 1px solid rgba(45,212,167,.3); }
  .src-tag.manual { background: rgba(247,193,78,.1); color: var(--yellow); border: 1px solid rgba(247,193,78,.3); }

  /* ===== 汇总 ===== */
  .sum-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .sum-cell { background: var(--card2); border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 8px; text-align: center; min-width: 0; }
  .sum-cell .s-label { font-size: 10.5px; color: var(--tx3); margin-bottom: 4px; }
  .sum-cell .s-val { font-family: var(--mono); font-size: 17px; font-weight: 700; font-feature-settings: "tnum"; }

  /* ===== 持仓卡 ===== */
  .pos-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pos-name { font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .code { font-family: var(--mono); font-size: 10.5px; color: var(--tx3); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .idx-badge { font-family: var(--mono); font-size: 9.5px; font-weight: 700; border-radius: 6px; padding: 2px 7px; }
  .idx-badge.ndx { background: rgba(70,201,240,.12); color: var(--cyan); border: 1px solid rgba(70,201,240,.3); }
  .idx-badge.spx { background: rgba(91,163,255,.12); color: var(--blue); border: 1px solid rgba(91,163,255,.3); }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; font-size: 12.5px; margin-bottom: 12px; }
  .stat-grid .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line-soft); min-width: 0; }
  .stat-grid .row b { font-family: var(--mono); font-feature-settings: "tnum"; font-weight: 700; white-space: nowrap; }

  /* ===== 三点水位梯：高点/现价/成本 ===== */
  .ladder { position: relative; margin: 2px 0 12px; }
  .ladder::before { content: ""; position: absolute; left: 4px; top: 14px; bottom: 14px; width: 2px; border-radius: 1px; background: var(--line); }  /* 主轨 */
  .lad-fill { position: absolute; left: 4px; width: 2px; border-radius: 1px; background: linear-gradient(180deg, rgba(45,212,167,.12), rgba(45,212,167,.6)); }  /* 成本↔现价 填充（浮盈） */
  .lad-fill.down { background: linear-gradient(180deg, rgba(242,109,125,.6), rgba(242,109,125,.12)); }  /* 浮亏反向 */
  .lad-row { position: relative; display: flex; align-items: baseline; gap: 8px; padding: 7px 0 7px 22px; min-width: 0; flex-wrap: wrap; }
  .lad-dot { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 3px var(--card); }
  .lad-dot.now { box-shadow: 0 0 0 3px var(--card), 0 0 8px rgba(226,233,245,.5); }
  .lad-name { font-size: 11px; color: var(--tx3); flex: none; }
  .lad-val { font-family: var(--mono); font-size: 14px; font-weight: 700; font-feature-settings: "tnum"; }
  .lad-chips { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .lad-chip { font-family: var(--mono); font-size: 10px; font-weight: 700; border-radius: 5px; padding: 1px 6px; border: 1px solid; white-space: nowrap; font-feature-settings: "tnum"; }
  .lad-chip.up { color: var(--green); border-color: rgba(45,212,167,.3); background: rgba(45,212,167,.08); }
  .lad-chip.warn { color: var(--yellow); border-color: rgba(247,193,78,.3); background: rgba(247,193,78,.08); }
  .lad-chip.down { color: var(--red); border-color: rgba(242,109,125,.3); background: rgba(242,109,125,.08); }

  /* ===== 成本位置条 ===== */
  .bar-wrap { margin: 4px 0 14px; }
  .ytd-bar { margin: 0 0 14px; padding-top: 10px; border-top: 1px dashed var(--line-soft); }  /* 今年尺：与 52周尺同组，虚线分隔，YTD≤0 时整条隐藏 */
  .ytd-bar .bar-track { background: var(--line); }  /* 今年尺无红绿语义，纯中性 */
  .bar-marker.static { cursor: default; pointer-events: none; }
  .bar-end.w { background: var(--tx); box-shadow: 0 0 8px rgba(226,233,245,.55); }  /* 今年尺右端=现价 */
  .bar-title { font-size: 11px; color: var(--tx3); margin-bottom: 14px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .bar-title b { color: var(--tx2); }
  .bar-track { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(242,109,125,.35), var(--line), rgba(45,212,167,.4)); }
  .bar-marker { position: absolute; top: -6px; width: 2px; height: 20px; border-radius: 1px; }
  .bar-marker.cost { background: var(--cyan); box-shadow: 0 0 8px rgba(70,201,240,.6); border: none; padding: 0; cursor: pointer; }
  .bar-end { position: absolute; right: -1px; top: -6px; width: 2px; height: 20px; border-radius: 1px; background: var(--yellow); box-shadow: 0 0 8px rgba(247,193,78,.7); }  /* 高点端点：与成本/现价统一为竖杠 */
  .bar-marker.now { background: var(--tx); box-shadow: 0 0 8px rgba(226,233,245,.5); border: none; padding: 0; cursor: pointer; }
  .bar-marker.now::after, .bar-marker.cost::after { content: ""; position: absolute; left: -12px; top: -11px; width: 26px; height: 42px; }  /* 扩大点击热区 */
  .idx-pop {
    position: absolute; bottom: 18px; z-index: 50; width: max-content; max-width: 250px;
    background: #1a2436; border: 1px solid #33415e; border-radius: 12px;
    padding: 9px 12px; box-shadow: 0 14px 44px -8px rgba(0,0,0,.75), 0 0 0 1px rgba(91,163,255,.18);
    font-size: 11.5px; line-height: 1.7; animation: ipIn .15s ease;
  }
  body.light .idx-pop { background: #fff; border-color: #cbd5e1; box-shadow: 0 14px 44px -8px rgba(15,23,42,.18), 0 0 0 1px rgba(47,123,224,.18); }
  .idx-pop .ip-title { font-weight: 700; margin-bottom: 3px; }
  .idx-pop .ip-row { display: flex; justify-content: space-between; gap: 14px; color: var(--tx2); }
  .idx-pop .ip-row b { font-family: var(--mono); font-weight: 700; color: var(--tx); font-feature-settings: "tnum"; }
  .idx-pop .ip-row .ip-sub { color: var(--tx3); font-weight: 400; font-family: var(--sans); }
  .idx-pop .ip-strat { margin-top: 5px; border-top: 1px dashed var(--line); padding-top: 5px; }
  .idx-pop .ip-tip { margin-top: 5px; font-size: 10.5px; color: var(--tx2); line-height: 1.65; border-top: 1px dashed var(--line); padding-top: 5px; }
  .idx-pop .ip-note { margin-top: 4px; font-size: 10px; color: var(--tx3); }
  @keyframes ipIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .strat-row { margin-top: 8px; font-size: 11.5px; color: var(--tx3); line-height: 1.6; overflow-wrap: break-word; }
  .held { font-family: var(--mono); font-size: 10px; color: var(--tx3); font-feature-settings: "tnum"; }
  .strat-hint { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; margin-left: 4px; border: 1px solid var(--line); border-radius: 50%; background: none; color: var(--tx3); font-size: 9.5px; font-family: var(--sans); cursor: pointer; vertical-align: 1px; padding: 0; }
  .strat-note { display: none; font-size: 10.5px; color: var(--tx3); margin-top: 6px; line-height: 1.55; padding: 7px 9px; border: 1px dashed var(--line-soft); border-radius: 8px; }
  .strat-note.open { display: block; }
  .bar-labels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--tx3); margin-top: 8px; font-feature-settings: "tnum"; }
  .bar-legend { display: flex; gap: 10px; margin-top: 6px; font-size: 9.5px; color: var(--tx3); flex-wrap: wrap; opacity: .85; }
  .bar-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
  /* 买入位置分布：52周尺上方的绿点层，横轴复用尺刻度（52周低→高点），重叠位置纵向堆叠 */
  .buy-layer { position: relative; height: 38px; margin-bottom: 1px; }
  .buy-layer:empty { display: none; }
  .buy-mark { position: absolute; bottom: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; background: none; border: none; padding: 0; cursor: pointer; }
  /* 52周尺轨道整体可点：点击吸附最近标记弹出解读，竖杠退出鼠标竞争（防热区打架），键盘 Tab+Enter 仍可达 */
  .bar-track.pops { cursor: pointer; touch-action: manipulation; }
  .bar-track.pops::before { content: ""; position: absolute; inset: -7px 0; }   /* 竖向热区扩大到 ~22px */
  button.bar-marker { pointer-events: none; }
  .buy-mark b { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 5px rgba(52,211,153,.55); }
  .buy-mark i { width: 1.5px; background: rgba(52,211,153,.4); }
  .buy-tip { position: fixed; z-index: 60; transform: translate(-50%, -100%); background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 11px; font-family: var(--mono); color: var(--tx); white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.35); pointer-events: none; font-feature-settings: "tnum"; }
  body.light .buy-tip { box-shadow: 0 8px 22px -6px rgba(15,23,42,.25); }
  .pos-tier { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 6px; padding: 1px 7px; margin-left: 6px; font-family: var(--sans); white-space: nowrap; }
  .pos-tier.t-low { background: rgba(45,212,167,.12); color: var(--green); border: 1px solid rgba(45,212,167,.3); }
  .pos-tier.t-mid { background: rgba(247,193,78,.1); color: var(--yellow); border: 1px solid rgba(247,193,78,.3); }
  .pos-tier.t-high { background: rgba(91,163,255,.12); color: var(--blue); border: 1px solid rgba(91,163,255,.3); }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .kpi { background: var(--card2); border: 1px solid var(--line-soft); border-radius: 10px; padding: 8px 4px; text-align: center; min-width: 0; }
  .kpi .k-label { font-size: 10px; color: var(--tx3); margin-bottom: 3px; }
  .kpi .k-val { font-family: var(--mono); font-size: 13.5px; font-weight: 700; font-feature-settings: "tnum"; }
  .kpi .k-sub { font-family: var(--mono); font-size: 10px; margin-top: 2px; font-feature-settings: "tnum"; }
  .kpi .k-sub.up { color: var(--green); } .kpi .k-sub.down { color: var(--red); }
  .up { color: var(--green); } .down { color: var(--red); } .warn { color: var(--yellow); } .info { color: var(--cyan); }

  /* ===== 操作日志（流式条目，窄屏不溢出） ===== */
  .sec-title { font-size: 13px; font-weight: 700; margin: 18px 2px 8px; display: flex; align-items: center; gap: 8px; }
  .log-item { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 9px; padding: 8px 2px; border-bottom: 1px dashed var(--line-soft); min-width: 0; }
  .log-item:last-child { border-bottom: none; }
  .log-date { font-family: var(--mono); font-size: 11px; color: var(--tx3); font-feature-settings: "tnum"; }
  .log-sym { font-weight: 600; font-size: 12px; }
  .log-nums { font-family: var(--mono); font-size: 11px; color: var(--tx2); font-feature-settings: "tnum"; min-width: 0; }
  .log-note { width: 100%; font-family: var(--sans); color: var(--tx3); font-size: 11px; line-height: 1.5; overflow-wrap: break-word; }
  .log-toggle { margin-left: auto; font-size: 10.5px; color: var(--blue); background: none; border: none; cursor: pointer; font-family: var(--sans); padding: 2px 4px; white-space: nowrap; }
  .log-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 2px 8px; }
  .log-chip { font-size: 10.5px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--tx2); cursor: pointer; font-family: var(--sans); font-feature-settings: "tnum"; }
  .log-chip.on { background: rgba(91,163,255,.12); color: var(--blue); border-color: rgba(91,163,255,.35); font-weight: 600; }
  .act-badge { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 5px; padding: 1px 6px; font-family: var(--sans); }
  .act-open { background: rgba(45,212,167,.12); color: var(--green); border: 1px solid rgba(45,212,167,.3); }
  .act-close { background: rgba(242,109,125,.12); color: var(--red); border: 1px solid rgba(242,109,125,.3); }
  .act-other { background: var(--card2); color: var(--tx2); border: 1px solid var(--line); }
  .footer { text-align: center; font-size: 10.5px; color: var(--tx3); margin-top: 20px; line-height: 1.8; }

  @media (max-width: 480px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .sum-cell .s-val { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>💼 持仓水位</h1>
      <div class="sub">成本位置视角 · 当前状态 · 操作日志</div>
    </div>
    <div class="meta">
      <a class="theme-btn" href="index.html">← 看板</a>
      <button class="theme-btn" id="theme-toggle" type="button" aria-label="切换浅色/深色主题">🌙 深色</button>
    </div>
  </div>

  <div class="card privacy">
    <span>🔒</span>
    <div><b>隐私口径</b>：本页只记录<b>份数与成本价</b>，不记录账户、金额与券商信息；市值 / 浮盈均由公开行情实时推算，仅供参考。</div>
  </div>

  <div class="src-line">
    <span class="src-tag manual">MANUAL</span> 持仓与日志：<b id="pos-updated">--</b> 人工维护（买卖后更新）
    &nbsp;<span style="opacity:.4">|</span>&nbsp;
    <span class="src-tag auto">AUTO</span> 行情基準：<b id="pos-asof">--</b>（随看板 data.js 自动更新）
  </div>

  <div class="card">
    <div class="sum-grid" id="sum-grid"></div>
  </div>

  <div id="pos-list"></div>

  <div class="sec-title">🧾 操作日志 <span style="font-size:10.5px;color:var(--tx3);font-weight:400">（新在上）</span><button type="button" id="log-toggle" class="log-toggle" aria-expanded="false"></button></div>
  <div class="log-chips" id="log-chips"></div>
  <div class="card" id="log-list" style="padding:4px 12px;"></div>

  <div class="footer">
    持仓市值（估）= 成本价 × 现指数 ÷ 成本位指数 × 份数（忽略 QDII 溢价变化，含误差）<br>
    本页为个人记录工具，不构成投资建议 · 数据与<a href="index.html" style="color:var(--blue)">主看板</a>共用 data.js
  </div>
</div>

<script src="data.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);

/* ---- 主题（与主看板共用同一 localStorage 键） ---- */
const THEME_KEY = "wb_ndxspx_theme";
const themeBtn = $("theme-toggle");
function applyTheme(light) {
  document.body.classList.toggle("light", light);
  themeBtn.innerHTML = light ? "☀️ 切深色" : "🌙 切浅色";
}
let savedTheme = null;
try { const s = localStorage.getItem(THEME_KEY); if (s === "light" || s === "dark") savedTheme = s; } catch (e) {}
applyTheme(savedTheme === "light");
themeBtn.addEventListener("click", () => {
  const next = !document.body.classList.contains("light");
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next ? "light" : "dark"); } catch (e) {}
});

/* ---- 格式化 ---- */
const fmtPct = (v, dp) => (v >= 0 ? "+" : "") + (v * 100).toFixed(dp === undefined ? 1 : dp) + "%";
const fmtWan = (v) => (v / 10000).toFixed(1) + "万";
const fmtN = (v) => v.toLocaleString("en-US", { maximumFractionDigits: 0 });
const fmtIdx = (v) => v.toLocaleString("en-US", { maximumFractionDigits: 0 });
const cls = (v) => v >= 0 ? "up" : "down";

/* ---- 渲染 ---- */
let posInfos = [];   // 现价弹窗数据（每次 render 重建，下标对应 data-k）
let costInfos = [];  // 成本位弹窗数据（同上）

function render() {
  closeIdxPop();
  /* 持有天数：取每只 ETF 日志中最早日期，到数据日（asOf.us）的自然日差 */
  const asOfUs = DEFAULT.asOf && DEFAULT.asOf.us ? DEFAULT.asOf.us : null;
  const firstDate = {};
  (POSITIONS.log || []).forEach((e) => { if (!firstDate[e.sym] || e.d < firstDate[e.sym]) firstDate[e.sym] = e.d; });
  if (typeof POSITIONS === "undefined" || !POSITIONS.hold || !POSITIONS.hold.length) {
    $("pos-list").innerHTML = '<div class="card" style="color:var(--tx3);font-size:12.5px;">暂无持仓记录：请在 data.js 的 POSITIONS 中维护。</div>';
    return;
  }
  $("pos-updated").textContent = POSITIONS.updated || "--";
  $("pos-asof").textContent = (DEFAULT.asOf && DEFAULT.asOf.us) || DEFAULT.date || "--";
  posInfos = []; costInfos = [];

  let totalCost = 0, totalVal = 0;

  /* 先算总成本 / 估值，得出占比 */
  const rows = POSITIONS.hold.map((p) => {
    const m = DEFAULT[p.idx] || {};
    const r = m.close && p.idxAtCost ? m.close / p.idxAtCost - 1 : 0;   // 现价较成本位涨跌 ≈ 浮盈
    const nav = p.cost * (1 + r);                                        // 估算净值
    const costAmt = p.qty * p.cost;
    const valAmt = p.qty * nav;
    totalCost += costAmt; totalVal += valAmt;
    return { p, m, r, nav, costAmt, valAmt };
  });

  /* 汇总 */
  const totalR = totalCost ? (totalVal - totalCost) / totalCost : 0;
  $("sum-grid").innerHTML =
    '<div class="sum-cell"><div class="s-label">💰 总投入（成本）</div><div class="s-val">' + fmtWan(totalCost) + '</div></div>' +
    '<div class="sum-cell"><div class="s-label">📦 组合市值（估）</div><div class="s-val">' + fmtWan(totalVal) + '</div></div>' +
    '<div class="sum-cell"><div class="s-label">📈 组合浮盈</div><div class="s-val ' + cls(totalR) + '">' + fmtPct(totalR) + '</div></div>';

  /* 持仓卡 */
  $("pos-list").innerHTML = rows.map(({ p, m, r, nav, costAmt, valAmt }, i) => {
    const pl = valAmt - costAmt;   // 浮盈额（估），显示模糊到万
    const lo = m.low52 || Math.min(p.idxAtCost, m.close || p.idxAtCost);
    const hi = m.ath || Math.max(p.idxAtCost, m.close || p.idxAtCost);
    const pctOf = (v) => Math.max(0, Math.min(100, ((v - lo) / (hi - lo)) * 100));
    const pct = Math.round(pctOf(p.idxAtCost));   // 成本位置分位（52周低=0% → 历史高点=100%），取整保证显示与档位一致
    const tier = pct < 35 ? ["t-low", "🟢 区间偏低"] : pct <= 65 ? ["t-mid", "🟡 区间中位"] : ["t-high", "🔵 区间偏高"];
    const backToCost = 1 - m.close / p.idxAtCost;   // 指数再跌 x% 回到成本（正=需涨回本）
    const idxName = p.idx === "ndx" ? "纳指100" : "标普500";
    const heldDays = asOfUs && firstDate[p.sym] ? Math.max(1, Math.round((Date.parse(asOfUs) - Date.parse(firstDate[p.sym])) / 86400000)) : null;
    /* 日内波动操作线（MANUAL 策略，data.js POSITIONS.strategy） */
    const st = POSITIONS.strategy || { dip: -2, rally: 3 };
    const chg = m.chg || 0;
    const ruleTxt = "跌 " + Math.abs(st.dip) + "% 加仓 / 涨 " + st.rally + "% 减仓";
    let strat;
    if (chg <= st.dip) {
      strat = '<span class="up">🎯 今日 ' + fmtPct(chg / 100, 2) + ' · 触发加仓观察（跌 ≥' + Math.abs(st.dip) + '%）</span>';
    } else if (chg >= st.rally) {
      strat = '<span class="warn">🎯 今日 ' + fmtPct(chg / 100, 2) + ' · 触发减仓观察（涨 ≥' + st.rally + '%）</span>';
    } else {
      strat = '🎯 今日 ' + fmtPct(chg / 100, 2) + ' · 未触发（' + ruleTxt + '）';
    }
    posInfos[i] = { close: m.close, chg, lo, hi, days: m.days };
    /* 成本位弹窗数据：三点关系 + 当前总结 + 规则化操作提示 */
    const tierWord = tier[1].slice(2);   // 去掉 emoji，取「区间偏低/中位/偏高」
    const advice = pct < 35
      ? "🟢 成本位置较低，安全垫厚，适合按纪律耐心持有；若深度回调，可按计划分批加仓。"
      : pct <= 65
        ? "🟡 位置中性，按既定纪律执行：日内跌 ≥" + Math.abs(st.dip) + "% 加仓、涨 ≥" + st.rally + "% 减仓。"
        : "🔵 成本偏高，注意控制节奏；若跌回成本下方，可小额分批摊低成本，勿一次性重手。";
    const sumTxt = "成本位于" + tierWord + "（分位 " + pct + "%）";
    const cushionTxt = r >= 0
      ? "浮盈垫：回调 " + Math.abs(backToCost * 100).toFixed(1) + "% 以内不伤本金"
      : "当前浮亏，需涨 " + fmtPct(backToCost) + " 回本";
    /* YTD 水位（今年尺）：年初→现价坐标，成本位青色竖杠落点即水位；YTD≤0 整条隐藏，>100% 钳制并标「高位买入」 */
    const ytdR = m.prevYr && m.close ? m.close / m.prevYr - 1 : null;
    /* 今年尺 mini-bar：年初→现价坐标，成本位青色竖杠落点即水位；>100% 钳制并标「高位买入」 */
    let ytdBar = "";
    if (ytdR > 0) {
      const ytdRaw = (p.idxAtCost - m.prevYr) / (m.close - m.prevYr) * 100;
      const ytdLeft = Math.max(0, Math.min(100, ytdRaw));
      ytdBar = '<div class="bar-wrap ytd-bar">' +
        '<div class="bar-title"><span>今年水位 · 成本在年初→现价涨幅中的位置 <b>' + Math.round(ytdLeft) + '%</b>' +
          (ytdRaw > 100 ? '<span class="pos-tier t-mid">⚠️ 高位买入</span>' : '') + '</span>' +
          '<span class="' + cls(ytdR) + '">今年 ' + fmtPct(ytdR) + '</span></div>' +
        '<div class="bar-track">' +
          '<span class="bar-end w"></span>' +
          '<span class="bar-marker cost static" style="left:' + ytdLeft + '%"></span>' +
        '</div>' +
        '<div class="bar-labels"><span>年初 ' + fmtIdx(m.prevYr) + '</span><span>现价 ' + fmtIdx(m.close) + '</span></div>' +
      '</div>';
    }
    costInfos[i] = { idxAtCost: p.idxAtCost, gapCost: p.idxAtCost / hi - 1, cost: p.cost, qty: p.qty, r, pl, pct, sumTxt, cushionTxt, advice };
    /* 买入位置分布：每笔买入按当日指数落在52周区间的分位，绿点标在尺上方（大小∝份数），重叠位置纵向堆叠；点击看明细 */
    const buys = (POSITIONS.log || []).filter((e) => symIdx[e.sym] === p.idx && e.idxAt);
    const maxQ = Math.max.apply(null, buys.map((e) => e.qty).concat([1]));
    const binCnt = {};
    const buyMarks = buys.map((e) => {
      const pc = Math.max(0, Math.min(100, pctOf(e.idxAt)));
      const bin = Math.round(pc / 2.5);
      const lvl = Math.min(binCnt[bin] || 0, 3);   // 同一分位最多叠 4 层，防溢出
      binCnt[bin] = (binCnt[bin] || 0) + 1;
      const sz = (5 + 3 * e.qty / maxQ).toFixed(1);   // 点大小 5~8px ∝ 份数
      return '<button type="button" class="buy-mark" style="left:' + pc.toFixed(1) + '%"' +
        ' data-d="' + e.d + '" data-c="' + e.cost + '" data-q="' + e.qty + '"' +
        ' aria-label="' + e.d + ' 买入 ' + e.cost + ' 元 ' + fmtN(e.qty) + ' 份">' +
        '<b style="width:' + sz + 'px;height:' + sz + 'px"></b><i style="height:' + (3 + lvl * 8) + 'px"></i></button>';
    }).join("");
    /* 三点水位梯：高点/现价/成本 按数值降序排列，现价行挂箭头 chips */
    const dateStr = DEFAULT.asOf && DEFAULT.asOf.us ? " (" + DEFAULT.asOf.us.slice(5).replace("-", ".") + ")" : "";
    const athStr = m.athDate ? " (" + m.athDate.slice(5).replace("-", ".") + ")" : "";
    const chipCost = '<span class="lad-chip ' + cls(r) + '">' + (r >= 0 ? "▲" : "▼") + fmtPct(r) + ' 较成本</span>';
    const chipHigh = '<span class="lad-chip ' + (m.close >= hi ? "up" : "warn") + '">' + (m.close >= hi ? "▲" : "▼") + fmtPct(m.close / hi - 1) + ' 距高点</span>';
    const ladRows = [
      { k: "hi", name: "高点" + athStr, v: hi, dot: "var(--yellow)", chips: "" },
      { k: "now", name: "现价" + dateStr, v: m.close, dot: "var(--tx)", chips: chipCost + chipHigh },
      { k: "cost", name: "成本", v: p.idxAtCost, dot: "var(--cyan)", chips: "" },
    ].sort((a, b) => b.v - a.v);
    return '<div class="card">' +
      '<div class="pos-head"><div class="pos-name">' + p.sym +
        '<span class="code">' + p.code + '</span>' +
        '<span class="idx-badge ' + p.idx + '">' + idxName + '</span></div>' +
        (heldDays ? '<span class="held">持有 ' + heldDays + ' 天</span>' : '') +
      '</div>' +
      '<div class="stat-grid">' +
        '<div class="row"><span style="color:var(--tx2)">份数</span><b>' + fmtN(p.qty) + ' 份</b></div>' +
        '<div class="row"><span style="color:var(--tx2)">成本价</span><b>' + p.cost.toFixed(3) + ' 元</b></div>' +
      '</div>' +
      '<div class="ladder">' +
        ladRows.map((row) =>
          '<div class="lad-row">' +
            '<span class="lad-dot ' + row.k + '" style="background:' + row.dot + '"></span>' +
            '<span class="lad-name">' + row.name + '</span>' +
            '<b class="lad-val">' + fmtIdx(row.v) + '</b>' +
            (row.chips ? '<span class="lad-chips">' + row.chips + '</span>' : '') +
          '</div>').join("") +
        '<span class="lad-fill' + (r >= 0 ? "" : " down") + '"></span>' +
      '</div>' +
      '<div class="bar-wrap">' +
        '<div class="bar-title"><span>成本位置 · 分位 <b>' + pct.toFixed(0) + '%</b><span class="pos-tier ' + tier[0] + '">' + tier[1] + '</span></span></div>' +
        '<div class="buy-layer">' + buyMarks + '</div>' +
        '<div class="bar-track pops">' +
          '<span class="bar-end"></span>' +
          '<button type="button" class="bar-marker cost" style="left:' + pctOf(p.idxAtCost) + '%" data-k="' + i + '" aria-label="查看成本位解读" aria-expanded="false"></button>' +
          '<button type="button" class="bar-marker now" style="left:' + pctOf(m.close) + '%" data-k="' + i + '" aria-label="查看现价位置解读" aria-expanded="false"></button>' +
        '</div>' +
        '<div class="bar-labels"><span>' + fmtIdx(lo) + '</span><span>' + fmtIdx(hi) + '</span></div>' +
        '<div class="bar-legend"><span>52周低 → 历史高点</span><span><i style="background:var(--cyan)"></i>成本位</span><span><i style="background:var(--tx)"></i>现价</span><span><i style="background:var(--yellow)"></i>高点</span><span><i style="background:var(--green);border-radius:50%"></i>买入</span></div>' +
      '</div>' +
      ytdBar +
      '<div class="kpi-row">' +
        '<div class="kpi"><div class="k-label">浮盈（估）</div><div class="k-val ' + cls(r) + '">' + fmtPct(r) + '</div><div class="k-sub ' + cls(r) + '">' + (pl >= 0 ? "+" : "") + fmtWan(pl) + '</div></div>' +
        '<div class="kpi"><div class="k-label">市值（估）</div><div class="k-val">' + fmtWan(nav * p.qty) + '</div></div>' +
        '<div class="kpi"><div class="k-label">距成本位</div><div class="k-val ' + (backToCost >= 0 ? "warn" : "info") + '">' + fmtPct(backToCost) + '</div><div class="k-sub" style="color:var(--tx3)">' + (backToCost >= 0 ? "需涨 " + fmtPct(backToCost).slice(1) + " 回本" : "跌 " + fmtPct(backToCost).slice(1) + " 回成本") + '</div></div>' +
        '<div class="kpi"><div class="k-label">组合占比</div><div class="k-val">' + (p.pct !== undefined ? p.pct.toFixed(1) + '%' : '--') + '</div></div>' +
      '</div>' +
      '<div class="strat-row">' + strat +
        '<button type="button" class="strat-hint" aria-label="口径说明" aria-expanded="false">?</button>' +
        '<div class="strat-note">触发线按<b>指数</b>当日涨跌计算（美股口径）。QDII ETF 的日内价格反映的是前一晚美股行情与当日溢价变化，与指数涨跌存在错位——以券商账户的实际成交为准。</div>' +
      '</div>' +
    '</div>';
  }).join("");

  /* 水位梯：定位 成本↔现价 之间的填充段（两圆点中心之间） */
  document.querySelectorAll("#pos-list .ladder").forEach((lad) => {
    const fill = lad.querySelector(".lad-fill");
    const dNow = lad.querySelector(".lad-dot.now"), dCost = lad.querySelector(".lad-dot.cost");
    if (!fill || !dNow || !dCost) return;
    const base = lad.getBoundingClientRect().top;
    const a = dNow.getBoundingClientRect(), b = dCost.getBoundingClientRect();
    fill.style.top = (Math.min(a.top, b.top) - base + a.height / 2) + "px";
    fill.style.height = Math.abs(a.top - b.top) + "px";
  });

  /* 操作日志（数组顺序即新在上）：默认只显示最新 3 条，可展开全部 */
  renderLog();
}

const LOG_PREVIEW = 3;   // 折叠时显示的最新条数
let logOpen = false;
let logFilter = "all";   // all | ndx | spx（映射自 hold 的 idx）
const symIdx = {};       // sym → idx，用于日志按品种过滤
(POSITIONS.hold || []).forEach((h) => { symIdx[h.sym] = h.idx; });
function logItemHtml(e) {
  const a = String(e.act || "");
  const c = /建仓|加仓|买入/.test(a) ? "act-open" : /减仓|卖出|清仓/.test(a) ? "act-close" : "act-other";
  const d = e.d ? e.d.slice(5).replace("-", ".") : "--";   // M.D 短格式，年份由上下文隐含
  return '<div class="log-item">' +
    '<span class="log-date">' + d + '</span>' +
    '<span class="act-badge ' + c + '">' + e.act + '</span>' +
    '<span class="log-sym">' + e.sym + '</span>' +
    '<span class="log-nums">' + fmtN(e.qty) + ' 份 @ ' + (e.cost !== undefined ? e.cost.toFixed(3) : "--") + ' 元</span>' +
    (e.note ? '<div class="log-note">' + e.note + '</div>' : '') +
  '</div>';
}
function renderLog() {
  const all = POSITIONS.log || [];
  const log = all.filter((e) => logFilter === "all" || symIdx[e.sym] === logFilter);
  $("log-list").innerHTML = (logOpen ? log : log.slice(0, LOG_PREVIEW)).map(logItemHtml).join("")
    || '<div class="log-note" style="padding:12px 2px;text-align:center">暂无日志</div>';
  const btn = $("log-toggle");
  if (log.length > LOG_PREVIEW) {
    btn.style.display = "";
    btn.textContent = logOpen ? "收起 ▴" : "展开全部 " + log.length + " 条 ▾";
    btn.setAttribute("aria-expanded", logOpen ? "true" : "false");
  } else {
    btn.style.display = "none";
  }
  /* 筛选 chips（数据驱动生成，带条数） */
  $("log-chips").innerHTML = [["all", "全部"], ["ndx", "纳指"], ["spx", "标普"]].map(([k, label]) => {
    const n = k === "all" ? all.length : all.filter((e) => symIdx[e.sym] === k).length;
    return '<button type="button" class="log-chip' + (logFilter === k ? " on" : "") + '" data-f="' + k + '" aria-pressed="' + (logFilter === k) + '">' + label + ' ' + n + '</button>';
  }).join("");
}
$("log-toggle").addEventListener("click", () => { logOpen = !logOpen; renderLog(); });
$("log-chips").addEventListener("click", (e) => {
  const btn = e.target.closest(".log-chip");
  if (!btn || btn.dataset.f === logFilter) return;
  logFilter = btn.dataset.f;
  logOpen = false;   // 切换筛选后回到折叠态
  renderLog();
});

/* 买入位置明细气泡：全局单例，点绿点显示「日期 · 价格 · 份数」，点空白关闭 */
const buyTip = document.createElement("div");
buyTip.className = "buy-tip";
buyTip.style.display = "none";
document.body.appendChild(buyTip);
let lastBuyMark = null;
document.addEventListener("click", (e) => {
  const mk = e.target.closest(".buy-mark");
  if (!mk) { buyTip.style.display = "none"; lastBuyMark = null; return; }   // 点空白关闭
  if (mk === lastBuyMark) { buyTip.style.display = "none"; lastBuyMark = null; return; }   // 再点同一点关闭
  lastBuyMark = mk;
  buyTip.textContent = (mk.dataset.d || "--").slice(5).replace("-", ".").replace(/^0/, "") + " · " +
    (+mk.dataset.c).toFixed(3) + " 元 · " + fmtN(+mk.dataset.q) + " 份";
  buyTip.style.display = "block";
  const r = mk.getBoundingClientRect();
  const w = buyTip.offsetWidth;
  const cx = Math.max(w / 2 + 6, Math.min(window.innerWidth - w / 2 - 6, r.left + r.width / 2));
  buyTip.style.left = cx + "px";
  buyTip.style.top = Math.max(40, r.top - 7) + "px";   // 气泡底缘距点顶 7px；顶部越界时钳到屏内
});
/* ---- 位置解读弹窗（点击 bar 上的现价 / 成本位标记） ---- */
let idxPop = null;
function closeIdxPop() {
  if (idxPop) {
    const sel = '.bar-marker.' + (idxPop.dataset.t === "c" ? "cost" : "now") + '[data-k="' + idxPop.dataset.k + '"]';
    const prev = document.querySelector(sel);
    if (prev) prev.setAttribute("aria-expanded", "false");
    idxPop.remove(); idxPop = null;
  }
}
function nowPopHtml(info) {
  return '<div class="ip-title">📍 现价 ' + fmtIdx(info.close) + ' · 今日 ' + fmtPct(info.chg / 100, 2) + '</div>' +
    '<div class="ip-row"><span>距 52 周低（下跌缓冲）</span><b>' + fmtPct(info.close / info.lo - 1) + '</b></div>' +
    '<div class="ip-row"><span>距历史高点</span><b class="warn">' + fmtPct(info.close / info.hi - 1) + (info.days ? '<span class="ip-sub">（' + info.days + ' 天前）</span>' : '') + '</b></div>';
}
function costPopHtml(info) {
  return '<div class="ip-title">🏷️ 成本位 ' + fmtIdx(info.idxAtCost) + '</div>' +
    '<div class="ip-row"><span>现价较成本</span><b class="' + cls(info.r) + '">' + fmtPct(info.r) + '</b></div>' +
    '<div class="ip-row"><span>成本距高点</span><b>' + fmtPct(info.gapCost) + '</b></div>' +
    '<div class="ip-row"><span>成本价 / 份数</span><b>' + info.cost.toFixed(3) + ' 元 · ' + fmtN(info.qty) + ' 份</b></div>' +
    '<div class="ip-tip">📊 ' + info.sumTxt + '；' + info.cushionTxt + '<br>' + info.advice + '</div>' +
    '<div class="ip-note">⚠️ 机械规则提示，非投资建议</div>';
}
document.addEventListener("click", (e) => {
  if (e.target.closest(".idx-pop")) return;                             // 点弹窗内部不关闭
  const track = e.target.closest(".bar-track");
  const marks = track ? track.querySelectorAll("button.bar-marker") : [];
  if (!track || !marks.length) { closeIdxPop(); return; }               // 尺外或今年尺（无解读入口）→ 关闭
  let btn = e.target.closest("button.bar-marker");                      // 键盘 Enter 直接触发对应标记
  if (!btn) {                                                           // 鼠标点轨道任意处 → 吸附最近标记
    const tr = track.getBoundingClientRect(), cx = e.clientX - tr.left;
    let best = null, bd = Infinity;
    marks.forEach((m) => {
      const d = Math.abs(m.offsetLeft + m.offsetWidth / 2 - cx);
      if (d < bd) { bd = d; best = m; }
    });
    btn = best;
  }
  const isCost = btn.classList.contains("cost");
  const key = btn.dataset.k, t = isCost ? "c" : "n";
  if (idxPop && idxPop.dataset.k === key && idxPop.dataset.t === t) { closeIdxPop(); return; }  // 再点同一个收起
  const info = (isCost ? costInfos : posInfos)[key];
  if (!info) return;
  closeIdxPop();
  idxPop = document.createElement("div");
  idxPop.className = "idx-pop";
  idxPop.dataset.k = key; idxPop.dataset.t = t;
  idxPop.innerHTML = isCost ? costPopHtml(info) : nowPopHtml(info);
  btn.parentElement.appendChild(idxPop);   // .bar-track 已是 position:relative
  btn.setAttribute("aria-expanded", "true");
  /* 水平方向钳制，避免超出屏幕；空间不足时翻转到轨道下方 */
  const tw = btn.parentElement.offsetWidth, pw = idxPop.offsetWidth;
  const cx = parseFloat(btn.style.left) / 100 * tw;
  const half = pw / 2 + 4;
  const center = Math.max(half, Math.min(tw - half, cx));
  idxPop.style.left = (center - pw / 2) + "px";
  if (idxPop.getBoundingClientRect().top < 8) {
    idxPop.style.bottom = "auto";
    idxPop.style.top = "26px";
  }
});
window.addEventListener("resize", closeIdxPop);   // 视口变化时收起，防错位

/* 策略行「?」口径提示：点按钮开合，点别处收起 */
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".strat-hint");
  document.querySelectorAll(".strat-note.open").forEach((n) => {
    if (!btn || n !== btn.nextElementSibling) n.classList.remove("open");
  });
  if (btn) {
    const note = btn.nextElementSibling;
    const open = note.classList.toggle("open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  }
});

render();
</script>
</body>
</html>

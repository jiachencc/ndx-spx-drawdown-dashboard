  .chk-tbl .c-gap { font-style: normal; font-family: var(--mono); font-size: var(--chk-fs-mini); color: var(--tx3); margin-left: 3px; }
  /* 列内小标签（"买点 / 成本 / 调仓"）：桌面有表头 → 隐藏；手机隐去表头后 → 显示（见下面的媒体查询） */
  .chk-tbl .c-lb { display: none; }
  .c-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .c-dot.etf { background: var(--cyan); }
  .c-dot.otc { background: var(--purple); }
  .chk-note { margin-top: 11px; }
  @media (max-width: 767px) {
    /* 手机（2026-09-27 二改：用户反馈"有点乱"）：每只做成**固定的四段**，段落位置不再随字数浮动 ——
         ● 港美互联网LOF                     ← ① 名称独占一行
         买点      成本        调仓            ← ② 三个分项等宽三列（标签独立一行）
         C 68%    D −229pp    D −5,072
         成本位高于现价位 229 个百分点（套牢中）  ← ③ 说明：每条问题单独一行（渲染时把「 · 」换成 <br>）
         5 笔卖出合计 −5,072（0/5 笔盈利）
         买点均位 68%，偏区间上部
       原来三段挤在一行、"不适用/赎回 1 笔"长短不一 → 每行的折行点都不同，看着就乱。 */
    .chk-tbl thead { display: none; }
    .chk-tbl, .chk-tbl tbody, .chk-tbl tr { display: block; }
    .chk-tbl tr { padding: 9px 0; border-bottom: 1px dashed var(--line-soft); }
    .chk-tbl .c-nm { display: block; margin-bottom: 5px; }
    .chk-tbl .c-buy, .chk-tbl .c-cost, .chk-tbl .c-swing { display: inline-block; width: 33%; padding: 0; border: none; vertical-align: top; }
    .chk-tbl .c-note { display: block; margin-top: 5px; padding: 0; border: none; font-size: var(--chk-fs-mini); }
    /* 手机上隐去表头，所以列内小标签显示出来、并独立成行（与数字上下对齐，比挤在数字前更好认） */
    .chk-tbl .c-lb { display: block; font-style: normal; color: var(--tx3); font-size: var(--chk-fs-mini); margin-bottom: 1px; }
  }
  /* ===== 逐只 XIRR 与 TWR / 逐只体检：改成**真表格**（2026-09-30，参照「操作体检」）========
     起因：用户两次反馈「表格还是对不齐」。根因是旧版把细节写成一路「 · 」连成的自由文本，
     同一行各字段的左边界随字数浮动，13 行叠起来像没排过版。
     现在与「操作体检」同一套表格语言：
       · 真 <table>：列宽由内容自动对齐；数字列右对齐 + 等宽（tabular-nums）→ 连小数点也对齐
       · 行间细虚线、表头下实线、字号沿用 .chk-tbl 的局部变量（--chk-fs 10px / mini 9px）
       · 手机（≤767px）：隐表头 → 名称独占一行 + 分项等宽三列 ×2 行 + 备注分条（同 .chk-tbl 落法）
       · 档位字母沿用 .oc-a/b/c/d/na（与操作体检的档位同色同语义）；体检的四枚灯用 .ok/.watch/.bad/.na
       · 分组行（场外 / 场内）跨全表、带上边线，桌面与手机同一处理
     ⚠ 本表**复用 .chk-tbl 的全部基础样式**（th/td 留白与虚线、.c-lb 的隐藏/显示、.c-note 的换行、
       thead 隐藏与 tr 块化），这里只补差异项。不要为它另起一套字号与行距，否则两张表会不一致。 */
  .xr-tbl td.num, .xr-tbl th.num { text-align: right; }
  .xr-tbl td.num { font-family: var(--mono); font-weight: 700; font-feature-settings: "tnum"; white-space: nowrap; }
  /* 年化后面的小字：2026-09-30 由「98 天」（跨度）改成「在场均 48 天」（**有效在场期**）——
     用户质疑年化 69.5% 之后定的 B 方案：把「这个年化是按多少天的实际暴露外推出来的」摆在数字旁边。
     ⚠ 定宽（58px）是刻意的：不定宽的话，「在场均 35 天」与「在场均 91 天」宽度不同会把数字的右边界顶歪，
       而本列是右对齐的 —— 定宽后数字与小字各自成一条竖线（手机端本列左对齐，同样受益）。
     ⚠ 58px 是按「在场均 91 天」量的（约 51px）；未录入的行给**空的同宽占位**，保持同一条线。 */
  .xr-tbl .c-day { display: inline-block; width: 58px; text-align: left; font-style: normal;
    font-family: var(--mono); font-size: var(--chk-fs-mini); color: var(--tx3); margin-left: 3px; }
  /* 体检的四枚灯：✓ / ⚠ / ✗ / ⏳。⏳ 要去掉默认的 800 字重，否则灰字看着像有结论。 */
  .xr-tbl b.ok { color: var(--up); }
  .xr-tbl b.watch { color: var(--yellow); }
  .xr-tbl b.bad { color: var(--red); }
  .xr-tbl b.na { color: var(--tx3); font-weight: 400; }
  /* 分组行：跨全表的**分节线**。桌面是表格里的一行、手机是块 —— 两边同一处理。
     ⚠ 上边线而不是下边线：它要"压住"上面那一段（与 .xr-grp 旧版一致）。 */
  .xr-tbl tr.xr-grp-row td { padding: 14px 8px 4px 0; border-top: 1px solid var(--line-soft); border-bottom: none; }
  .xr-tbl tr.xr-grp-row:first-child td { padding-top: 3px; border-top: none; }
  .xr-tbl tr.xr-grp-row .g-t { font-weight: 700; color: var(--tx2); letter-spacing: .06em; }
  .xr-tbl tr.xr-grp-row .g-s { margin-left: 8px; font-size: var(--chk-fs-mini); color: var(--tx3); }
  /* 标的列的市场圆点：沿用操作体检的 .c-dot（场外紫 / 场内青），13 只一眼分得出渠道 */
  .xr-tbl .c-nm .c-dot { margin-right: 5px; }
  /* 体检的四枚灯：左对齐（与表头同一左边界），列宽自然由内容定 —— 竖着扫就是「哪一项普遍不达标」 */
  .xr-tbl td.lamp { white-space: nowrap; }
  /* ===== 备注列（2026-09-30 二改）===================================================
     用户：「电脑端还是有点拥挤，备注可以精简一些 或者 可以隐藏到图标里，点击再显示」。
     于是两步：① 渲染侧先把文案精简；② 整列收成一枚 ⓘ（点击在屏幕底部弹出浮层）。
     ⚠ 浮层**复用页面既有的 .tip / .tip-pop**：点击委托、同时只开一个、✕ 与 Esc 都能关、
       data-tip 走 white-space: pre-line 所以能"一条一行"、手机上是底部浮层也不会被裁 ——
       不另造一套开关，也不做贴列的绝对定位浮层（表格里容易顶到卡片边缘被裁）。
     ⚠ 只收「口径说明」这类**可查**信息；**⚠ 警示不外收**：它要一眼看见，仍留在格子里。 */
  .xr-tbl td.c-info { white-space: nowrap; }
  @media (max-width: 767px) {
    /* 手机：与 .chk-tbl 完全同构。
       ⚠ 各 <td> 之间**不能出现空白字符**（inline-block 三列各 33%，多一个空格就挤成两列）——
         所以渲染侧整串拼接、不要换行缩进。 */
    .xr-tbl .c-gr, .xr-tbl .c-xirr, .xr-tbl .c-twr, .xr-tbl .c-inv, .xr-tbl .c-val, .xr-tbl .c-rate {
      display: inline-block; width: 33%; padding: 0; border: none; vertical-align: top; text-align: left; }
    .xr-tbl td.lamp { display: inline-block; width: 33%; padding: 0; border: none; vertical-align: top; text-align: left; }
    .xr-tbl td.num { text-align: left; }        /* 手机上是分项格子，左对齐比右对齐更好读 */
    .xr-tbl tr.xr-grp-row td { padding: 14px 0 3px; }
    /* 备注：手机列已堆叠 → 这一格单独成行（ⓘ 仍在行内，点开是底部浮层） */
    .xr-tbl td.c-info { display: block; margin-top: 4px; padding: 0; border: none; }
  }
  /* ===== 回本阶梯（2026-09-30 加，用户要求）========================================
     持仓卡里的折叠小表：从当前亏损档一路列到回本（浮盈时则从成本列到现价），
     每 1% 一行、给出价格 / 相对现价 / 市值 / 浮亏 —— 设价格提醒、判断还差多远。
     行式语言与流水区一致（细分节线 + 等宽数字），字号走全站最小档，不抢卡面读数。 */
  .rebound > summary { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 6px;
    font-size: var(--fs-xs); color: var(--tx2); cursor: pointer; list-style: none; padding: 7px 0 5px; }
  .rebound > summary::-webkit-details-marker { display: none; }
  .rebound > summary:hover { color: var(--tx); }
  .rebound > summary::after { content: "展开 ▾"; margin-left: auto; color: var(--blue); font-size: var(--fs-xs); white-space: nowrap; }
  .rebound[open] > summary::after { content: "收起 ▴"; }
  .rebound .rebound-cnt { color: var(--tx3); font-size: var(--fs-xxs); }
  .rb-tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-xxs); }
  .rb-tbl th { text-align: left; font-weight: 700; color: var(--tx3); padding: 0 8px 5px 0;
    border-bottom: 1px solid var(--line); white-space: nowrap; }
  .rb-tbl td { padding: 4px 8px 4px 0; border-bottom: 1px dashed var(--line-soft);
    font-family: var(--mono); font-feature-settings: "tnum"; white-space: nowrap; }
  .rb-tbl th.num, .rb-tbl td.num { text-align: right; }
  .rb-tbl tr:last-child td { border-bottom: none; }
  .rb-tbl tr.rb-cost td { font-weight: 700; color: var(--tx); }      /* 0% ＝ 回本行，加粗 */
  .rb-tbl tr.rb-now td { color: var(--blue); }                       /* 离当前最近的档，标蓝 */
  .rb-tbl .rb-here { font-size: var(--fs-xxs); color: var(--blue); }
  .rb-tbl .rb-more { color: var(--tx3); font-family: var(--sans); }
  .pos-log > summary { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; font-size: var(--fs-xs); color: var(--tx2); cursor: pointer; list-style: none; padding: 2px 0; }
  .pos-log > summary::-webkit-details-marker { display: none; }
  .pos-log > summary b { font-family: var(--mono); font-weight: 700; font-feature-settings: "tnum"; }
  .pos-log > summary:hover { color: var(--tx); }
  .pos-log > summary::after { content: "展开明细 ▾"; margin-left: auto; color: var(--blue); font-size: var(--fs-xs); white-space: nowrap; }
  .pos-log[open] > summary::after { content: "收起 ▴"; }
  .pos-log .log-list { padding-top: 2px; }
  /* ===== 波段回路（做T复盘）：卡内配对表与跨标的复盘共用同一行式 ===== */
  .swing-row { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 9px; padding: 7px 2px; border-bottom: 1px dashed var(--line-soft); font-size: var(--fs-xs); font-family: var(--mono); font-feature-settings: "tnum"; }
  .swing-row > span { white-space: nowrap; }
  .sw-date { color: var(--tx3); }
  .sw-sym { font-family: var(--sans); color: var(--tx2); max-width: 8.5em; overflow: hidden; text-overflow: ellipsis; }
  .sw-kind { font-family: var(--sans); font-size: var(--fs-xxs); font-weight: 700; border-radius: var(--radius-xs); padding: 1px 6px; }
  .sw-kind.sw { background: var(--up-bg); color: var(--green); border: 1px solid var(--up-line); }
  .sw-kind.rv { background: var(--accent-bg); color: var(--blue); border: 1px solid var(--accent-line); }
  .sw-kind.tr { background: var(--card2); color: var(--tx2); border: 1px solid var(--line); }
  .sw-qty, .sw-px, .sw-days { color: var(--tx2); }
  .sw-net { margin-left: auto; font-weight: 700; }
  .swing-hint { font-family: var(--sans); font-size: var(--fs-xs); color: var(--tx2); line-height: 1.75; background: var(--card2); border: 1px dashed var(--line); border-radius: 8px; padding: 6px 9px; margin: 4px 0 6px; }
  .swing-hint b { font-family: var(--mono); font-feature-settings: "tnum"; }
  .sw-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
  .sw-kpi { background: var(--card2); border: 1px solid var(--line-soft); text-align: center; min-width: 0; }   /* padding / border-radius 已在上方的 `.kpi, .sum-cell, .sw-kpi` 统一规则中定义 */
  .sw-kpi .sw-label { font-size: var(--fs-xxs); color: var(--tx3); margin-bottom: 3px; }
  .sw-kpi .sw-val { font-family: var(--mono); font-size: var(--fs-md); font-weight: 700; font-feature-settings: "tnum"; }
  .sw-kpi .sw-sub { font-family: var(--mono); font-size: var(--fs-xxs); color: var(--tx3); margin-top: 3px; line-height: 1.5; overflow-wrap: break-word; }
  .sw-notes { font-family: var(--sans); font-size: var(--fs-xs); color: var(--tx2); line-height: 1.8; border-top: 1px dashed var(--line-soft); padding-top: 8px; margin-bottom: 2px; }
  .sw-notes b { font-family: var(--mono); font-feature-settings: "tnum"; }
  @media (max-width: 560px) { .sw-kpis { grid-template-columns: repeat(2, 1fr); } }
  .act-badge { display: inline-block; font-size: var(--fs-xxs); font-weight: 700; border-radius: var(--radius-xs); padding: 1px 6px; font-family: var(--sans); }
  .act-open { background: var(--up-bg); color: var(--green); border: 1px solid var(--up-line); }
  .act-close { background: var(--down-bg); color: var(--red); border: 1px solid var(--down-line); }
  .act-other { background: var(--card2); color: var(--tx2); border: 1px solid var(--line); }
  /* 周小计行（展开卡内记录时按周聚合） */
  .log-week { font-family: var(--mono); font-size: var(--fs-xs); color: var(--tx2); background: var(--card2); border: 1px dashed var(--line); border-radius: 8px; padding: 4px 10px; margin: 8px 0 2px; font-feature-settings: "tnum"; overflow-wrap: break-word; }
  .log-week:first-child { margin-top: 2px; }
  /* ?debug 自检面板（仅 ?debug 访问时注入） */
  #dbg-panel { position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 90; max-width: 560px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-family: var(--mono); font-size: var(--fs-xs); line-height: 1.8; color: var(--tx); box-shadow: var(--panel-shadow); max-height: 46vh; overflow: auto; font-feature-settings: "tnum"; }
  #dbg-panel .dbg-head { font-weight: 700; font-size: var(--fs-sm); margin-bottom: 4px; }
  #dbg-panel .ok { color: var(--green); }
  #dbg-panel .fail { color: var(--red); overflow-wrap: break-word; }

  /* ===== 视觉层级约定：三级文字 × 字号配对 =====
   * 一级 主数值：color 继承 var(--tx) + font-weight 700 + --fs-lg/md
   *      —— 页面上最该先看到的数字（总资产、盈亏、收益率…）
   * 二级 标签  ：var(--tx2) + 400 + --fs-xs
   *      —— 说明这个数字是什么（「总资产」「本期盈亏」…）
   * 三级 小注  ：var(--tx3) + 400 + --fs-xs/xxs
   *      —— 单位、来源、口径提醒、日期（缺了不影响使用，所以最小最灰）
   * 两条禁忌：口径说明不得用一/二级色（会喧宾夺主）；主数值不得用三级灰。
   * 例外：浮层/面板（指数浮层、买点提示、自检面板）是自成一体的表面，其正文用一级色不算倒挂。
   * 自检结果：正文区 --fs-xxs 的小注中无一级色，--fs-hero 的标题中无三级色，无倒挂。 */
  /* ===== 资产走势 ===== */
  .trend-card { padding: 10px 8px 6px; }
  #trend-box { width: 100%; min-width: 0; }
  #trend-box svg { display: block; }
  .trend-empty { font-size: var(--fs-xs); color: var(--tx3); text-align: center; padding: 24px 8px; line-height: 1.7; }
  /* 图例：内容**随视图变化**（见 renderTrendLegend）。
     原先图例写死在 HTML 里、永远是「总资产 / 累计投入」——切到收益率/回撤/盈亏全程时
     图上的线根本不是这两条，属于误导。现由 JS 按 trendView 生成。
     线型语言（四个视图共用）：主序列＝实线 2px｜参考序列＝虚线 2px｜成本＝虚线 1.5px｜负向＝实线 2px。 */
  .trend-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; font-size: var(--fs-xs); color: var(--tx3); padding: 7px 4px 4px; }
  .trend-legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--blue); vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  .trend-legend i.cost { border-top-style: dashed; border-top-color: var(--cyan); }
  .trend-legend i.base { border-top-color: var(--tx); border-top-style: dashed; }   /* 与图内基准线同色 */
  .trend-legend i.dn { border-top-color: var(--down); }
  /* 盈亏全程的两条分量线（2026-10-04）：场内＝青、场外＝黄；**虚线**（与合计的实线区分，
     用户 2026-10-04 意见："场内/外可以用虚线，视觉更清楚"）→ 图例色块也同步为虚线。 */
  .trend-legend i.cyan { border-top-color: var(--cyan); border-top-style: dashed; }
  .trend-legend i.yellow { border-top-color: var(--yellow); border-top-style: dashed; }
  .trend-legend .tdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--blue); background: var(--card); vertical-align: middle; margin-right: 4px; }
  .trend-legend .sq { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 3px; vertical-align: middle; }
  /* 结论行：紧跟 KPI 行、与它同属一块（不再是个独立分节）。
     只写 KPI 里没有的区间结论——「当前收益率」「最深浮亏」这类 KPI 已有的数，
     原来在两处各说一遍，现在只留一处。为空时整行不占位。
     ⚠ 口径说明（「按 TWR 方式逐期剔除转入/转出…」）原先混在结论句里，420px 下折成
     2~3 行灰字，把结论本身淹掉了。现收进 ⓘ：默认只显示 1 行结论，点 ⓘ 才展开口径。 */
  .trend-sum { font-size: var(--fs-xs); color: var(--tx2); text-align: center; padding: 0 4px 2px; line-height: 1.6; margin: -6px 0 10px; }
  .trend-sum:empty { display: none; }
  .trend-sum b { font-family: var(--mono); font-weight: 700; font-feature-settings: "tnum"; }
  .trend-sum .sum-info { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; margin-left: 5px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--tx3); font: 700 var(--fs-xxs)/1 var(--mono); vertical-align: 1px; cursor: pointer; }
  .trend-sum .sum-info[aria-expanded="true"] { border-color: var(--accent-line); background: var(--accent-bg); color: var(--blue); }
  .trend-sum .sum-note { margin-top: 6px; padding: 6px 8px; border-radius: 8px; background: var(--card2); border: 1px solid var(--line-soft); color: var(--tx3); font-size: var(--fs-xxs); line-height: 1.7; text-align: left; }
  .trend-sum .sum-note[hidden] { display: none; }
  /* 归因行的资金拆分小注（银证实锤 + 场外估） */
  .snap-sub { font-size: var(--fs-xxs); color: var(--tx3); font-weight: 400; }   /* 小注嵌在加粗数值里时也不跟着加粗 */
  /* 资产走势：KPI 行 / 时间 chips / crosshair 读数条 / 图例开关 */
  /* KPI 行 2×2（恒为 4 项，见 renderTrendKpis）。
     原先 5 项 + 窄屏改 2 列：第 5 项「最大浮亏」在 420px 下占第三行左半边、右侧悬空，
     既不齐也不平衡。已精简为 4 项（TWR 并入「当前收益率」的次行说明），任何宽度都正好 2×2。 */
  .trend-kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 10px; }
  .trend-kpis .k-val { font-size: var(--fs-lg); }   /* 2 列下每格 ~172px，主数值升一档建立层级 */
  .trend-kpis .k-label, .trend-kpis .k-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* chips：视图切换 + 时间范围 —— **一律折行显示，全部标签直接可见**。
     原为一条可横滑的带子（nowrap + overflow-x）：手机宽度下「回撤 / 区间统计 / 全部」被切在屏幕外，
     得左右滑动才找得到；折行最多两行，用一点高度换「一个标签都不用找」。 */
  .trend-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 2px 8px; }
  .trend-bar { display: flex; align-items: center; gap: 6px 8px; margin: 0 2px 8px; flex-wrap: wrap; }
  .trend-bar .trend-chips { margin: 0; flex-wrap: wrap; }
  /* 时间范围组**紧跟**视图组自然顺排（不再 margin-left:auto 顶到最右）。
     原因：auto 边距 + 10px 左内边距 + 1px 分隔线共占 11px，420px 实测「全部」正好被挤出第一行，
     孤零零占掉第二行右端。去掉后六个 chip 一行放得下（含 20px 余量），真挤不下时也是左对齐折行。 */
  .trend-bar .trend-chips + .trend-chips { margin-left: 8px; }
  .tchip { font-size: var(--fs-xs); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--tx2); cursor: pointer; font-family: var(--mono); white-space: nowrap; }
  /* 窄屏把 chip 与间距各收 1~2px：六个 chip 在 375~390px 也能排成一行（原先差约 7px 会折行） */
  @media (max-width: 480px) {
    .tchip { padding: 3px 7px; }
    .trend-chips { gap: 5px; }
    .trend-bar { gap: 5px 7px; }
  }
  .tchip.on { background: var(--accent-bg); color: var(--blue); border-color: var(--accent-line); font-weight: 600; }
  /* disabled 的 chip 仅靠 opacity:.35 与 --tx3 接近，用户以为渲染 bug；补 not-allowed + 删除线 */
  .tchip:disabled { opacity: .35; cursor: not-allowed; text-decoration: line-through; }

  /* 读数条：金额视图 = 三层结构（状态头 / 三列主数 / 归因等式），左对齐、预留 78px 高度；
     其余三个视图是单行居中，高度**自适应**——原先无条件预留 78px，单行时白留约 46px 空白。
     .live = 正在看某一期（滑动 / 悬停），边框点亮，用以区别「默认显示最新一期」。 */
  .trend-readout { font-size: var(--fs-xs); color: var(--tx2); font-family: var(--mono); font-feature-settings: "tnum"; text-align: center; padding: 6px 8px; margin-bottom: 6px;
 background: var(--card2); border: 1px solid var(--line-soft); border-radius: 8px; line-height: 1.6; display: flex; flex-direction: column; justify-content: center; }
  .trend-readout.live { border-color: var(--accent-line); }
  .trend-readout b { color: var(--tx); }
  /* ↓ 金额视图的三层结构：状态头 / 三列主数 / 归因等式 */
  .trend-readout.ro-rich { text-align: left; min-height: 78px; }
  .trend-readout .nb { white-space: nowrap; }
  /* 窄屏口径行必须能折行（2026-10-04）：「盈亏全程」视图那条口径文案很长，nowrap 下它会以单行
     摊开（实测 739px，把 390px 视口顶出 381px 横向滚动）。光去掉 nowrap 不够 —— 它在 .ro-attr
     这个 flex 行里受「min-width:auto」保护、不肯收缩 ✗ → 窄屏改为块级整行 ＋ 允许任意断行。 */
  @media (max-width: 430px) {
    .ro-attr { display: block; }
    .ro-attr .nb, .trend-readout .nb { white-space: normal; display: block; min-width: 0; overflow-wrap: anywhere; }
    /* ⚠ 内层的 .ro-k 自己带 nowrap（实测它才是那个 739px 的元凶，光改 .nb 无效）→ 必须一并放开 */
    .ro-attr .ro-k, .trend-readout .ro-k { white-space: normal; overflow-wrap: anywhere; }
  }
  .ro-head { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin-bottom: 5px; font-size: var(--fs-xxs); color: var(--tx3); }
  .ro-date { color: var(--tx); font-weight: 700; white-space: nowrap; }
  .ro-badge { padding: 0 5px; border-radius: 999px; border: 1px solid var(--line-soft); white-space: nowrap; }
  .ro-badge.snap { color: var(--up); }
  .ro-badge.est { color: var(--info); }
  .ro-badge.evt { color: var(--purple); border-color: var(--purple-line); }   /* 该期事件标签（加仓/减仓…）*/
  .ro-pos { margin-left: auto; white-space: nowrap; }
  /* 三列主数：**标签与数值同一行**（原先标签另起一行，被读成「标签折行」）。
     每个「标签 数值」是原子单元，窄屏整块换行，绝不把标签和数字拆开。 */
  .ro-grid { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .ro-cell { display: inline-flex; align-items: baseline; gap: 5px; min-width: 0; white-space: nowrap; }
  .ro-k { font-size: var(--fs-xxs); color: var(--tx3); }
  .ro-v { color: var(--tx); font-weight: 700; white-space: nowrap; }
  .ro-v.up { color: var(--up); } .ro-v.down { color: var(--down); }
  .ro-sub { font-size: var(--fs-xxs); color: var(--tx3); white-space: nowrap; }
  .ro-attr { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 3px; margin-top: 5px; padding-top: 5px; border-top: 1px dashed var(--line-soft); font-size: var(--fs-xxs); color: var(--tx3); }
  .ro-attr b { color: var(--tx); }
  .ro-attr b.up { color: var(--up); } .ro-attr b.down { color: var(--down); } .ro-attr b.info { color: var(--info); }
  /* 归因行：一组「原子单元」（标签＋数值＋方向词），单元内绝不折行，折行只发生在单元之间 */
  .ro-attr .nb { white-space: nowrap; }
  .ro-attr .ro-op { color: var(--tx3); }
  /* 方向词的颜色：.ro-attr 自身设了灰色，会盖掉全局 .up/.down/.info，故显式覆盖 */
  .ro-attr .ro-w.up { color: var(--up); }
  .ro-attr .ro-w.down { color: var(--down); }
  .ro-attr .ro-w.info { color: var(--info); }
  /* 区间统计读数：并入读数条（原为图表上方独立一行，白占一行高度） */
  .ro-sel { margin-top: 5px; padding-top: 5px; border-top: 1px dashed var(--line-soft); font-size: var(--fs-xxs); color: var(--tx3); line-height: 1.7; }
  .ro-sel b { color: var(--tx); font-weight: 700; }
  .ro-sel b.up { color: var(--up); } .ro-sel b.down { color: var(--down); }
  .ro-sel .nb { white-space: nowrap; }
  .trend-dot.sel { stroke: var(--warn); stroke-width: 4; }
  #trend-box { touch-action: pan-y; }   /* 纵向滚动留给页面，横向滑动供 crosshair 吸附 */
  .lg-toggle { background: none; border: none; color: inherit; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 0; }
  .lg-toggle:not(.on) { opacity: .4; text-decoration: line-through; }
  /* 场内账户统计卡：月度盈亏柱 + 交易统计 KPI */
  .acct-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .acct-stats.acct3 { grid-template-columns: repeat(3, 1fr); }   /* 2026-09-30：删掉「盈 / 亏持仓」那格后剩 3 格 */
  .acct-stats .k-label { line-height: 1.4; }
  @media (max-width: 480px) { .acct-stats { grid-template-columns: repeat(2, 1fr); } }
  /* 相对基准：一行结论（跑赢/跑输多少 pp）+ 月度差值 chips，与 .lad-chip 同一套视觉语言 */
  .bench-row { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line-soft); font-size: var(--fs-sm); }
  .bench-row .bench-l { font-weight: 600; color: var(--tx2); white-space: nowrap; }
  .bench-row b { font-family: var(--mono); font-weight: 700; font-feature-settings: "tnum"; }
  .bench-row .bench-sub { margin-left: auto; font-family: var(--mono); font-size: var(--fs-xxs); color: var(--tx3); white-space: nowrap; }
  .bench-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .bench-chip { font-family: var(--mono); font-size: var(--fs-xxs); font-weight: 700; border: 1px solid; border-radius: var(--radius-xs); padding: 1px 6px; white-space: nowrap; font-feature-settings: "tnum"; }
  .bench-chip.up { color: var(--up); border-color: var(--up-line); background: var(--up-bg); }
  .bench-chip.down { color: var(--down); border-color: var(--down-line); background: var(--down-bg); }

  /* ── 场外账户统计（2026-10-10 加）────────────────────────────────────────────────
     逐渠道行＝「名称 ｜ 条形 ｜ 全年」＋ 脚注（脚注跨列、窄屏自然折行 ✓）。
     条形**自左向右** ∝ |全年| ✓（同一把尺 ✓）；颜色走本页的 --up / --down ✓（绿＝盈、红＝亏 ✓）。 */
  .otc-rows { margin-top: 10px; border-top: 1px dashed var(--line-soft); padding-top: 8px; }
  .otc-row { display: grid; grid-template-columns: minmax(84px, max-content) 1fr auto; align-items: center;
    gap: 4px 8px; padding: 5px 0; border-bottom: 1px solid var(--line-soft); font-size: var(--fs-sm); }
  .otc-row:last-child { border-bottom: 0; }
  .otc-nm { display: flex; align-items: center; gap: 4px; min-width: 0; white-space: nowrap; }
  .otc-track { position: relative; height: 10px; background: var(--card2); border-radius: 5px; overflow: hidden; }
  .otc-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; min-width: 2px; }
  .otc-fill.up { background: var(--up); }
  .otc-fill.down { background: var(--down); }
  .otc-v { font-family: var(--mono); font-weight: 700; font-feature-settings: "tnum"; white-space: nowrap; }
  .otc-sub { grid-column: 2 / -1; font-size: var(--fs-xxs); color: var(--tx3); }
  /* 「10 月 · 进行中」：虚线框 ＋ 弱化 ✓ —— 与财务页那条同一条纪律（不入合计 ✓） */
  .otc-mtd { margin-top: 8px; padding: 6px 8px; border: 1px dashed var(--line); border-radius: var(--radius-xs);
    font-size: var(--fs-xxs); color: var(--tx2); line-height: 1.6; }
  .otc-mtd b { font-family: var(--mono); color: var(--tx); }

  /* ── 场外卡的下钻（2026-10-10：点柱 → 该月逐渠道；点渠道行 → 该渠道逐月）─────────────────
     命中带（.otc-band）铺满整列 ✓ —— 柱子才 3px 宽，点不中 ✗（与归因列头图同一手法 ✓）；
     选中态：柱加描边 ✓、行加浅底 ✓（一眼看出点中了哪一格 ✓）。
     面板沿用页内细字语言（--fs-xxs / --mono ✓），「未开户」压暗但**不隐藏** ✓（那是信息，不是空 ✗）。 */
  #otc-acct-card svg.sa-otc { display: block; max-width: 100%; }
  #otc-acct-card svg.sa-otc:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: var(--radius-xs); }
  .otc-band { fill: transparent; cursor: pointer; }
  .otc-band:hover { fill: rgba(147, 163, 187, .10); }
  .otc-band.on { fill: rgba(91, 163, 255, .12); }
  .otc-bar.on { stroke: var(--blue); stroke-width: 1.4; }
  .otc-row.sel { background: rgba(91, 163, 255, .10); border-radius: var(--radius-xs); }
  .otc-hint { color: var(--tx3); }
  .otc-panel { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line-soft); border-radius: var(--radius-xs);
    background: var(--card2); }
  .otc-ph { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px;
    font-size: var(--fs-xs); color: var(--tx2); }
  .otc-ph b { font-family: var(--mono); color: var(--tx); font-feature-settings: "tnum"; }
  /* ⚠ 「← 收起」按钮**放在标题前面** ✓（2026-10-10 改）—— 与页内其它面板同一套语言：
     归因面板的「← 返回」都在标题左侧 ✓，原来我这里用 margin-left:auto 推到最右 ✗ →
     与全页不一致 ✓，窄屏折行时还容易读成"两个东西"✓。删掉 auto 边距 ✓（按钮自身带 margin-right ✓）。 */
  .otc-prow { display: grid; grid-template-columns: minmax(72px, max-content) 1fr auto 34px; align-items: center;
    gap: 6px; padding: 3px 0; font-size: var(--fs-xxs); }
  .otc-pnm { color: var(--tx2); white-space: nowrap; }
  .otc-pv { font-family: var(--mono); font-weight: 700; font-feature-settings: "tnum"; white-space: nowrap; text-align: right; }
  .otc-pp { font-family: var(--mono); color: var(--tx3); text-align: right; }
  .otc-track.otc-na { background: none; border-top: 1px dashed var(--line); height: 1px; border-radius: 0; }
  .otc-pnote { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line-soft);
    font-size: var(--fs-xxs); color: var(--tx3); line-height: 1.6; }

  /* ── 「预估 vs 实际」对账区（2026-10-12 加，挂在「场外当日预估」块内 ✓）───────────────
     与上方预估表同一套表格语言（复用 .est-tbl / .e-mid ✓），只在外面加一层虚线分隔 ✓；
     "暂无对账"那版是一段细字 ✓（不是空表 ✗ —— 空表会让人以为"对账结果是零"✓）。 */
  .est-cmp { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line-soft); }
  .est-cmp .ec-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px;
    font-size: var(--fs-xs); color: var(--tx2); }
  .est-cmp .ec-head b { font-family: var(--mono); color: var(--tx); }
  .est-cmp .ec-hint { font-size: var(--fs-xxs); color: var(--tx3); }
  .est-cmp .ec-tbl td.e-mid { font-family: var(--mono); font-feature-settings: "tnum"; }
  .est-cmp.wait { font-size: var(--fs-xxs); color: var(--tx3); line-height: 1.65; }
  .est-cmp.wait b { color: var(--tx2); font-family: var(--mono); }
  /* 清仓历史：名称（带代码）左、兑现盈亏右；末行合计与上方虚线分隔 */
  .closed-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--line-soft); font-size: var(--fs-sm); }
  .closed-row:last-of-type { border-bottom: 0; }
  .closed-row .c-nm { min-width: 0; }
  .closed-row .c-nm b { font-weight: 600; color: var(--tx2); }
  .closed-row .c-code { font-family: var(--mono); font-size: var(--fs-xxs); color: var(--tx3); margin-left: 6px; }
  /* 明细行的元信息（持有区间 · 天数 · 收益率 · 投入 ≈ · 清仓后）：比正文小一号、等宽数字，便于竖着扫 */
  .closed-row .c-meta { font-family: var(--mono); font-size: var(--fs-xxs); color: var(--tx3); margin-top: 2px; font-feature-settings: "tnum"; }
  .closed-row .c-v { font-family: var(--mono); font-weight: 700; text-align: right; white-space: nowrap; font-feature-settings: "tnum"; }
  .closed-total { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 6px; padding-top: 7px; border-top: 1px dashed var(--line-soft); font-size: var(--fs-sm); }
  .closed-total b { font-family: var(--mono); font-weight: 700; font-feature-settings: "tnum"; }
  /* 清仓结论：左侧细条作锚点（与快照卡的 .lead 同一手法，不铺底色块） */
  .closed-lead { font-size: var(--fs-xs); color: var(--tx2); line-height: 1.6; border-left: 2px solid var(--info); padding: 1px 0 1px 8px; margin: 9px 0 2px; }
  /* 结果侧汇总（2026-09-30 加）：标签列 + 数字/文字，全部由明细现算。
     与下面的 .closed-lead 分工：这里是**可对账的数字**，那条是**一句话判断**，不再重复。 */
  .closed-brief { margin-top: 9px; border-top: 1px dashed var(--line-soft); padding-top: 7px; display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; font-size: var(--fs-xs); }
  .closed-brief .b-k { color: var(--tx3); white-space: nowrap; }
  .closed-brief .b-v { color: var(--tx2); line-height: 1.5; }
  .closed-brief .b-v b { font-family: var(--mono); font-weight: 700; font-feature-settings: "tnum"; }
  .closed-brief .b-v.miss { color: var(--tx3); }   /* 缺数据如实标「—」，不拿估算冒充 */
  /* 全部明细：原生 details 折叠，默认收起（17 行全铺会盖过上面的结论） */
  .closed-all { margin-top: 8px; border-top: 1px dashed var(--line-soft); padding-top: 7px; }
  .closed-all > summary { cursor: pointer; font-size: var(--fs-xs); color: var(--tx3); list-style: none; }
  .closed-all > summary::-webkit-details-marker { display: none; }
  .closed-all > summary::before { content: "▸ "; }
  .closed-all[open] > summary::before { content: "▾ "; }
  .closed-all[open] > summary { margin-bottom: 2px; }
  .trend-dot { cursor: pointer; }
  .footer { text-align: center; font-size: var(--fs-xs); color: var(--tx3); margin: 20px auto 0; max-width: 720px; line-height: 1.8; }

  @media (max-width: 480px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .sum-cell .s-val { font-size: var(--fs-lg); }
  }
  /* 中窄屏（≤440px，含 411dp 机型）：只留金额，收益率后缀让位给条形，防标注溢出 */
  /* 原窄屏（≤440px）会隐藏收益率以换取空间——那是标注挤在条端时的妥协；
     改成独立列后金额与收益率同列两行，两者都留得住，故移除该规则。 */
  @media (max-width: 400px) {
    .sum-grid { grid-template-columns: repeat(2, 1fr); }   /* 末格跨 2 列＝整行，见 .sum-grid .sum-cell:last-child */
    .sum-cell { padding: 8px 4px; }
    .sum-cell .s-val { font-size: var(--fs-md); }
    .pl-nm { font-size: var(--fs-sm); }   /* 更窄的机型各收一号，行高更紧凑 */
    .pl-amt { font-size: var(--fs-md); }
    .snap-line { grid-template-columns: 58px 1fr; }   /* 窄屏收紧标签列，保住内容列宽度 */
    .snap-part { grid-template-columns: 58px 1fr auto; }   /* 与 .snap-line 同步收窄，保持一致 */
    /* 本金与收益三格条：窄屏每格只剩 ~106px，把内边距与运算符列收紧，保住数值列（最长 7 字符 ≈ 55px） */
    .prin-kpis { gap: 4px; }
    .prin-kpis .pk { padding: 6px 7px 5px; }
    .prin-kpis .pk-op { font-size: var(--fs-xs); }
    .snap-line.item { grid-template-columns: 1fr 116px; }   /* 合并列后同 116px，比原来的 64+72+间距更省 */
    .snap-group-title { grid-template-columns: 1fr 116px; }
    .snap-group { grid-template-columns: 1fr 64px 72px; }
    .snap-line.item .n .qty-tag { font-size: var(--fs-xxs); }
    .snap-parts { padding-left: 10px; }   /* 标签列已统一 58px，此处不再重复定义；.snap-tbl 已无缩进（2026-09-24 去引用线） */
  }
  /* 高对比偏好：--tx3 与背景对比接近 WCAG AA 下限（≈ 3.5:1），开启高对比时拉到 ≈ 5.8:1 */
  @media (prefers-contrast: more) {
    :root { --tx2: #b0bed6; --tx3: #8ea0bc; --line: #3a4c72; --line-soft: #2c3a58; }
    body.light { --tx2: #33465f; --tx3: #4a5a75; --line: #8a9ab5; --line-soft: #a8b5c8; }
  }
  /* 动效敏感用户：关闭所有动画 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
  /* 打印：强制浅色、展开全部日志、隐藏交互件 */
  @media print {
    body { background: #fff !important; color: #111 !important; }
    body:not(.light) { --bg: #fff; --card: #fff; --card2: #f5f5f5; --line: #888; --line-soft: #999; --tx: #111; --tx2: #333; --tx3: #555; }
    .theme-btn, .strat-hint, .privacy, .buy-layer, #dbg-panel, .sec-nav { display: none !important; }
    .card { break-inside: avoid; box-shadow: none; border-color: #888; }
    /* 展开全部 details（操作记录 / 快照折叠 / 分组 / 期次解读 / 清仓）。
       ⚠ summary 不能整行 display:none ——「场内 / 场外」小计、「⚠ N · M 字」、对账差异条数都长在
       summary 上，藏掉等于打印稿少了这些对账锚点；只去掉「只在屏幕上成立」的装饰与状态词。 */
    details > summary { display: revert !important; }
    details > *:not(summary) { display: revert !important; }
    .snap-more > summary::after,
    .snap-note-wrap > summary .snap-note-meta::after,
    .closed-all > summary::before,
    .pos-log > summary::after { content: "" !important; }
    .snap-note-wrap > summary .snap-note-preview { display: none !important; }   /* 打印给全文，不再给「首段截断」 */
    /* 黑白打印下青/蓝/绿会归为同一灰阶——靠线型区分（实线=资产 / 虚线=投入），
       并把两条线强制为同一黑。 */
    #trend-box svg polyline { stroke: #000 !important; }
    #trend-box svg circle { fill: #000 !important; stroke: #fff !important; }
  }

  /* ── 快照对比 · 视图切换 ＋ 盈亏归因图（2026-10-07 加）────────────────────────────────
     ⚠ #snap-attr[hidden] / #snap-list[hidden] 必须显式 display:none：
       `hidden` 属性靠 UA 样式生效，而 .card 的 display 规则会盖掉它 → 不写这两条，切走之后还看得见 ✗ */
  #snap-attr[hidden], #snap-list[hidden] { display: none; }
  .view-switch { display: flex; gap: 6px; margin: 2px 0 6px; }
  .vs-btn { font: inherit; font-size: var(--fs-xs); color: var(--tx2); background: rgba(255,255,255,.05);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .vs-btn:hover { color: var(--tx); border-color: var(--line); }
  .vs-btn.on { color: var(--blue); border-color: var(--blue); }
  .vs-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  /* 归因维度切换器（2026-10-09 加）：沿用主视图 .vs-btn 的控件语言 ✓，放在小标题之上 ✓ */
  #snap-attr .sa-dims { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 4px; }
  #snap-attr .sa-head { font-size: var(--fs-xs); color: var(--tx2); padding: 4px 0 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  #snap-attr .sa-head span { color: var(--tx3); font-size: var(--fs-xxs); }
  #snap-attr .sa-legend { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: var(--fs-xxs); color: var(--tx3); padding: 4px 0 0; }
  #snap-attr .sa-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

  /* ── 归因表「水平值 vs 变化量」一行（2026-10-09 加，B）─────────────────────────────
     起因：用户看到「全期 +8,278」与「汇总卡累计收益 +1,496」并列，问"到底赚了多少" ✗ ——
     其实两者是不同口径：全期＝**矩阵窗口内的变化量** ✓、累计收益＝**自最早记录起的水平值** ✓，
     但标签「全期」没写起点，很容易被读成"账户一共赚赔多少" ✗。
     这里把两个**水平值**并排摆出来（起点 → 末期 ✓），变化量仍留在下方「全期」行 ✓ ——
     一行小字、不占格子（矩阵本身已经够宽 ✗），配色沿用 up/down 的绿红语义 ✓（不涂灰 ✗：灰在本页＝未更新/无数据。
     水平值另一处小心：数字字体与全页统一走 --mono ＋ tnum ✓，与其它数据表一致 ✓）。 */
  #snap-attr .sa-base { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px;
    padding: 3px 0 0; font-size: var(--chk-fs); font-family: var(--mono); font-feature-settings: "tnum"; }
  #snap-attr .sa-base .sa-arrow { color: var(--tx3); }
  #snap-attr .sa-base .sa-hint { font-family: var(--sans); font-size: var(--chk-fs-mini); color: var(--tx3); font-weight: 400; }
  /* 「全期」那一格的起点日期：换行显示（写在同行会把「期」列撑宽 ✗ → 挤压后面的列 ✓） */
  #snap-attr table.sa-mx td.mx-d .mx-since { display: block; font-size: var(--chk-fs-mini); color: var(--tx3); font-weight: 400; }

  /* ── 归因矩阵「期初结转」行（2026-10-09 加，A）─────────────────────────────────────
     它不是"一期"，而是一段**区间**（账户起点 → 基准期 ✓）→ 视觉上必须与期行分开 ✓：
     虚线分隔 ＋ 标签更醒目（把 .mx-since 那行压回常规字重 ✓，避免与期行的日期混淆 ✗）。
     数值照旧走 up/down 的绿红 ✓、底色照旧对数尺度 ✓ —— 不涂灰 ✗（灰在本页＝未更新 / 无数据 ✓）。 */
  #snap-attr table.sa-mx tbody tr.mx-carry > td { border-top: 1px dashed var(--line-soft); }
  #snap-attr table.sa-mx tbody tr.mx-carry .mx-d { font-weight: 700; letter-spacing: .02em; }

  /* ── 归因矩阵三级下钻（2026-10-09 第三步）───────────────────────────────────────────
     选中态要**一眼可辨**（否则点完不知道点中了哪 ✓）：格子环形描边 ＋ 表头列高亮 ＋ 该行日期/合计格染色 ✓。
     ⚠ 行染色只挑 mx-d / mx-sum 两格：数据格有**内联 background**（对数色阶 ✓），
       样式表里的 background-image 盖不过内联的 background 简写 ✗ → 硬染会白费力气 ✓ */
  /* ── 期列可点（2026-10-10）───────────────────────────────────────────────────────
     用户：「快照对比 好像不能点击一行，我建议点击日期的时候可以体现这一行的数据」✓
     行为修在 JS（saCur 提升为模块级 ✓），这里只给**可点的样子**：
     ⚠ 不给 tabindex ✗ —— 矩阵的 Tab 位是"整表只有一个"（roving ✓，门禁盯着 ✓），
       给每行日期格加 Tab 位会把那条契约打破 ✗（键盘改期走 ↑/↓ 方向键 ✓）。 */
  #snap-attr table.sa-mx td.mx-dpick { cursor: pointer; }
  /* ⚠ 悬停底色用 background-image（叠加在 sticky 列的不透明打底之上 ✓）——
     写成 background 简写会把打底一并清掉 ✗ → 期列在悬停瞬间变半透明、滑过去的数字透出来 ✗ */
  #snap-attr table.sa-mx td.mx-dpick:hover { background-image: linear-gradient(rgba(147, 163, 187, .10), rgba(147, 163, 187, .10)); }
  #snap-attr table.sa-mx td.mx-click { cursor: pointer; }
  #snap-attr table.sa-mx td.mx-click:hover { box-shadow: inset 0 0 0 1px rgba(147, 163, 187, .55); }
  #snap-attr table.sa-mx td.mx-click:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  #snap-attr table.sa-mx td.mx-sel { box-shadow: inset 0 0 0 2px var(--blue); }
  #snap-attr table.sa-mx th.mx-selc { color: var(--tx); text-decoration: underline; }
  /* 选中行底色：期列（sticky ✓ 有不透明打底 ✓）用**叠加层** ✗ 不能覆盖底色 ✓；其余格照旧 ✓ */
  #snap-attr table.sa-mx tbody tr.mx-hlr > td.mx-d { background-image: linear-gradient(rgba(147, 163, 187, .14), rgba(147, 163, 187, .14)); }
  #snap-attr table.sa-mx tbody tr.mx-hlr > td.mx-sum { background: rgba(147, 163, 187, .14); }

  /* ── 「← 返回 / ← 收起」小按钮（**页面级** ✓，2026-10-10 从 `#snap-attr .sa-back` 改过来）──────
     ⚠ 起因就是用户报的那个 bug：「逐渠道明细 后面那个 收起 UI 有 bug」✓
       原来写成 `#snap-attr .sa-back { … }` ✗ —— 只有归因面板里命中 ✓；
       而「场外账户统计」卡里用了**同一个 class** ✓ → 选择器命不中 ✗ → 那个「← 收起」掉回
       浏览器**默认按钮外观** ✗（灰底、系统字体、比旁边文字大一截 ✓）。
     → 去掉作用域前缀 ✓：类名不变 ✓、两处外观自动一致 ✓，以后第 3 处再用也不会重犯 ✓。
     ⚠ 页面级原子件只依赖 **:root 令牌** ✓（--chk-fs-mini / --line-soft / --blue 都在 :root ✓），
       不许写"某个卡片里的局部变量"✗ —— 否则又是"换个地方就失效"✓。
     ▸ 防回归：scripts/dom-check.mjs ④p 断言这条规则**不带作用域前缀** ✓（就是拦这类 bug ✓）。 */
  .sa-back {
    font-size: var(--chk-fs-mini); font-family: var(--sans); color: var(--tx2);
    background: none; border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 5px;
    margin-right: 2px; cursor: pointer; white-space: nowrap;
  }
  .sa-back:hover { color: var(--tx); border-color: var(--blue); }
  .sa-back:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  /* ── 下钻面板（三级视图共用）───────────────────────────────────────────────────── */
  #snap-attr .sd-click { cursor: pointer; border-radius: 4px; }
  #snap-attr .sd-click { cursor: pointer; border-radius: 4px; }
  #snap-attr .sd-click:hover { background: rgba(147, 163, 187, .12); }
  #snap-attr .sd-click:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  /* 轨迹里"一期一大块"：块间虚线分隔 ✓（与矩阵的期行分隔同一语言 ✓） */
  #snap-attr .sd-hrow { padding: 2px 0 3px; border-top: 1px dashed var(--line-soft); }
  #snap-attr .sd-hrow:first-child { border-top: 0; }
  #snap-attr .sd-hd { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap;
    font-size: var(--chk-fs-mini); color: var(--tx3); font-family: var(--mono); }
  #snap-attr .sd-hd b { color: var(--tx2); }
  #snap-attr .sd-hd i { font-style: normal; }
  #snap-attr .sd-ev { font-size: var(--chk-fs-mini); font-family: var(--sans); color: var(--tx3);
    background: rgba(147, 163, 187, .10); border-radius: 3px; padding: 0 4px; }
  #snap-attr .sd-cmp { font-size: var(--chk-fs-mini); color: var(--tx3); font-family: var(--mono); padding-left: 2px; }

  /* ── 归因矩阵：列头可点 ＋ 该列图表（2026-10-09 第四步 A）─────────────────────────────
     列头沿用"可点元素"那套反馈（hover 下划线 / focus 环 ✓），与格子(.mx-click)一致 ✓ */
  #snap-attr table.sa-mx th[data-colhead] { cursor: pointer; }
  #snap-attr table.sa-mx th[data-colhead]:hover { color: var(--tx); text-decoration: underline; }
  #snap-attr table.sa-mx th[data-colhead]:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  #snap-attr table.sa-mx th[data-onsel] { color: var(--tx); text-decoration: underline; }
  /* 图：与仓库其它图同一套（真实像素宽 ＋ viewBox ✓）；
     text 的 fill 必须带 !important —— 本容器内的变量被更具体选择器污染过 ✗（见上方四轮修正的注释 ✓） */
  /* ⚠ `height: auto` 是必需的 ✗ 别改成固定高：
     svg 带 width/height 属性 ✓，但容器可能比它窄 ✗ → 只给 max-width:100% 的话，
     svg 的 **box** 变窄而**高度不变** ✗ → 比例与 viewBox 不符 → preserveAspectRatio 默认(meet)
     会把内容**上下居中留白** ✓ —— 留白那几像素上没有命中带 ✗（2026-10-09 实测：悬停到累计面板底部"没反应" ✓）。
     `width:100% ＋ height:auto` 让 box 与 viewBox 同比例 ✓ → 无留白 ✓ 整块命中区都有效 ✓。 */
  #snap-attr .sa-chart-svg { display: block; margin: 4px 0 3px; width: 100%; height: auto; }
  #snap-attr .sa-chart-svg .sa-bar { cursor: pointer; }
  #snap-attr .sa-chart-svg .sa-bar.up { fill: rgba(45, 212, 167, .78); }
  #snap-attr .sa-chart-svg .sa-bar.down { fill: rgba(224, 87, 107, .78); }
  #snap-attr .sa-chart-svg .sa-bar:hover, #snap-attr .sa-chart-svg .sa-bar:focus-visible { fill: var(--blue); }
  #snap-attr .sa-chart-svg text { font-family: var(--mono); font-size: 9px; fill: #93a3bb !important; }

  /* ── 列头图的交互层（2026-10-09 第四步 B：A1~A4）──────────────────────────────────────
     命中测试规则：**装饰元素一律不吃指针** ✓（线 / 文字 / 折线 / 圆点 / 高亮圈 ✓），
     只有**整列命中带** .sa-band 吃 ✓ → 于是"悬停在图上任意一处"都能稳定命中某一期 ✓，
     不会出现"指针压在折线上就没反馈"的坏体验 ✓（圆点小、本来就点不中 ✗）。 */
  #snap-attr .sa-chart-svg line,
  #snap-attr .sa-chart-svg text,
  #snap-attr .sa-chart-svg polyline,
  #snap-attr .sa-chart-svg circle { pointer-events: none; }
  #snap-attr .sa-chart-svg rect.sa-bar { pointer-events: none; }
  #snap-attr .sa-chart-svg rect.sa-band { pointer-events: all; fill: transparent; cursor: pointer; }
  /* 选中/悬停的那一期：整列淡淡染一层 ✓（比十字虚线更轻、也不挡数据 ✓） */
  #snap-attr .sa-chart-svg rect.sa-band.on { fill: rgba(147, 163, 187, .13); }
  #snap-attr .sa-chart-svg rect.sa-band:focus-visible { outline: none; }
  #snap-attr .sa-chart-svg:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  /* 读数行（A2）：**固定一行** ✓ —— 内容长短变化不让下方图上下跳 ✓（min-height 兜住两行 ✓） */
  #snap-attr .sa-ch-read { font-size: var(--chk-fs-mini); color: var(--tx3); font-family: var(--mono);
    font-feature-settings: "tnum"; min-height: 13px; padding: 1px 0 2px; line-height: 1.45; }
  #snap-attr .sa-ch-read b { color: var(--tx2); }

  /* ── 整表累计对比：图例（2026-10-09 加 ③）───────────────────────────────────────────
     线多（6 条）时不标线端 ✗（易撞 ✓）→ 图下一行色块 ＋ 名 ＋ **终值** ✓（按 |值| 排序 ✓）。 */
  #snap-attr .sa-all-legend { display: flex; flex-wrap: wrap; gap: 3px 12px; padding: 2px 0 3px;
    font-size: var(--chk-fs-mini); color: var(--tx3); font-family: var(--mono); font-feature-settings: "tnum"; }
  #snap-attr .sa-all-k { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; border-radius: 3px; }
  /* 被点亮的那条（2026-10-10 ✓）：文字提亮 ＋ 色块加一圈晕 ✓ —— 与"线被压暗"配合，一眼看出是哪条 ✓ */
  #snap-attr .sa-all-k.on { color: var(--tx); }
  #snap-attr .sa-all-k.on i { box-shadow: 0 0 0 2px rgba(147, 163, 187, .4); }
  #snap-attr .sa-all-k:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  #snap-attr .sa-all-k i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; }
  /* ── 整表累计曲线：关键点位 ＋ 悬停层（2026-10-12 加）────────────────────────────────
     装饰元素继续**不吃指针** ✓（见上方那条 `polyline / circle { pointer-events: none }`）——
     悬停由 svg 自己接 ✓，于是"指针压在线上"也不会挡住读数 ✓。 */
  #snap-attr .sa-chart-svg circle.sa-kp { fill: var(--bg); stroke: var(--tx2); stroke-width: 1.2; }
  #snap-attr .sa-chart-svg circle.sa-kp[data-kp="最高"] { stroke: var(--up); }
  #snap-attr .sa-chart-svg circle.sa-kp[data-kp="最低"] { stroke: var(--down); }
  #snap-attr .sa-chart-svg circle.sa-kp[data-kp="最新"] { stroke: var(--tx); stroke-width: 1.6; }
  #snap-attr .sa-chart-svg line.sa-xh { stroke: var(--tx3); stroke-width: 1; stroke-dasharray: 3 3; }
  #snap-attr .sa-chart-svg { cursor: crosshair; }
  /* 读数行固定一行高 ✓（内容长短变化不让下方图上下跳 —— 与列头图的 .sa-ch-read 同一规矩 ✓） */
  #snap-attr .sa-ch-read[data-allread] { min-height: 26px; }
  #snap-attr .sa-all-k b { font-weight: 700; }
  #snap-attr .sa-chart-note { font-size: var(--chk-fs-mini); color: var(--tx3); line-height: 1.5; padding-top: 3px; }

  /* ── 盈亏归因矩阵 · 修复（2026-10-07，用户报「样式错了」＋「明细柱状图没了」）──────────────
     取证结论（截图 ＋ 探针，非推测）：
     ① 文字色变量被污染：`:root` 的 --tx = #e2e9f5（浅色 ✓），但在 #snap-attr 内解析成
        **#16243b**（深色 ✗）—— 某处浅色主题变量块在 .card 作用域里重定义了它 ✗
        → 之前「外链 color:var(--tx)」与「内联 color:var(--tx)」两条路都白试，就是这个原因 ✓
        → 这里在本容器内**重新声明**为浅色值（下游 th/td/明细全部自动跟着变 ✓）
     ② 明细横条**根本没渲染**：探针确认样式表里没有 .sd-bar 规则 → display:inline、width:0 ✓
        → 下面把 .sa-detail / .sd-* 整套补回（这段曾随一次撤回丢失 ✗）
     ③ 表头与日期列被挤到 22~44px → 文字折行、矩阵显得又高又乱 ✓
        → 显式 nowrap（窄屏靠横向滚动、不折行 ✗ 折行会把行高撑爆 ✓） */
  #snap-attr { --tx: #e2e9f5; --tx2: #c8d3e4; --tx3: #93a3bb; }
  #snap-attr table.sa-mx { width: max-content; min-width: 100%; }
  #snap-attr table.sa-mx th, #snap-attr table.sa-mx td { white-space: nowrap; }
  #snap-attr table.sa-mx .mx-d { color: var(--tx3); font-size: var(--chk-fs-mini); }   /* 期列：与其它数据表的小字同档 ✓ */
  /* 期列**不参与撑宽**（2026-10-10，用户：「表格 期 的这列太宽了，优化一下」✓）—————————
     它是"标签列"：内容多宽就多宽（日期 5 字 ＋ 清N/⚠ 标记 ✓），多余宽度留给数据列 ✓。
     做法是 `width:1px` ＋ 已有的 nowrap ✓ —— 列宽退化到 min-content（＝最宽的那一格 ✓）。
     ⚠ 不加这条的话，`table.sa-mx { min-width:100% }` 的余量会被**灌进这一列** ✗：
       实测 1440px 下本该 ~70px 的列被撑到 130px ✗（380px 下才是 70px 的真宽度 ✓）。
     ⚠ 反向依赖：这一列的最宽一格决定下限 ✓ —— 所以别在期列的副标签里写长句子 ✗
       （期初行原来是「账户起点 → 09-07」✗ → 已缩成「起点 → 09-07」✓，语义挪进 title ✓）。 */
  #snap-attr table.sa-mx th.mx-d, #snap-attr table.sa-mx td.mx-d { width: 1px; }
  /* ── 期列**横滑时固定**（2026-10-10 用户选的 ②）────────────────────────────────
     窄屏横滑到第 10 期时仍看得见"这是哪一期" ✓ —— 做法与财务页的账户列同一套 ✓。
     ⚠ 底色必须**不透明** ✗：sticky 列会盖住从它下面滑过去的格子 ✓，半透明会让两列数字叠在一起 ✗
       → 用 var(--card) 打底 ✓，选中行的底色改成**叠加层**（background-image ✓）而不是覆盖 ✗。
     ⚠ 表头那格 z-index 更高 ✓，免得被下面的数据格压住 ✓。
     （1440px 下表格本来就不横向滚动 ✓ → 这条在那里不产生任何视觉变化 ✓，只在窄屏生效 ✓。） */
  #snap-attr table.sa-mx th.mx-d, #snap-attr table.sa-mx td.mx-d {
    position: sticky; left: 0; z-index: 2; background-color: var(--card);
  }
  #snap-attr table.sa-mx thead th.mx-d { z-index: 3; }
  #snap-attr .sa-detail { margin: 6px 0 0; border-top: 1px dashed var(--line-soft); padding-top: 6px; }
  #snap-attr .sd-head { font-size: var(--fs-xs); color: var(--tx2); padding: 2px 0 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  #snap-attr .sd-hint { color: var(--tx3); font-size: var(--fs-xxs); font-weight: 400; }
  /* 逐只明细行 —— 这里只管**布局** ✓，字号**不在这儿定** ✗：
     文件后面还有一块"字号统一"（同样是 #snap-attr .sd-row ✓ 后置同优先级 ✓）会把字号盖掉 ✓
     —— 两处各写一份必然漂 ✗（2026-10-10 就踩了：这里改成 9px、实测仍是 10px ✗）
     → 字号只留**一处权威**（见后面那块 ✓）。 */

  #snap-attr .sd-nm { flex: 0 0 92px; color: var(--tx2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #snap-attr .sd-bar { flex: 1 1 auto; display: block; height: 7px; background: var(--tint); border-radius: 2px; overflow: hidden; }   /* 轨道走 --tint ✓（2026-10-12：原 rgba(255,255,255,.06) 是深色主题专属——浅色白底上不可见 ✗，属主题泄漏 ✓） */
  #snap-attr .sd-bar i { display: block; height: 100%; border-radius: 2px; }
  #snap-attr .sd-amt { flex: 0 0 62px; text-align: right; font-family: var(--mono); }
  #snap-attr .sd-pct { flex: 0 0 34px; text-align: right; color: var(--tx3); font-family: var(--mono); }
  @media (max-width: 380px) { #snap-attr .sd-nm { flex-basis: 74px; } #snap-attr .sd-amt { flex-basis: 56px; } }

  /* ── 盈亏归因矩阵 · 第二轮修复（2026-10-07）───────────────────────────────────────────
     截图取证发现：上一轮"#snap-attr 内重声明 --tx/--tx2/--tx3"**没生效** ✗
     → 表现为：标题「盈亏归因」、明细里的基金名、提示文字全是深色压深底、几乎不可读 ✗
     → 原因：污染源是**更具体选择器里的非 important 定义** ✗ → 同优先级的我的声明输了 ✗
     → 修法：变量声明加 !important（合法且能压过任何非 important 定义 ✓）
        顺带补上 .sa-mx-wrap 的横向滚动（320px 下表格被撑宽 → 卡片溢出 68px ✗），
        并把单元格内边距放宽（数字列贴在一起 ✗）、右侧留白（合计列贴边 ✗）。 */
  #snap-attr { --tx: #e2e9f5 !important; --tx2: #c8d3e4 !important; --tx3: #93a3bb !important; }
  #snap-attr .sa-mx-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #snap-attr table.sa-mx th, #snap-attr table.sa-mx td { padding: 2px 5px; }
  #snap-attr table.sa-mx td.mx-c { padding: 2px 6px; }
  #snap-attr table.sa-mx th.mx-d, #snap-attr table.sa-mx td.mx-d { padding-left: 2px; }
  #snap-attr table.sa-mx th.mx-sum, #snap-attr table.sa-mx td.mx-sum { padding-right: 8px; }

  /* ── 第三轮：矩阵**数据单元格**的文字色（标题/名称/提示已在上一轮变浅 ✓）──────────────
     探针实测：名称/标题/提示已是浅色 ✓（!important 变量覆盖生效 ✓），
     但 td.mx-c 仍是 rgb(22,36,59) ✗ → 说明它的颜色**不是从变量来的**，
     而是某条更具体选择器直接给的 ✗ → 变量覆盖对它无效。
     这里用「更具体选择器 ＋ !important」直取颜色（只作用于数据格；
     合计列 .mx-sum 保持 up/down 的红绿语义不变 ✓）。 */
  #snap-attr table.sa-mx tbody td.mx-c { color: #e2e9f5 !important; }

  /* 「该期该主题无标的」的格子：淡色「·」（2026-10-09 加）
     —— 与「有值但极小」区分开：后者已由**对数**尺度保证看得见 ✓，故这里的「·」只表示**没有可归因的标的** ✓
     （用 !important 的理由同上面几条：本容器内的变量被更具体的选择器污染过 ✗，见上方四轮修正的注释） */
  #snap-attr table.sa-mx tbody td.mx-c.mx-na { color: rgba(147, 163, 187, 0.45) !important; }

  /* ── 第四轮（2026-10-07「字体太大」）＋ **第五轮（2026-10-09「统一用其它模块那一套」）**
     第四轮当时是**写死像素** 10px/9px ✗ —— 因为本容器里的 --fs-* 曾被污染成 13px；

     ⚠ 别再写死像素：要调就改 :root 的那两行，**全页数据表一起动** ✓ */
  #snap-attr .sa-head { font-size: var(--chk-fs); }
  #snap-attr .sa-head span { font-size: var(--chk-fs-mini); }
  #snap-attr table.sa-mx { font-size: var(--chk-fs); }
  #snap-attr table.sa-mx th { font-size: var(--chk-fs-mini); padding: 2px 5px; }
  /* 数据格（含合计列）比表头再小一档 → 取 mini（9px，与 .chk-tbl 的列内小标签同档 ✓）
     ⚠ **2026-10-09（用户：「数字字体也用统一的 JetBrains」）**：这里原来是"没设 font-family"
       → 继承正文的 --sans ✗，而全页其它数字都是 var(--mono)（= "JetBrains Mono", …）✓
       （.pl-amt / .s-val / .est-tbl td / .dca-tbl .f-inv / .sd-amt … 无一例外）

       th（列名是文字）仍走 sans ✓ —— 与 .est-tbl / .dca-tbl / .chk-tbl 的表头一致 ✓ */
  #snap-attr table.sa-mx td { font-size: var(--chk-fs-mini); padding: 1.5px 5px;

     挑出「文本以数字为主、字体却是 sans」的叶子元素，按【容器 > 元素】归类，再逐类处置 ✓
     审计结果（13~19 种签名 / 220 个元素）与处置：

       ✗ 有意保留 sans（写清理由，免得下次又被当成漏网 ✗）：
         · **名称里带数字**（"纳指100" 这类 .row2 .to i / .alt-grp-head b）—— 它是名字，不是数字 ✗
         · **散在句子里的计数**（.cnt 的 "13 只"、"合计（8 只 · 391 笔）"）—— 标签文字，跟着散文走 ✓
     ★ 为什么可以放心大范围套 mono：--mono 栈里**只有拉丁字体**（JetBrains Mono…），
       中文会自然回退到系统 CJK 字体 → 套上去只改数字与拉丁字母，**中文外观不变** ✓
       （这也正是本页既有做法：.pl-amt / .s-val / .est-tbl td / .dca-tbl .f-inv / .xr-tbl td.num 都这么用） */

  .otc-note b, .otc-note code, .dca-legend b,
  .lvl-row .lvl-hd .dca-chip,

     教训记在这里：这类全页审计必须**每个视图各测一遍**（切视图是 hidden 切换，一次只测得到一个 ✗） */
  .snap-group-hint, .snap-vs, .snap-cnt { font-family: var(--mono); font-feature-settings: "tnum"; }

const md = (d) => d.slice(5).replace("-", ".");
const cls = (v) => (v > 0 ? "up" : v < 0 ? "down" : "mut");
const W = (v) => (v >= 0 ? "var(--up)" : "var(--down)");
const px = (it) => (it && it.qty ? it.val / it.qty : null);
const perCost = (it) => (it && it.qty ? it.cost / it.qty : null);
const CW = () => Math.max(320, ((document.querySelector(".wrap") || {}).clientWidth || 720) - 30);
const changed = (r) => r.a.qty !== r.b.qty || Math.abs(r.a.cost - r.b.cost) > 0.005;
/* 「A → B」只在**真的变了**时才写 ✓ —— 份数/成本是交易驱动的（没交易就一模一样 ✗）；
   单价/市值是行情驱动的（每期都在动 ✓，写 A → B 才有信息 ✓）。这条区分是去噪的关键 ✓ */
const pair = (a, b, fmt, isChanged) => (isChanged ? fmt(a) + ' <span class="mut">→</span> ' + fmt(b) : fmt(b));

function traceOf(code) {
  const D = DEMO_DATA[code];
  const rows = D.rows.map((r) => ({ d: r.d, v: r.v, ev: r.ev || [],
    a: { qty: r.pQty, cost: r.pCost, val: r.pVal, pl: 0 }, b: { qty: r.qty, cost: r.cost, val: r.val, pl: r.pl } }));
  const total = D.carry.pl + rows.reduce((t, r) => t + r.v, 0);
  return { code, name: D.name, carry: D.carry.pl, carryD: D.carry.d, rows, total,
    trades: rows.reduce((t, r) => t + r.ev.length, 0) };
}
const evTxt = (ev) => ev.map((e) => e.d.slice(5).replace("-", ".") + " " + e.act + " " + qty(e.qty) + " 份 @" + e.cost).join(" ／ ");
const evShort = (ev) => ev.map((e) => e.act + " " + qty(e.qty) + " 份").join("／");
const lastOf = (code) => DEMO_DATA[code].rows.slice(-1)[0];

/* ===== ① 图（抽成独立函数 ✓：预览版头部与"单独看 ①"两处复用 ✓）===== */
function sparkSvg(tr) {
  const w = CW(), h = 132, mL = 46, mR = 14, mT = 12, mB = 20;
  const first = DEMO_DATA[tr.code].rows[0];
  const pts = [{ d: tr.carryD, p: first.pVal / first.pQty, c: first.pCost / first.pQty }]
    .concat(tr.rows.map((r) => ({ d: r.d, p: px(r.b), c: perCost(r.b) })));
  const xs = pts.map((x) => Date.parse(x.d)), t0 = Math.min.apply(null, xs), t1 = Math.max.apply(null, xs);
  const vals = pts.flatMap((x) => [x.p, x.c]).filter((v) => v != null);
  const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), pad = (hi - lo) * 0.18 || 0.02;
  const X = (d) => mL + (Date.parse(d) - t0) / (t1 - t0) * (w - mL - mR);
  const Y = (v) => mT + (hi + pad - v) / (hi + pad - (lo - pad)) * (h - mT - mB);
  const line = (k) => pts.filter((x) => x[k] != null).map((x) => X(x.d).toFixed(1) + "," + Y(x[k]).toFixed(1)).join(" ");
  let svg = '<svg viewBox="0 0 ' + w + " " + h + '" width="' + w + '" height="' + h + '">';
  [0, 0.5, 1].forEach((f) => { const v = hi + pad - f * (hi + pad - (lo - pad));
    svg += '<line x1="' + mL + '" y1="' + Y(v).toFixed(1) + '" x2="' + (w - mR) + '" y2="' + Y(v).toFixed(1) + '" style="stroke:var(--line-soft)" stroke-dasharray="2 4"/>'
      + '<text x="' + (mL - 6) + '" y="' + (Y(v) + 3.5).toFixed(1) + '" text-anchor="end" style="fill:var(--tx3);font:11px var(--mono)">' + v.toFixed(3) + "</text>"; });
  svg += '<polyline points="' + line("p") + '" style="fill:none;stroke:var(--tx2);stroke-width:2"/>'
    + '<polyline points="' + line("c") + '" style="fill:none;stroke:var(--tx3);stroke-width:2;stroke-dasharray:5 4"/>';
  tr.rows.forEach((r) => r.ev.forEach((e) => {
    const isBuy = !/卖出|减仓|清仓/.test(String(e.act));
    svg += '<circle cx="' + X(e.d).toFixed(1) + '" cy="' + Y(e.cost).toFixed(1) + '" r="4.5" style="fill:' + (isBuy ? "var(--up)" : "var(--down)")
      + ';stroke:var(--card);stroke-width:2"><title>' + esc(e.d + " " + e.act + " " + qty(e.qty) + " 份 @" + e.cost) + "</title></circle>";
  }));
  pts.forEach((x) => { if (x.p != null) svg += '<circle cx="' + X(x.d).toFixed(1) + '" cy="' + Y(x.p).toFixed(1) + '" r="2.2" style="fill:var(--tx2)"/>'; });
  svg += '<text x="' + mL + '" y="' + (h - 5) + '" style="fill:var(--tx3);font:11px var(--mono)">' + md(tr.carryD) + "</text>"
    + '<text x="' + (w - mR) + '" y="' + (h - 5) + '" text-anchor="end" style="fill:var(--tx3);font:11px var(--mono)">' + md(pts[pts.length - 1].d) + "</text></svg>";
  return svg;
}
const sparkLegend = '<div class="lg"><span><i></i>市价（每个快照点）</span><span><i class="d"></i>每股摊薄成本</span><span><i class="b"></i>买入</span><span><i class="s"></i>卖出</span></div>';

/* ===== ★ 上线预览：④＋① 合并（图当头部 ＋ 列表去噪 ✓；仍是**行列表**形态，不换成表格 ✓）===== */
function renderMerged(tr) {
  const L = lastOf(tr.code), nowPx = px({ qty: L.qty, val: L.val }), nowCost = perCost({ qty: L.qty, cost: L.cost });
  const top = Math.max.apply(null, tr.rows.map((x) => Math.abs(x.v)).concat([Math.abs(tr.carry), 1]));
  const out = [];
  out.push('<div class="sd-hrow"><div class="sd-hd"><b>期初结转</b><i>账户起点 → ' + md(tr.carryD) + "</i></div>"
    + '<div class="sd-row"><span class="sd-nm">起点之前的累计结果</span>'
    + '<span class="sd-bar"><i style="width:' + (Math.abs(tr.carry) / top * 100).toFixed(1) + "%;background:" + W(tr.carry) + '"></i></span>'
    + '<span class="sd-amt ' + cls(tr.carry) + '">' + money(tr.carry) + "</span>"
    + '<span class="sd-pct">占累计 ' + (tr.total ? (tr.carry / tr.total * 100).toFixed(0) + "%" : "—") + "</span></div></div>");
  tr.rows.forEach((r) => {
    const chg = changed(r);
    out.push('<div class="sd-hrow' + (chg ? " sd-chg" : "") + '"><div class="sd-hd"><b>' + md(r.d) + "</b>"
      + (r.ev.length ? '<i class="sd-ev" title="' + esc(evTxt(r.ev)) + '">' + esc(evShort(r.ev)) + "</i>" : "")
      + "</div>" + '<div class="sd-row"><span class="sd-nm">本期贡献</span>'
      + '<span class="sd-bar"><i style="width:' + (Math.abs(r.v) / top * 100).toFixed(1) + "%;background:" + W(r.v) + '"></i></span>'
      + '<span class="sd-amt ' + cls(r.v) + '">' + money(r.v) + "</span>"
      + '<span class="sd-pct">占累计 ' + (tr.total ? (r.v / tr.total * 100).toFixed(0) + "%" : "—") + "</span></div>"
      + '<div class="sd-cmp">份数 ' + pair(r.a.qty, r.b.qty, qty, chg) + " · 单价 " + p4(px(r.a)) + ' <span class="mut">→</span> ' + p4(px(r.b))
      + " · 市值 " + yuan(r.a.val) + ' <span class="mut">→</span> ' + yuan(r.b.val)
      + " · 成本 " + pair(r.a.cost, r.b.cost, yuan, chg) + "（" + pair(perCost(r.a), perCost(r.b), p4, chg) + "/份）</div></div>");
  });
  return '<div class="sa-detail"><div class="sd-head"><b>' + esc(tr.name) + "</b> · 逐期轨迹（" + tr.rows.length + " 期 ＋ 期初结转）· <b>生涯累计 "
    + money(tr.total) + "</b>"
    + '<span class="sd-hint">图：市价 vs 每股摊薄成本（x 轴＝真实日期间距 ✓）｜ 列表：每期贡献 ＋ 持仓变化；'
    + "份数 / 成本只在有交易时才写「→」（没变就一个值 ✓）</span></div>"
    + '<div class="sd-chart">' + sparkSvg(tr) + "</div>" + sparkLegend
    + '<div class="kpi2"><span>现价 <b>' + p4(nowPx) + "</b></span><span>每股摊薄成本 <b>" + p4(nowCost) + "</b></span>"
    + '<span>当下溢价 <b class="up">' + ((nowPx / nowCost - 1) * 100).toFixed(2) + "%</b></span>"
    + "<span>交易 <b>" + tr.trades + "</b> 笔</span></div>" + out.join("") + "</div>";
}

/* ===== A 组：现状（原样复刻 ✓）===== */
function renderCurrent(tr) {
  const top = Math.max.apply(null, tr.rows.map((x) => Math.abs(x.v)).concat([Math.abs(tr.carry), 1]));
  const out = [];
  out.push('<div class="sd-hrow"><div class="sd-hd"><b>期初结转</b><i>账户起点 → ' + md(tr.carryD) + "</i></div>"
    + '<div class="sd-row"><span class="sd-nm">起点之前的累计结果</span>'
    + '<span class="sd-bar"><i style="width:' + (Math.abs(tr.carry) / top * 100).toFixed(1) + "%;background:" + W(tr.carry) + '"></i></span>'
    + '<span class="sd-amt ' + cls(tr.carry) + '">' + money(tr.carry) + "</span>"
    + '<span class="sd-pct">' + (tr.total ? (tr.carry / tr.total * 100).toFixed(0) + "%" : "—") + "</span></div></div>");
  tr.rows.forEach((r) => {
    const seg = ["份数 " + qty(r.a.qty) + " → " + qty(r.b.qty)];
    if (px(r.b) !== null) seg.push("单价 " + p4(px(r.a)) + " → " + p4(px(r.b)));
    seg.push("市值 " + yuan(r.a.val) + " → " + yuan(r.b.val) + " · 摊薄成本 " + yuan(r.a.cost) + " → " + yuan(r.b.cost));
    out.push('<div class="sd-hrow"><div class="sd-hd"><b>' + md(r.d) + "</b>"
      + (r.ev.length ? '<i class="sd-ev" title="' + esc(evTxt(r.ev)) + '">' + esc(evTxt(r.ev)) + "</i>" : "")
      + "</div>" + '<div class="sd-row"><span class="sd-nm">本期贡献</span>'
      + '<span class="sd-bar"><i style="width:' + (Math.abs(r.v) / top * 100).toFixed(1) + "%;background:" + W(r.v) + '"></i></span>'
      + '<span class="sd-amt ' + cls(r.v) + '">' + money(r.v) + "</span>"
      + '<span class="sd-pct">' + (tr.total ? (r.v / tr.total * 100).toFixed(0) + "%" : "—") + "</span></div>"
      + '<div class="sd-cmp">' + esc(seg.join(" · ")) + "</div></div>");
  });
  return '<div class="sa-detail"><div class="sd-head"><b>' + esc(tr.name) + "</b> · 逐期轨迹（" + tr.rows.length
    + " 期 ＋ 期初结转）· <b>生涯累计 " + money(tr.total) + "</b>"
    + '<span class="sd-hint">生涯累计 ＝ 期初结转 ' + money(tr.carry) + " ＋ 各期贡献之和 ✓</span></div>" + out.join("") + "</div>";
}

/* ===== ④ 表格形态（另一种形态，供对照 ✓）===== */
function renderTable(tr) {
  const head = "<tr><th>期</th><th>事件</th><th>份数</th><th>单价</th><th>持仓成本</th><th>市值</th><th>本期贡献</th><th>占累计</th></tr>";
  const rows = tr.rows.map((r) => {
    const chg = changed(r);
    const ev = r.ev.length ? evShort(r.ev) : '<span class="mut">—</span>';
    const evTip = r.ev.length ? ' title="' + esc(evTxt(r.ev)) + '"' : "";
    return "<tr" + (chg ? ' class="chg"' : "") + "><td>" + md(r.d) + "</td><td" + evTip + ">" + ev + "</td>"
      + '<td class="r num">' + pair(r.a.qty, r.b.qty, qty, chg) + '</td><td class="r num">' + p4(px(r.b)) + "</td>"
      + '<td class="r num">' + pair(r.a.cost, r.b.cost, yuan, chg) + "</td>"
      + '<td class="r num">' + yuan(r.b.val) + '</td><td class="r num ' + cls(r.v) + '">' + money(r.v) + "</td>"
      + '<td class="r num mut">' + (tr.total ? (r.v / tr.total * 100).toFixed(0) + "%" : "—") + "</td></tr>";
  }).join("");
  return '<div class="sd-head"><b>' + esc(tr.name) + "</b> · 逐期轨迹（表格形态）· <b>生涯累计 " + money(tr.total) + "</b>"
    + '<span class="sd-hint">高亮行＝该期有交易 ✓；份数 / 成本没变就只写一个值 ✓</span></div>'
    + '<div class="scroll"><table class="dt"><thead>' + head + "</thead><tbody>" + rows
    + '<tr class="sum"><td>合计</td><td>＋ 期初结转</td><td colspan="4"></td><td class="r num ' + cls(tr.total) + '">' + money(tr.total)
    + '</td><td class="r num mut">100%</td></tr></tbody></table></div>';
}

/* ===== ② 交易期为主 ＋ 无操作期折叠（默认不折叠 → 这里只作选项演示 ✓）===== */
function renderFolded(tr) {
  const out = [];
  const top = Math.max.apply(null, tr.rows.map((x) => Math.abs(x.v)).concat([1]));
  const row = (r) => '<div class="sd-hrow"><div class="sd-hd"><b>' + md(r.d) + '</b><i class="sd-ev" title="' + esc(evTxt(r.ev)) + '">' + esc(evShort(r.ev)) + "</i></div>"
    + '<div class="sd-row"><span class="sd-nm">本期贡献</span>'
    + '<span class="sd-bar"><i style="width:' + (Math.abs(r.v) / top * 100).toFixed(1) + "%;background:" + W(r.v) + '"></i></span>'
    + '<span class="sd-amt ' + cls(r.v) + '">' + money(r.v) + '</span><span class="sd-pct"></span></div>'
    + '<div class="sd-cmp">份数 ' + qty(r.b.qty) + " · 单价 " + p4(px(r.b)) + " · 市值 " + yuan(r.b.val) + " · 成本 " + yuan(r.b.cost)
    + " ｜ 该期 " + qty(r.a.qty) + " → " + qty(r.b.qty) + " 份</div></div>";
  let run = null;
  const flush = () => { if (!run) return;
    if (run.n === 1) out.push(row(run.items[0]));
    else out.push('<div class="fold">' + md(run.from) + " → " + md(run.to) + " · 无操作 " + run.n + " 期 · 合计 <span class=\"num " + cls(run.sum) + '">' + money(run.sum) + "</span></div>");
    run = null; };
  tr.rows.forEach((r) => {
    if (r.ev.length) { flush(); out.push(row(r)); }
    else { if (!run) run = { n: 0, sum: 0, from: r.d, to: r.d, items: [] };
      run.n++; run.sum += r.v; run.to = r.d; run.items.push(r); }
  });
  flush();
  return '<div class="sd-head"><b>' + esc(tr.name) + "</b> · 逐期轨迹（折叠无操作期）· <b>生涯累计 " + money(tr.total) + "</b>"
    + '<span class="sd-hint">' + tr.rows.length + " 期里只有 " + tr.rows.filter((r) => r.ev.length).length
    + " 期动过手 ✓ —— 折成一行（合计仍进累计 ✓ 不丢数）；建议做成**开关**、默认不折 ✓</span></div>"
    + '<div class="sd-hrow"><div class="sd-hd"><b>期初结转</b></div><div class="sd-row"><span class="sd-nm">起点之前</span>'
    + '<span class="sd-amt ' + cls(tr.carry) + '">' + money(tr.carry) + "</span></div></div>" + out.join("");
}

/* ===== ③ 贡献瀑布 ===== */
function renderFall(tr) {
  const w = CW(), h = 148, mL = 46, mR = 14, mT = 12, mB = 26;
  const bars = [{ d: tr.carryD, v: tr.carry, label: "结转" }].concat(tr.rows.map((r) => ({ d: r.d, v: r.v, label: md(r.d) })));
  let run = 0;
  const spans = bars.map((b) => { const a = run; run += b.v; return { d: b.d, v: b.v, label: b.label, a: a, b: run }; });
  const vals = [0].concat(spans.map((s) => s.a), spans.map((s) => s.b));
  const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), pad = (hi - lo) * 0.15 || 1;
  const Y = (v) => mT + (hi + pad - v) / (hi + pad - (lo - pad)) * (h - mT - mB);
  const step = (w - mL - mR) / spans.length, bw = step * 0.62;
  let svg = '<svg viewBox="0 0 ' + w + " " + h + '" width="' + w + '" height="' + h + '">';
  svg += '<line x1="' + mL + '" y1="' + Y(0).toFixed(1) + '" x2="' + (w - mR) + '" y2="' + Y(0).toFixed(1) + '" style="stroke:var(--line-soft)"/>';
  spans.forEach((s, i) => {
    const x = mL + step * i + (step - bw) / 2, y1 = Y(Math.max(s.a, s.b)), y2 = Y(Math.min(s.a, s.b));
    svg += '<rect x="' + x.toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1.5, y2 - y1).toFixed(1)
      + '" style="fill:' + W(s.v) + ';opacity:.85" rx="1.5"><title>' + esc(s.d + " " + (i === 0 ? "期初结转" : "本期贡献") + " " + money(s.v) + " → 累计 " + money(s.b)) + "</title></rect>";
    if (i === spans.length - 1) svg += '<circle cx="' + (x + bw / 2).toFixed(1) + '" cy="' + Y(s.b).toFixed(1) + '" r="3" style="fill:var(--blue)"/>';
    if (i === 0 || i === spans.length - 1 || i % 4 === 0)
      svg += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle" style="fill:var(--tx3);font:11px var(--mono)">' + (i === 0 ? "结转" : s.label) + "</text>";
  });
  svg += "</svg>";
  return '<div class="sd-head"><b>' + esc(tr.name) + '</b> · 生涯累计是怎么长出来的'
    + '<span class="sd-hint">每根柱从"当时的累计"往上/下走 ✓（真瀑布）—— 终点 ＝ 生涯累计 ' + money(tr.total) + " ✓</span></div>"
    + svg + '<div class="lg"><span><i class="b"></i>正贡献</span><span><i class="s"></i>负贡献</span><span>蓝点＝终点 ' + money(tr.total) + "</span></div>";
}

/* ===== 组装：★ 上线预览放最前 ✓，后面是现状与其余候选（供对照 ✓）===== */
function drawCodes() {
  document.getElementById("codes").innerHTML = CODES.map((c) =>
    '<button type="button" class="' + (c === cur ? "on" : "") + '" data-c="' + c + '">' + esc(DEMO_DATA[c].name) + " " + c + "</button>").join("");
}
function draw() {
  const tr = traceOf(cur);
  document.getElementById("out").innerHTML =
      '<section class="star"><h2>★ 上线预览：④＋① 合并<span class="tag">这就是要搬进正式页的样子</span></h2>'
    + '<div class="why">① 图放在列表上方当头部（回答"成本怎么被买入摊薄、现在离成本多远"✓）＋ 3 个数；'
    + '下面是原来的**行列表**形态（不换成表格 ✓，窄屏也放得下 ✓），但去掉了噪音：份数 / 成本**没变就只写一个值** ✓、'
    + '事件只留「买入 6,500 份」（全文进悬停 ✓）、占比改成**占累计**（不再出现 103% 那种 ✗）</div>'
    + '<div class="sd-detail-box">' + renderMerged(tr) + "</div></section>"
    + '<section><h2>A · 现状<span class="tag">对照：原样复刻</span></h2>'
    + '<div class="why">每期一行：横向条 ＋ 金额 ＋ 占比 ＋「份数 A → B · 单价 a → b · 市值 · 摊薄成本 A → B」拼接句 —— '
    + '份数/成本在没交易的期里两半完全相同（纯噪音 ✗），占比也容易让人愣（103% ✗）</div>'
    + '<div class="sd-detail-box">' + renderCurrent(tr) + "</div></section>"
    + '<section><h2>② 折叠无操作期<span class="tag">建议做成开关</span></h2>'
    + '<div class="why">' + tr.rows.length + " 期里只有 " + tr.rows.filter((r) => r.ev.length).length
    + " 期动过手 ✓ —— 折成一行、合计仍进累计 ✓（但被折掉那几期的明细看不见了 ✗，所以建议默认不折 ✓）</div>"
    + renderFolded(tr) + "</section>"
    + '<section><h2>③ 贡献瀑布<span class="tag">可选</span></h2>'
    + '<div class="why">期初结转 → 一期期累加 → 生涯累计 ✓（与门禁 ④l 那条恒等式同一件事 ✓；与列头图信息有重叠 ✓）</div>'
    + renderFall(tr) + "</section>";
}
document.getElementById("codes").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-c]");
  if (!b) return;
  cur = b.getAttribute("data-c"); drawCodes(); draw();
});
let rz = null;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(draw, 150); });
drawCodes(); draw();
CODES.forEach((c) => { const t = traceOf(c); console.log("[demo] " + c + " " + t.name + " · 结转 " + t.carry.toFixed(2) + " ＋ " + t.rows.length + " 期 =" + t.total.toFixed(2)); });

</script>
</body>
</html>

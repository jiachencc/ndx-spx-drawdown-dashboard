/* ===== tokens.css（跨页共享令牌 ✓）===== */
/* ===== 跨页设计令牌（2026-10-12 第三批：色板 4 份拷贝 → 1 份）=====
 * 起因：四个页面各自把同一套「表面色 / 文字色 / 原始色板 / 字体栈」抄了一遍 ✗ ——
 *   任何一次调色都要改四处，漏一处就会出现"同一色号两个值"（--purple 与 --tx3 眼下已经这样 ✗）。
 * 本文件只收**四页取值逐字相同**的令牌 ✓ —— 不是"看起来差不多"就搬（比对口径见提交信息里的脚本）✓。
 *
 * ⚠ 刻意**不**放这里（留在各页，别硬合 ✗）：
 *   · --up / --down 及 up-bg / up-line 一族：这是**语义映射**，且各页刻意相反 ✓ ——
 *       持仓 / 决策 / 加息页 = 绿涨红跌（欧美习惯）｜个人财务页 = 红涨绿跌（境内 App 习惯 ✓）
 *     （想全站统一哪一天，只改各页那两行 ✓；本文件不替它决定）
 *   · --tx3 / --purple / --sox：**四页取值不一致** ✗ → 需要拍板后才能统一
 *   · --fs-* 字号刻度 / --radius / 各页专属变量：属于每页版式，不是共享色板 ✓
 *
 * 加载顺序：本文件在每页**先于**它的主样式表 ✓
 *   （light 主题的覆盖靠 body.light 的优先级胜出，与顺序无关 ✓；"先令牌、后页面"读起来最顺 ✓）
 * 改色只改这里 ✓；改某一页的语义（例如把财务页也改成绿涨红跌）只改那一页的两行 ✓。
 *
 * ⚠ 子目录页面用**同级副本**（2026-10-12 修背景丢失 ✗）：
 *   finance/ 与 fed-cycle/ 这两页原先引用 `../tokens.css` ✗ —— 在"服务根不是仓库根 / 部署漏拷上级文件 /
 *   子目录被单独发布"的环境里它取不到 → **--bg 一失效，body 的整条 background 声明作废 → 背景全没** ✗
 *   （实测复现：服务根取 finance/ 时 --bg 为空、渐变 none ✗）。故各自改用同级 `tokens.css` ✓。
 *   两个副本是**逐字节拷贝**、由 `node scripts/sync-tokens.mjs` 同步，并由 scripts/check-tokens.mjs
 *   断言"三者完全一致" ✓ —— 手改副本会被门禁当场抓住 ✗。**改色仍只改本文件** ✓，然后跑一次同步 ✓。 */
:root {
  /* 表面与分隔 */
  --bg: #0a0d13;
  --bg-grad-1: #0e1526;      /* 空间渐变起点（持仓 / 决策页用这个名字） */
  --bg-grad: #0e1526;        /* 加息页沿用的旧名，与上面同值 —— 两个名字都留着，免得去改用到的地方 ✓ */
  --card: #121826;
  --card2: #1a2234;
  --line: #232e44;
  --line-soft: #1c2538;

  /* 文字（--tx3 刻意不在本文件 —— 四页取值不同 ✗） */
  --tx: #e2e9f5;
  --tx2: #8fa0ba;

  /* 原始色板：各页再把它们映射成 --up / --down / --warn / --info / --accent ✓
     注意：分类色（市场色、建仓/平仓标签、同步状态）直接用原始色板，不走 --up / --down ✓ */
  --green: #2dd4a7;
  --red: #f26d7d;
  --yellow: #f7c14e;
  --blue: #5ba3ff;
  --cyan: #46c9f0;

  /* 字体栈：必须与 <link href="font.css"> 同时存在才生效（font.css 提供 'JetBrains Mono' 的 @font-face ✓）；
     顺序也有讲究：最靠前的**可用**字体胜出，故 JetBrains 必须排第一 ✓ */
  --mono: "JetBrains Mono", "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}

/* ===== positions.css（A 组「现状」要用它的 .sd-* 规则 ✓；整份内联最稳当 ✓）===== */
/* positions.html 的样式表（2026-09-27 从内联 <style> 抽出）
 *
 * 为什么抽出来：
 *   · 这 1,784 行 CSS 几乎不变，而 <script> 里的渲染逻辑天天在动 —— 混在一个 7,200 行的文件里，
 *     改逻辑要滚过整段样式、改样式也要穿过逻辑。
 *   · 抽出后「结构 / 样式 / 数据 / 逻辑」各归其位 —— data.js 早就外链了（见 handoff.md §3 的
 *     「数据/结构分离」），这里只是把同一条原则贯彻到样式。
 *   · 与 handoff.md §3 那三条「不外链」的理由**不冲突**：那三条针对的是**第三方 CDN**
 *     （国内不稳 / 隐私 / 供应链），本地文件不涉及；本项目本来就有 font.css 与 data.js 两个外链。
 *
 * 规矩：
 *   · 只放样式，不放数据与逻辑；改样式只改这里，别再往 positions.html 里塞 <style>。
 *   · 加载顺序：font.css → positions.css（即原内联块的位置）。
 *
 * ⚠ 提取时**逐字节照搬**原内容，未做任何格式化/压缩 —— 抽取前后的计算样式、样式表规则数与
 *   三个断点的截图已逐项比对，保证视觉零变化。
 */

  :root {
    --tx3: #6f7f99;      /* 三级文字：原 #8294af 与 --tx2 只差 5%，肉眼分不出来，等于白设一档 */
    /* ---- 原始色板（--green / --red / --yellow / --blue / --cyan）与 --bg/--card/--tx/字体栈
     * 已搬到 ../tokens.css（2026-10-12 第三批：四页共用一份 ✓）。
     * 这里只留**本页独有**的 --purple ✗（决策页取值不同，暂不统一）与下面的语义映射 ✓ ---- */
    --purple: #ba8fff;
    /* ---- 语义色：涨 / 跌 / 提醒 / 信息 ----
     * 页面上一律写 var(--up) / var(--down)，不再直接写绿、红。
     * 原因是这两套配色是同一件事的两种约定：
     * 现在用「绿涨红跌」（欧美习惯）。若要改成 A 股习惯的「红涨绿跌」，
     * 只需把下面 --up / --down 两行取值对调——全页涨跌配色（含走势图填充、
     * 所有 .up/.down 数字）会一起跟着走，不必再逐个文件去找。
     * 注意：分类色（建仓/平仓标签、市场色、同步状态）不走这两个令牌，它们
     * 不是涨跌，翻转约定时不该跟着变。 */
    --up: var(--green);
    --down: var(--red);
    --warn: var(--yellow);
    --info: var(--cyan);
    --accent: var(--blue);
    /* 半透明变体：深色底上调好的透明度，浅色底需覆盖（见 body.light）——
     * 原来这些 rgba 是硬编码的，切浅色主题时不会跟着变，属于主题泄漏。 */
    --up-bg: rgba(45,212,167,.12);      --up-line: rgba(45,212,167,.30);      --up-fill: rgba(45,212,167,.60);
    --down-bg: rgba(242,109,125,.12);   --down-line: rgba(242,109,125,.30);   --down-fill: rgba(242,109,125,.60);
    --warn-bg: rgba(247,193,78,.10);    --warn-line: rgba(247,193,78,.30);  --warn-fill: rgba(247,193,78,.60);
    --info-bg: rgba(70,201,240,.12);    --info-line: rgba(70,201,240,.30);  --info-fill: rgba(70,201,240,.60);
    --accent-bg: rgba(91,163,255,.12);  --accent-line: rgba(91,163,255,.35);  --accent-fill: rgba(91,163,255,.60);
    /* 第四个角色：实色（渐变上端 / 发光）*/
    --up-solid: rgba(45,212,167,.85);       --down-solid: rgba(242,109,125,.85);
    --warn-solid: rgba(247,193,78,.85);     --info-solid: rgba(70,201,240,.85);
    --accent-solid: rgba(91,163,255,.85);
    --purple-bg: rgba(186,143,255,.12);     --purple-line: rgba(186,143,255,.30);
    --purple-fill: rgba(186,143,255,.60);   --purple-solid: rgba(186,143,255,.85);
    /* 中性面：灰调淡底（= --tx2 的色值分级）/ 内阴影 / 各层浮层 */
    --tint: rgba(143,160,186,.12);          --tint-line: rgba(143,160,186,.30);
    --tint-fill: rgba(143,160,186,.60);     --tint-solid: rgba(143,160,186,.85);
    --shadow-inset: inset 0 1px 2px rgba(0,0,0,.22);
    --pop-shadow: 0 14px 44px -8px rgba(0,0,0,.75);
    --tip-shadow: 0 6px 18px rgba(0,0,0,.35);
    --panel-shadow: 0 10px 26px -8px rgba(0,0,0,.4);
    --tx-glow: rgba(226,233,245,.5);        --tx-glow2: rgba(226,233,245,.75);
    --pop-bg: #1a2436;                      --pop-line: #33415e;
    --page-glow: rgba(91,163,255,.06);     /* 页面顶部装饰光，纯装饰不随主题变 */
    --on-accent: #fff;   /* 铺在彩色填充上的文字（两种主题都成立） */
    /* ---- 字号：全页只用这六档 ----
     * 原来有 16 种（8/9/9.5/10/10.5/11/11.5/12/12.5/13/13.5/14/14.5/15/17/20），
     * 其中 12~14 之间挤了 5 个只差 0.5px 的档位，等于没有层级。 */
    --fs-hero: 20px;   /* 页面主标题 */
    --fs-lg: 15px;     /* 卡片里的大数字 */
    --fs-md: 13px;     /* 正文 / 主要数值 */
    --fs-sm: 12px;     /* 次级数值 */
    --fs-xs: 11px;     /* 标签 / 小注 */
    --fs-xxs: 10px;    /* 极小注 / 图内标注 */
    /* 数据表的**共用字号**（2026-10-09 统一；值沿用 2026-09-27「再小一点」定的 10/9）
       全局 --fs-* 那套最小只到 10px，而稠密数据表还需要再小一档（9px）→ 单独这两档 ✓
       ⚠ 名字里的 "chk" 来自最初的使用者（操作体检）—— **现在它是全页数据表共用的**：
         .chk-tbl / .xr-tbl / 盈亏归因矩阵（#snap-attr）都引用它 ✓（名字沿用，避免改 20+ 处引用 ✗）
       ★ 为什么要提到 :root：原先 .chk-tbl 自己声明一份、矩阵在 #snap-attr 里**写死** 10px/9px ✗ ——
         两处同值但不同源 → 改一处必漂 ✗。现在一处定义、多处引用 ✓ */
    --chk-fs: 10px;
    --chk-fs-mini: 9px;
    /* 圆角分档：主容器 / 内嵌卡 / 浮层 / chip —— 原来 .card / .kpi / .idx-pop / .snap-tag
     * 各自凭直觉写 14/12/10/8/6/5/4/2px 八种值，同一视觉层级里能找出三种圆角。
     * --radius 保持 14 不动以兼容既有引用；新增三档用于分角色落地。 */
    --radius-lg: 16px;   /* .card 主容器 */
    --radius:    14px;   /* 保留 · 通用中块 */
    --radius-md: 10px;   /* .kpi / .sum-cell / .sw-kpi 内嵌卡 */
    --radius-sm: 8px;    /* .idx-pop / .buy-tip / .strat-note 浮层小件 */
    --radius-xs: 5px;    /* chip / badge / tag 原子件 */
    /* 卡片极轻阴影：深色模式靠背景分层，浅色模式（#fff 卡在 #eef2f8 上）不加重手感就糊成一片 */
    --card-shadow: 0 1px 0 rgba(0,0,0,.04);
  }
  body.light {
    --bg: #eef2f8;
    --bg-grad-1: #e6ecf6;
    --card: #ffffff;
    --card2: #f3f6fb;
    --line: #cdd7e5;      /* 原 #dde4ef 与 --card:#fff 对比不足 8%，卡片边界看不清；加深一档 */
    --line-soft: #dfe6f1;
    --tx: #16243b;
    --tx2: #52627e;
    --tx3: #7c8ba1;      /* 浅色底上同样与 --tx2 拉开一档 */
    --green: #0ea372;
    --red: #e23b53;
    /* ⚠ --up/--down 必须在这里**重声明**（2026-10-12）：`:root` 上 `--up: var(--green)` 的 var()
       在 :root 处就替换固化了（custom property 的计算值规则 ✓），body.light 只改 --green 时
       后代继承到的 --up 仍是深色值 #2dd4a7 ✗ —— 浅色板这两个颜色从未真正生效过 ✗
       （实测：浅色下 .up 数字 = rgb(45,212,167) = 深色绿 ✓ 本行修复后才是 #0ea372 ✓）。 */
    --up: var(--green);
    --down: var(--red);
    --yellow: #c8901a;
    --blue: #2f7be0;
    --cyan: #0a9fc4;
    --purple: #8b5cf6;
    /* 语义色的透明变体：白底上不能照搬深色底的比例，否则淡到看不见 */
    --up-bg: rgba(14,163,114,.10);      --up-line: rgba(14,163,114,.30);      --up-fill: rgba(14,163,114,.55);
    --down-bg: rgba(226,59,83,.10);     --down-line: rgba(226,59,83,.30);     --down-fill: rgba(226,59,83,.55);
    --warn-bg: rgba(200,144,26,.12);    --warn-line: rgba(200,144,26,.32);  --warn-fill: rgba(200,144,26,.60);
    --info-bg: rgba(10,159,196,.12);    --info-line: rgba(10,159,196,.30);  --info-fill: rgba(10,159,196,.60);
    --accent-bg: rgba(47,123,224,.10);  --accent-line: rgba(47,123,224,.32);  --accent-fill: rgba(47,123,224,.60);
    --up-solid: rgba(14,163,114,.85);       --down-solid: rgba(226,59,83,.85);
    --warn-solid: rgba(200,144,26,.85);     --info-solid: rgba(10,159,196,.85);
    --accent-solid: rgba(47,123,224,.85);
    --purple-bg: rgba(139,92,246,.12);      --purple-line: rgba(139,92,246,.30);
    --purple-fill: rgba(139,92,246,.60);    --purple-solid: rgba(139,92,246,.85);
    --tint: rgba(15,23,42,.05);             --tint-line: rgba(15,23,42,.12);
    --tint-fill: rgba(82,98,126,.45);       --tint-solid: rgba(82,98,126,.70);
    --shadow-inset: inset 0 1px 2px rgba(15,23,42,.12);
    --pop-shadow: 0 14px 44px -8px rgba(15,23,42,.18);
    --tip-shadow: 0 8px 22px -6px rgba(15,23,42,.25);
    --panel-shadow: 0 10px 26px -8px rgba(15,23,42,.3);
    --tx-glow: rgba(22,36,59,.25);          --tx-glow2: rgba(22,36,59,.35);
    --pop-bg: #fff;                         --pop-line: var(--line);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
  :focus:not(:focus-visible) { outline: none; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    background: radial-gradient(1200px 600px at 85% -10%, var(--page-glow), transparent 60%), var(--bg);
    color: var(--tx);
    font-family: var(--sans);
    font-size: var(--fs-md);
    min-height: 100vh;
    padding: 18px 14px 40px;
    font-feature-settings: "tnum";
    transition: background .3s, color .3s;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .header h1 { font-size: var(--fs-hero); font-weight: 800; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
  .header .sub { font-size: var(--fs-xs); color: var(--tx3); margin-top: 4px; }
  .meta { display: flex; gap: 8px; align-items: center; }
  .theme-btn {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 5px 12px; font-family: var(--mono); font-size: var(--fs-xs); color: var(--tx2);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: border-color .2s, color .2s;
  }
  .theme-btn:hover { border-color: var(--blue); color: var(--blue); }
  a.theme-btn { text-decoration: none; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px; min-width: 0;
    box-shadow: var(--card-shadow);
  }
  /* 卡片紧内边距版：取代 HTML 内联 style="padding:12px 14px" —— 内联会绕过主题令牌 */
  .card.tight { padding: 12px 14px; }
  .privacy {
    /* 隐私提醒不是警告，只是知情提示——从黄色调成中性 tint，
     * 不再与 snap-tag.cut / strat 减仓 / pos-tier.t-mid 抢“注意”信号。 */
    border-color: var(--line); background: var(--tint);
    color: var(--tx2); font-size: var(--fs-xs); line-height: 1.6; display: flex; gap: 8px; align-items: flex-start;
  }
  .privacy b { color: var(--tx); }
  .src-line { font-size: var(--fs-xs); color: var(--tx3); margin: 10px 2px; line-height: 1.7; }
  /* 内联 style 抽取为类，避免主题切换时内联颜色不跟随 */
  .src-sep { opacity: .4; }
  .src-status { margin-top: 6px; overflow-wrap: anywhere; }
  .src-status-inline { margin-top: 6px; }
  .src-muted { color: var(--tx3); }
  .src-tag { display: inline-block; padding: 1px 6px; border-radius: 5px; font-family: var(--mono); font-size: var(--fs-xxs); font-weight: 700; vertical-align: 1px; }
  .src-tag.auto { background: var(--up-bg); color: var(--green); border: 1px solid var(--up-line); }
  .src-tag.manual { background: var(--warn-bg); color: var(--yellow); border: 1px solid var(--warn-line); }

  /* ===== 汇总 ===== */
  .sum-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  /* 2026-09-30 二次排版：9 格 → 4 格（总资产 / 累计浮盈亏·场内 / 累计浮盈亏·场外 / 当日盈亏）。
     日期胶囊只在「总资产」里出现（它同时含场内报价日与场外快照日）；末格（当日盈亏，三分栏
     「场内 ＋ 场外 ＝ 合计」）**跨整行**——三分栏在 1/3 行宽里会挤成一团。 */
  .sum-grid .sum-cell:last-child { grid-column: 1 / -1; }
  .sum-cell { background: var(--card2); border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 8px; text-align: center; min-width: 0; }
  .sum-cell .s-label { font-size: var(--fs-xs); color: var(--tx3); margin-bottom: 4px; }
  .sum-cell .s-val { font-family: var(--mono); font-size: var(--fs-lg); font-weight: 700; font-feature-settings: "tnum"; }
  .sum-cell .s-sub { font-family: var(--mono); font-size: var(--fs-xs); margin-top: 3px; font-feature-settings: "tnum"; }
  /* ===== 口径徽章（.date-chip）：一枚胶囊说清「来源 + 渠道 + 状态 + 日期（＋时刻）」 =====
     上一版把「场内 / 场外」留在胶囊外面，形状与颜色仍不齐；现在统一收进胶囊里，
     一枚胶囊自己就说清「这是什么数据、哪天的、有没有跟上」：
       配色按来源分色，状态色压过来源色
         青＝场内（A 股 ETF 报价日）· 紫＝场外（各基金 App 截图日；截图时刻只在 title 里，不上屏）
         灰＝净值日（辅助事实，不加底）· 绿勾＝已同步 · 琥珀（连 ⚠）＝沿用旧值 / 滞后 / 缺记录
       形状：等宽 tabular + pill 描边 + 极浅底色（与 .idx-badge 同一套视觉语言）
     ⚠ 相对时间（今日 / N 天前 / 待更 N 天）不走胶囊：它修饰的就是紧挨着的那枚日期胶囊。
     间距：相邻胶囊（与份额标签）统一 4px，由下方相邻选择器给，不靠各处硬写。 */
  .date-chip { display: inline-block; font-family: var(--mono); font-size: var(--fs-xxs); font-weight: 400; font-feature-settings: "tnum"; color: var(--tx3); border: 1px solid var(--line-soft); border-radius: 999px; padding: 0 6px; vertical-align: 1px; white-space: nowrap; }
  .date-chip.etf { color: var(--cyan); border-color: var(--info-line); background: var(--info-bg); }
  .date-chip.otc { color: var(--purple); border-color: var(--purple-line); background: var(--purple-bg); }
  .date-chip.nav { color: var(--tx3); }
  .date-chip.stale { color: var(--yellow); border-color: var(--warn-line); background: var(--warn-bg); }
  /* 溢价/折价胶囊（2026-09-23：从独立一行挪到卡头，紧跟在「场内 09.22」之后）——
     那枚胶囊说"这是哪天的场内价"，这枚说"这个价比基金实际净值贵多少"，同属"怎么读这个价格"。
     .date-chip + .date-chip 的 4px 间距规则（见下）自动生效，不用额外写。 */
  .date-chip.prem-ok { color: var(--tx3); }
  .date-chip.prem-warn { color: var(--warn); border-color: var(--warn-line); background: var(--warn-bg); }
  .date-chip.prem-high { color: var(--red); border-color: var(--down-line); background: var(--down-bg); }
  .date-chip.prem-disc { color: var(--green); border-color: var(--up-line); background: var(--up-bg); }
  .date-chip + .date-chip, .date-chip + .qty-tag { margin-left: 4px; }
  .sum-cell .s-asof { margin-top: 4px; line-height: 1.6; }   /* 汇总格底部的口径日期行 */
  /* 当日盈亏分量大、合计量小——盘中估值与 App 快照不同口径，写成一个主数字会误导 */
  .s-split { display: flex; align-items: baseline; justify-content: center; gap: 4px; margin-top: 2px; }
  .s-split-cell { min-width: 0; }
  .s-split-k { font-size: var(--fs-xxs); color: var(--tx3); margin-bottom: 1px; }
  /* 「估」小徽标（2026-10-03）：压在「场外」标签后面，提醒右面那个数是**尚未公布**的推算值，
     与旁边已公布的 App 读数不是一回事（口径见该格 tooltip）。 */
  .s-split-k .s-est { margin-left: 4px; font-size: 9px; color: var(--warn); border: 1px solid var(--line); border-radius: 999px; padding: 0 4px; vertical-align: 1px; }
  .s-split-v { font-family: var(--mono); font-size: var(--fs-md); font-weight: 700; font-feature-settings: "tnum"; white-space: nowrap; }
  .s-split-v.up { color: var(--up); } .s-split-v.down { color: var(--down); }
  .s-split-plus { font-family: var(--mono); color: var(--tx3); font-size: var(--fs-sm); align-self: flex-end; padding-bottom: 1px; }
  .alloc-bar { display: flex; height: 17px; border-radius: 999px; overflow: hidden; border: 1px solid var(--line-soft); margin-top: 10px; }
  .alloc-seg { display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: var(--fs-xxs); font-weight: 700; color: var(--on-accent); min-width: 0; overflow: hidden; white-space: nowrap; font-feature-settings: "tnum"; border: 0; padding: 0; cursor: pointer; }
  .alloc-seg.ndx { background: linear-gradient(180deg, var(--accent-solid), var(--accent-fill)); }
  .alloc-seg.spx { background: linear-gradient(180deg, var(--purple-solid), var(--purple-fill)); }
  .alloc-seg.kr { background: linear-gradient(180deg, var(--info-solid), var(--info-fill)); }
  .alloc-seg.n225 { background: linear-gradient(180deg, var(--warn-solid), var(--warn-fill)); }
  .alloc-seg.hkus { background: linear-gradient(180deg, var(--up-solid), var(--up-fill)); }
  .alloc-seg.global { background: linear-gradient(180deg, var(--tint-solid), var(--tint-fill)); }
  .alloc-seg.cash { background: linear-gradient(180deg, var(--tint-fill), var(--tint-line)); }
  .alloc-seg b { font-family: var(--mono); font-feature-settings: "tnum"; }
  /* ===== 组合占比图例（2026-09-23 加）=====
     色带上放不下的名称与占比在这里全部可读（条内标签要按像素宽取舍，见 layoutAllocLabels），
     而且图例项本身就是点击目标 —— 最窄的段只有 3px，手机上根本点不到（点它弹明细，见买入气泡处理）。 */
  .alloc-legend { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 7px; }
  .alloc-key { display: inline-flex; align-items: center; gap: 5px; background: none; border: 0; padding: 1px 0; cursor: pointer; font-family: var(--sans); font-size: var(--fs-xs); color: var(--tx2); }
  .alloc-key:hover { color: var(--tx); }
  .alloc-key b { font-family: var(--mono); font-weight: 700; color: var(--tx); font-feature-settings: "tnum"; }
  /* 场外当日预估 · 逐只表（2026-10-03，挂在汇总卡内的折叠块里）：
     三列 —— 基金（名 ＋ 缺口 chip）｜ 预估幅度 ｜ 预估金额。窄屏不拆列、只缩字号：320px 下三列共 ≈250px，放得下。 */
  table.est-tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-xs); margin-top: 3px; }
  table.est-tbl th { color: var(--tx3); font-weight: 600; font-size: var(--fs-xxs); text-align: right; padding: 2px 6px; }
  table.est-tbl th.e-nm { text-align: left; }
  table.est-tbl td { padding: 5px 6px; border-top: 1px solid var(--line-soft); text-align: right; font-family: var(--mono); font-feature-settings: "tnum"; color: var(--tx2); white-space: nowrap; }
  table.est-tbl td.e-nm { text-align: left; font-family: inherit; color: var(--tx); white-space: normal; }
  table.est-tbl td.e-amt { color: var(--tx); }
  table.est-tbl tr.sum td { border-top: 1px dashed var(--line-soft); font-weight: 700; color: var(--tx); }
  table.est-tbl .chip { margin-left: 5px; }
  /* 时间标签（2026-10-03 加）：名字下第二行「净值日 → 指数日」——
     估算的两个输入各自带日期，否则这个数会显得比它本身更"当下"（本页纪律：每个数字都要能指出它是哪天的）。 */
  table.est-tbl .e-date { display: block; font-size: 10px; color: var(--tx3); font-family: var(--mono); margin-top: 1px; font-feature-settings: "tnum"; }
  table.est-tbl th .e-th2 { font-weight: 400; color: var(--tx3); font-size: var(--fs-xxs); }
  /* 分档小标（参考 / 不计入）：与 KPI 里那个「估」徽标同一套语言 —— 提示"这个数不是读数" */
  .e-tag { font-size: 9px; color: var(--warn); border: 1px solid var(--line); border-radius: 999px; padding: 0 4px; margin-left: 3px; }
  .alloc-key i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .alloc-key.ndx i { background: var(--accent-solid); }
  .alloc-key.spx i { background: var(--purple-solid); }
  .alloc-key.kr i { background: var(--info-solid); }
  .alloc-key.n225 i { background: var(--warn-solid); }
  .alloc-key.hkus i { background: var(--up-solid); }
  .alloc-key.global i { background: var(--tint-solid); }
  .alloc-key.cash i { background: var(--tx3); }   /* 不用 --tint-line：浅色主题下几乎看不见；与 MARKET_COLORS.cash 同色 */

  /* ===== 盈亏总览：移动优先的两行式列表 =====
     这里原先画「左亏右盈发散条」。条其实只是金额的另一种画法，却占掉近一半宽度，
     把名称/金额/收益率三列一起挤紧（320px 屏名称列只剩 ~118px，长名要截断）。
     去掉条之后改成两行，名称拿到整行宽度，手机上（~400px）一行一眼：
       第一行：名称 ····· 金额（加粗带色）
       第二行：渠道＋口径日期 ····· 收益率
     顺序仍是按金额降序，保持「亏得最多的排最前」这个既有语义。 */
  .pl-row { display: block; width: 100%; padding: 7px 2px; background: transparent; border: 0; color: inherit; cursor: pointer; text-align: left; font-family: var(--sans); }
  .pl-row + .pl-row { border-top: 1px dashed var(--line-soft); }   /* 行分隔用细虚线：够分辨，又不与数值争视线 */
  .pl-row:hover .pl-nm { color: var(--blue); }
  .pl-row[aria-disabled="true"] { cursor: default; }
  /* 能跳转的行带一个 → 尾巴；无目标行（场外无明细卡）自然不显示 */
  .pl-row[data-sel] .pl-nm::after { content: " →"; opacity: .45; font-family: var(--mono); font-size: var(--fs-xxs); }
  .pl-top, .pl-sub { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-width: 0; }
  .pl-nm { font-size: var(--fs-md); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-amt { font-family: var(--mono); font-size: var(--fs-md); font-weight: 700; font-feature-settings: "tnum"; white-space: nowrap; }
  .pl-sub { margin-top: 3px; }
  /* 第二行回到**两段**（来源 ｜ 本金+收益率）。
     ⚠ 2026-09-27 两轮调整的来龙去脉：
       第一轮：体检挤进来后总宽超了 → 手机上「来源独占一行」→ 变成三行总高，桌面改三列 grid。
       第二轮：体检已移出总览、集中到「操作体检」表；来源也精简了（144 → ~90px），
               于是**两段一行放得下** → 撤回上面两条，恢复成两行（用户要求）。
       只留手机端的 flex-wrap 兜底：万一极窄屏（≤320px）放不下，让它折行而不是溢出；
       折行时 .pl-right 的 margin-left: auto 仍把它推到行尾。 */
  @media (max-width: 767px) {
    .pl-sub { flex-wrap: wrap; row-gap: 3px; }
    .pl-sub > .pl-right { margin-left: auto; }
  }
  /* 第二行右侧成对：本金 + 收益率。放一起的理由——本金就是收益率的分母，
     分开两处看不出「拿多少钱赚到的」；本金用更小一号，明确它是基准而非结论。 */
  .pl-sub > .pl-right { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .pl-base { font-family: var(--mono); font-size: var(--fs-xxs); color: var(--tx3); white-space: nowrap; font-feature-settings: "tnum"; }
  .pl-rate { font-style: normal; font-family: var(--mono); font-size: var(--fs-xs); color: var(--tx3); white-space: nowrap; font-feature-settings: "tnum"; }
  .card.pl-flash { border-color: var(--blue); box-shadow: 0 0 0 3px var(--accent-line); transition: box-shadow .3s, border-color .3s; }
  /* ── 盈亏总览：已清仓分节（2026-10-09 用户：「盈亏总览是不是要加上已清仓实现的盈亏？」→ A 方案）──
     组头照 .snap-group 的既有做法（虚线分隔 ＋ 小字），色用 --tx3 ✓ —— 上面 11 行是"持仓浮盈亏"、
     这一节是"已卖出兑现"，两种口径必须一眼分得开。 */
  .pl-sec { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    margin-top: 9px; padding: 6px 0 3px; border-top: 1px dashed var(--line-soft);
    font-size: var(--fs-xxs); color: var(--tx3); }
  .pl-sec > span:first-child { font-weight: 700; letter-spacing: .02em; }
  /* 金额**不涂灰** ✗ —— up/down 的绿红必须留住（一眼看出赚亏）；"次级感"改由降透明度承担 ✓
     另一处小心：.pl-base 默认 nowrap 且不可收缩，窄屏两段并排时会顶破卡片 →
     只在这一行允许它省略号收尾 ✓（不动上面 11 行的既有排布 ✓） */
  .pl-row-cleared { opacity: .85; }
  .pl-row-cleared .pl-base { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  /* ===== 快照对比日志 =====
     每期一张「子卡」，与区间累计卡同一手法：**期次靠盒子（描边 + 留白）区分，不再画期次分隔线**。
     原来逐期卡是 border-bottom 虚线一条接一条排下来，卡内又叠着卡头线 / 小节线 / 分组线 / 合计线，
     一张卡能数出 6~7 条横线，线条互相争视线，反倒看不出「哪几行属于同一期」。 */
  .snap-item { background: var(--card2); border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 12px; margin: 9px 0; min-width: 0; }
  /* 快照对比折叠区：只摊开最新 N 期，更早的期数与基线折进来。里面是一摞同样的子卡，故不再画线 */
  .snap-more { margin-top: 2px; }
  .snap-more > summary { cursor: pointer; list-style: none; text-align: center; font-size: var(--fs-xs); color: var(--blue); padding: 10px 2px; }
  .snap-more > summary::-webkit-details-marker { display: none; }
  .snap-more > summary::after { content: " ▾"; }
  .snap-more[open] > summary::after { content: " ▴"; }
  .snap-more[open] > summary { margin-bottom: 2px; }
  .snap-more > summary b { font-family: var(--mono); font-feature-settings: "tnum"; }
  /* 折叠区 summary 里的首末期日期区间。原误用 .snap-note-meta（期次解读折叠行的元信息列），
     同名不同义：那个选择器被收窄到 .snap-note-wrap 后，这里的 span 就成了无样式、又随时可能被误改 */
  .snap-more > summary .snap-more-range { font-family: var(--mono); font-feature-settings: "tnum"; color: var(--tx3); }
  .snap-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; font-size: var(--fs-sm); font-weight: 400; }   /* 后两项重置 h3 默认字重/字号 */
  .snap-head .snap-tag { margin-left: auto; }   /* 事件标签推到行尾：卡头左侧固定是「日期 + vs」，右侧固定是标签 */
  /* 卡头关键数（2026-09-24 加，用户建议）：把「本期盈亏 / 总盈亏」从卡内两整行提到卡头这一行 ——
     原来它们与「总变化」并列成三行，一眼分不出主次；提到卡头后与日期同级，
     一行读完「哪一期 / 本期涨跌多少 / 累计多少」，卡内只留「总变化 → 银行进出」的组成关系。
     箭头 + 颜色沿用「总变化」那一套（↑ 绿 --up / ↓ 红 --down），数值等宽。
     位置：夹在「vs 前一期」与右侧事件标签之间（.snap-tag 的 margin-left:auto 会把它推到行尾）。 */
  .snap-head .snap-head-k { display: inline-flex; align-items: baseline; gap: 4px; font-size: var(--fs-xs); color: var(--tx3); }
  .snap-head .snap-head-k b { font-family: var(--mono); font-weight: 700; font-feature-settings: "tnum"; }
  .snap-head .snap-head-k b.up { color: var(--up); }
  .snap-head .snap-head-k b.down { color: var(--down); }
  .snap-date { font-family: var(--mono); font-size: var(--fs-sm); font-weight: 700; font-feature-settings: "tnum"; }
  .snap-vs { font-size: var(--fs-xs); color: var(--tx3); }
  /* 标签列固定宽 + 内容列自适应：多行之间的数值左边界对齐（原 flex-wrap 折行后锯齿错位） */
  .snap-line { display: grid; grid-template-columns: 66px 1fr; align-items: baseline; gap: 8px; padding: 2.5px 0; font-size: var(--fs-sm); min-width: 0; }
  /* 持仓变化表的行（2026-09-24）：背景与分隔照「盈亏总览」—— 无底色块，行间一条 1px 虚线 var(--line-soft)
     （那边是 .pl-row + .pl-row），只是「够分辨」，不与数值争视线。
     限定在 .snap-tbl 内、且只看**紧邻**的两条明细行：跨分组时中间隔着 .snap-group，天然不连成一片。
     顺带把行高放松到 5px（原 2.5px 是给「无分隔密排」用的，画了线就太挤）。 */
  .snap-tbl .snap-line { padding: 5px 0; }
  .snap-tbl .snap-line + .snap-line { border-top: 1px dashed var(--line-soft); }
  .snap-line .n { font-weight: 600; color: var(--tx2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snap-line .v { font-family: var(--mono); font-size: var(--fs-xs); color: var(--tx2); font-feature-settings: "tnum"; min-width: 0; }
  .snap-line .v b { color: var(--tx); font-weight: 700; }
  /* 持仓明细行：「名称(+份数变化) | 当日盈亏 · 总盈亏」——重心在盈亏，仓位降为名称后缀。
     2026-09-23：盈亏由两列并为一列（原来 78+84px），手机上一列换成 116px、宽屏 124px，
     腾出的宽度还给名称；两个数按字号分主次（见 .dv / .cv）。 */
  .snap-line.item { grid-template-columns: 1fr 124px; }
  /* flex-wrap（2026-09-23）：名称是这一行里**唯一**可压缩的项（其余三个标签都 flex-shrink:0），
     手机上名称列只有 ~140px，被「/ 渠道 + 净值日 + 份数」三个标签挤到只剩 ~40px →
     「华安纳指C」显示成「华…」，认不出是哪只基金。允许换行后：名称整占一行，
     标签放不下就自己折到第二行（只有真放不下的行才多占一行，放得下的行不变）。 */
  .snap-line.item .n { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
  /* 名称列同用 10px、不加粗（2026-09-23 用户要求）：整张持仓变化表统一一档字号，
     层级交给「留白 + 色彩」表达（绿/红仍表方向，「本期无变动」仍只把当日盈亏降灰）。
     ⚠ 只有这一处例外：列头与两个数字都是 10px 时，名称若仍 12px/600 会重新变成"最重"的元素。 */
  .snap-line.item .n .nn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-size: var(--fs-xs); font-weight: 400; }
  /* 字号整档（2026-09-24 review）：明细名称原为 --fs-xxs（10px），于是「13 行的正主」成了整张卡里
     最小的正文字号，而分组头 / 表头都是 11px 的 700 —— 主次反了。升到 11px/400：
     与「本金与收益」里的名称（12px/600）更近，同时仍靠字重与颜色弱于分组头。
     后缀保持 10px（份数 .qty-tag / 渠道 .snap-src）—— 名称与后缀的主次由此表达。 */
  .snap-line.item .n .qty-tag { flex-shrink: 0; font-size: var(--fs-xxs); font-weight: 400; color: var(--tx3); font-family: var(--mono); white-space: nowrap; font-feature-settings: "tnum"; }
  /* 快照明细行的来源短标签（场内 / 博时 / 华安 …）：与「盈亏总览」同款斜杠前缀，
     固定 2~3 字且不允许压缩——名称列窄，长标签会把名称挤成省略号 */
  .snap-line.item .n .snap-src { flex-shrink: 0; font-size: var(--fs-xxs); font-weight: 400; font-family: var(--sans); color: var(--tx3); white-space: nowrap; }
  .snap-line.item .n .snap-src::before { content: "/ "; }
  .snap-line.item .d { font-family: var(--mono); font-size: var(--fs-xs); text-align: right; white-space: nowrap; font-feature-settings: "tnum"; }
  .snap-line.item .v { text-align: right; }
  /* ===== 快照卡版式规范（全卡一致 · 2026-09-20 整理）=====
   * ① 标签列统一 66px（≤400px 收 58px）——金额行的左边界跨行对齐；
   * ② **卡内零横线**：层级只靠「留白 + 字重 + 缩进竖线 + 分组底带」表达
   *    （小节线、分组线、卡头线已全部删掉——线条越多，越看不出哪条重要）；
   * ③ 从属一律「缩进 + 左 2px 竖线」（.snap-parts / .snap-tbl）；
   * ④ 期次靠子卡盒子区分（.snap-item），区间累计卡更重一档。 */
  .snap-sec { margin-top: 12px; font-size: var(--fs-xs); font-weight: 700; color: var(--tx2); letter-spacing: .06em; }
  .snap-sec .snap-cnt { font-weight: 400; letter-spacing: 0; color: var(--tx3); }   /* 小节题末尾的只数（原由「合计 N 只」行承载） */
  .snap-sec .n { font-size: var(--fs-xs); font-weight: 700; color: var(--tx2); letter-spacing: .06em; }   /* 「场内动作」这类行式小节标题 */
  /* ===== 本金与收益：信息分层（2026-09-22）=====
     这张卡原来把所有口径平铺（三行等式 ＋ 收益构成 ＋ 收益率口径 ＋ 逐只 XIRR ＋ 逐只体检），
     手机上近 40 行密集文字，「该看什么」被淹掉。改法：
       ① 三行等式（本金 → 累计收益 → 总资产）常显 —— 回答「投了多少 / 赚了多少 / 现在多少」；
       ② 一句话结论常显（.pf-concl）—— 回答「该看什么」；
       ③ 其余四块各自折叠，折叠行的 .snap-cnt 里直接带上结论数字，收起时不丢信息。 */
  .pf-concl { margin-top: 8px; padding: 6px 8px; border-radius: 8px; background: var(--card2); border: 1px solid var(--line-soft);
    font-size: var(--fs-xs); color: var(--tx2); line-height: 1.7; }
  .pf-concl b { font-family: var(--mono); font-feature-settings: "tnum"; }
  /* 折叠块：summary 直接复用 .snap-sec 的小节题样式，展开才铺出明细（全页一个版式） */
  /* 折叠 summary（2026-09-23 修）：原来 ▾ 是 flex 子项，总结文字一长就被挤到**单独一行**
     （「本金与收益」卡里三处折叠全如此，看着像坏掉的列表项 ✗）。
     ⚠ 试过 nowrap + 截断：反把标题挤成逐字折行（「逐只 / XIRR / 与 / TWR」✗✗）——
     因为标题是匿名 flex 子项、默认会被压缩。最终办法：正文照旧换行（预览完整可读），
     ▾ 改为**绝对定位在右上角**，与有没有第二行无关。 */
  .pf-fold > summary.snap-sec { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; position: relative; padding-right: 18px; }
  .pf-fold > summary.snap-sec::-webkit-details-marker { display: none; }
  .pf-fold > summary.snap-sec::after { content: "▾"; position: absolute; right: 0; top: 0; color: var(--tx3); font-size: var(--fs-xxs); font-weight: 400; }
  .pf-fold[open] > summary.snap-sec::after { content: "▴"; }
  .pf-fold > summary.snap-sec .snap-cnt { flex: 1 1 auto; min-width: 0; }
  /* 原「合计 N 只」行已删：两个数字与上方「当日盈亏 / 总盈亏」完全重复，只数由小节标题承载 */
  /* 列表头（2026-09-24 重做）：原来「持仓变化 N 只」是一行小节题（.snap-sec）、下面再跟一行空列头 ——
     两行说的是同一件事（这块是什么 + 两列是什么）。现在合成**一行**：左边小节题，右边列标签，
     仍旧与明细行同网格（1fr 1fr + 12px）→ 列标签天然对齐两个数字列，不靠手调。
     左边用 .snap-tbl-key 承载原 .snap-sec 的字重与色阶（fs-xs/700/tx2），右边保持表头的弱色小字。 */
  .snap-group-title { display: grid; grid-template-columns: 1fr 124px; gap: 8px; align-items: baseline;
                      font-size: var(--fs-xs); font-weight: 400; color: var(--tx3); letter-spacing: .06em; margin: 14px 0 3px; }
  /* ⚠ 第二列宽必须与 .snap-line.item 的**同一个值**同步（桌面 124px / 窄屏 116px，见下面的媒体查询）——
     2026-09-24 修：原来这里是遗留的三列 1fr 78px 84px（旧版「市场盈亏 / 累计盈亏」两列的遗迹），
     两列合并成 .snap-tcol 后 .snap-tcol 落在 78px 那格里，列标签被压成 33px 且左边界比数字左 46px，
     窄屏有覆盖所以看不出来，只在非移动端错位。 */
  /* 表头三个词的**字号统一**为 --fs-xs（「持仓变化 N 只」与「当日」「总盈亏」同号），
     层次仍由字重与颜色区分（标题 700/tx2，列标签 400/tx3）。原来列标签是 --fs-xxs（10px）、标题 11px。 */
  .snap-group-title .snap-tbl-key { font-size: var(--fs-xs); font-weight: 700; color: var(--tx2); letter-spacing: .06em; }
  .snap-group-title .snap-tbl-key .snap-cnt { font-weight: 400; letter-spacing: 0; color: var(--tx3); }
  .snap-group-title span:not(:first-child) { text-align: right; }
  /* 列头两格与下方明细行的两个数字**同网格**（1fr 1fr + 12px）—— 字号不再区分主次后，
     「哪个是哪个」就靠这行表头：当日盈亏对齐左半格、总盈亏对齐右半格（2026-09-23）。 */
  .snap-group-title .snap-tcol { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .snap-group-title .snap-tcol i { font-style: normal; text-align: right; }
  /* 场内 / 场外分组头：**默认全展开**（原折叠 + 可收起），只留一行标签。
     两个小计不再重复——它们就是上方「当日盈亏 / 总盈亏」两行的场内·场外拆分；
     组小计与底部「合计」行同理，一并去掉（数字都在结论区，这里只回答「谁在动」）。
     分组的理由仍是数据节奏不同：场内券商收盘一次到位，场外 QDII 逐只滞后一天。 */
  /* 分组头：原来沿用明细行的 1fr 78px 84px 三列网格、却只填第一列 → 手机上天数一栏只剩
     ~184px，「场外 8 只 净值日 09.17~09.18 混排」正好在词中间折行（场内行也贴着临界）。
     改 flex：左段（组名 + 只数）与右段（数据节奏）各自 nowrap、整体可换行 —— 折也只折在两段
     之间，不会从词中间断开；hint 推到行尾，与右侧两个数字列大致对齐。 */
  /* 分组头（2026-09-24 二次修改）：上一版用 --line-soft 浅底带，用户反馈「跟 KPI 格糊成一种颜色」——
     确实，KPI 格也是浅底色块，两者同属「有底色的盒子」。盈亏总览里一个底色块都没有，靠的是
     「行间细虚线 + 字重」。现在照它来：去掉底色 / 圆角 / 负缩进，改成组首一条浅虚线 + 加粗字，
     与 KPI 的「有框格子」彻底区分；组内仍是连续的行式列表（见上面的 .snap-tbl .snap-line）。 */
  .snap-group { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding: 5px 0 3px; border-top: 1px dashed var(--line-soft); font-size: var(--fs-xs); font-weight: 700; color: var(--tx); }
  /* 字号整档（2026-09-24 review）：原为 --fs-xxs（10px），比同卡的列表头（.snap-tbl-key 11px/700）、
     卡内小节题（.snap-sec 11px/700）都小一档 —— 三者都是「行标题」性质，统一到 11px/700；
     层次改由颜色与位置表达（分组头用 --tx 最重、表头 --tx2、小节题 --tx2）。 */
  .snap-group .snap-group-key { white-space: nowrap; }
  .snap-group .snap-group-hint { margin-left: auto; white-space: nowrap; font-weight: 400; color: var(--tx3); }
  /* ===== 持仓明细的主次（原 13 行平铺，一眼看不出重点）=====
     ① 本期有动作（份额变了 / 盈亏幅度 ≥1 元）：当日盈亏列加粗着色，排在组内最前（亏得最多在最上）；
     ② 本期无变动（场外净值滞后时整天不动很常见）：该列降为灰字常规字重，排到组内末尾。
     总盈亏列不参与分级——它是持仓水平，本期无变动 ≠ 没事（港美 −5,368 就是长期浮亏）。 */
  /* 合并列内的主次（2026-09-23）：左＝当日盈亏（本期事件，加粗、大一号）；右＝总盈亏（持仓水平，常规、小一号）。
     ⚠ 初版把两个数放进同一条 inline 流（只差一个 6px 外边距）→ 两个数字贴在一起、跨行也不对齐，
     读起来像一串数（用户反馈「挤在一起」）。改成**半格两列、各自右对齐**：跨行竖直对齐，
     格与格之间固定 8px 间隔，紧凑但不会撞上。 */
  .snap-line.item .d { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; align-items: baseline; }
  /* 两个数**同一档字号、都不加粗**（2026-09-23 用户要求）：行面更安静、更密。
     于是「哪个是哪个」不再靠字号，改由①位置（左＝当日盈亏 / 右＝总盈亏）＋②对齐到两数上方的列头承担；
     颜色仍保留语义（绿/红），"本期无变动"的行仍只把当日盈亏降灰。 */
  .snap-line.item .d .dv,
  .snap-line.item .d .cv { text-align: right; font-weight: 400; font-size: var(--fs-xxs); }
  /* 「本期无变动」的行：把**当日盈亏**降灰（总盈亏保留自己的颜色 —— 它是持仓水平，不是本期事件） */
  .snap-line.item.snap-flat .d .dv { color: var(--tx3); font-weight: 400; }
  .snap-line .v .snap-sub { color: var(--tx3); }   /* 内容列内的次级小注 */
  .snap-tag { font-size: var(--fs-xxs); font-weight: 700; border-radius: var(--radius-xs); padding: 1px 6px; border: 1px solid; white-space: nowrap; }
  .snap-tag.add { color: var(--cyan); border-color: var(--info-line); background: var(--info-bg); }
  .snap-tag.cut { color: var(--yellow); border-color: var(--warn-line); background: var(--warn-bg); }
  .snap-tag.open { color: var(--green); border-color: var(--up-line); background: var(--up-bg); }
  .snap-tag.close { color: var(--red); border-color: var(--down-line); background: var(--down-bg); }
  /* ── 动作行标签的间距（2026-10-09 修，用户反馈：「动作 的标签文字之间有遮挡」）────────────────
     实测（1440px）：标签 10px/700、padding 1px 6px → 单枚盒子实高 **17px**，
     但**行内盒的 padding / border 不参与行高计算** ✗ → 行高仍按 10px 字体的 normal（≈14px），
     于是相邻两行**竖向重叠 3px**（第一行 y=2633 + 17 = 2650 > 第二行 y=2647）✗；
     相邻标签之间又没有 margin → 边框紧贴，横向还压 1px ✗（实测 6 对重叠）。
     修法：① 标签改 inline-block，padding 就进行高 ✓ ＋ 上下各留 2px 余量；
           ② 相邻标签之间留 4px 缝 ✓；两者都**只在动作行生效** ✓（其它用到 .snap-tag 的地方不动 ✗）。
     ⚠ 没动字号 / 字重 ✓：字号已经是全页最小档 --fs-xxs（10px）✗ 再缩就低于可读线；
       700 是 chip 的识别特征 ✓ —— 遮挡的根因是行高，不是这两个 ✓。 */
  .snap-line.acts .snap-tag { display: inline-block; margin: 2px 4px 2px 0; }
  /* ── 盈亏归因矩阵：清仓角标（2026-10-09 加，配合 periodContrib 的统一口径）─────────────
     「清 N」＝该期清掉了几只（金额已按「回款 − 期初市值」计入本行 ✓，title 列出是哪几只 ✓）
     「⚠」＝清仓但查不到流水 → **不可归因**（不是 0 ✗，琥珀色沿用资金方向那一套 warn 语义 ✓） */
  /* ── 「逐期明细」持仓变化行**可点**（2026-10-10 用户选的 ①）────────────────────────
     点它 → 切到「盈亏归因」看这只的逐期轨迹 ✓（行为在 gotoHoldInAttr ✓）。
     ⚠ 只给"可点的样子" ✓：光标 ＋ 悬停底色 ＋ focus 环 ✓ —— 与矩阵格子 / 归因成员行同一套语言 ✓。 */
  #snap-list .snap-line.item[data-attr] { cursor: pointer; border-radius: 6px; }
  #snap-list .snap-line.item[data-attr]:hover { background: rgba(147, 163, 187, .08); }
  #snap-list .snap-line.item[data-attr]:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  .sa-mx .mx-close { display: inline-block; margin-left: 3px; padding: 0 3px; border-radius: 3px;
    font-size: var(--fs-xxs); font-weight: 700; color: var(--cyan); background: var(--info-bg); border: 1px solid var(--info-line); }
  .sa-mx .mx-close.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
  .sa-detail .sd-k { font-style: normal; margin-left: 4px; padding: 0 3px; border-radius: 3px;
    font-size: var(--fs-xxs); font-weight: 700; color: var(--cyan); background: var(--info-bg); border: 1px solid var(--info-line); }
  .sa-detail .sd-k.na { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
  /* （2026-09-24 删除）.snap-line.total：旧行式分支的「总资产 A → B」行样式；该分支已删（逐期卡全走 KPI），
     页面里再没有生成 .snap-line.total 的地方。 */
  /* 归因拆分小注（银证实锤 / 场外估）：单独占内容列，弱化，避免挤在同一行长句中 */
  /* ===== 变化组成块：总资产 → 总变化 → 组成项（逐项解释）=====
     原先把「变动 + 等式 + 累计浮盈亏区间 + 口径提醒」压在一行，信息没少但读不出层次。
     现在每块只回答一个问题，纵向铺开：总资产多少 → 变了多少 → 谁造成的（逐项）→ 当天多少。 */
  /* 组成项挂在「总变化」之下：整组缩进 + 左侧竖线，每行前缀箭头。
     原来只靠一个「变化组成」标题行表示从属，而列表本身毫无缩进，关系读不出来。
     只缩进标签+数值两列（右侧「?」列不动），? 在各行之间保持同一条竖线。 */
  .snap-parts { margin-top: 5px; margin-left: 2px; padding-left: 13px; border-left: 2px solid var(--line-soft); }
  /* 持仓变化表（2026-09-24 用户要求「引用线去掉、表格背景参考盈亏总览、不要和 KPI 融为一体」）：
     原先沿用「缩进 + 左 2px 竖线」的引用块样式，可它嵌在逐期子卡里，竖线与子卡自己的圆角描边并排，
     看着就是多画了一条线。现在与卡头齐平（去掉缩进与竖线），改成盈亏总览那种**行式列表**：
     层级全靠「行间细虚线 + 字重 + 留白」，没有任何底色块 —— 与 KPI 的「有框格子」一眼区分。
     ⚠ .snap-parts（本金与收益的组成项）保持原样的引用块样式，不跟着改。 */
  .snap-tbl { margin-top: 5px; }
  /* 原在此用「└→」/「└」前缀表示从属；块本身已有缩进 + 左侧竖线（引用块样式），
     前缀属重复，已删除——顺带把标签列从 70px 收回 66px，数值列更宽。 */
  /* 标签列宽与 .snap-line 一致（66px；窄屏统一 58px）→ 数值左边界跨行对齐。
     原为 58px，与 .snap-line 的 66px 差 8px，同一张卡里金额左边界就不成一条线。
     「?」独立占行尾一列，不放标签里：4 字的「当日盈亏」加按钮会超出 66px 标签列。 */
  .snap-part { display: grid; grid-template-columns: 66px 1fr auto; align-items: baseline; gap: 8px; padding: 2px 0; font-size: var(--fs-sm); }
  /* （2026-09-30 整段删除）原先这里是「逐只资金加权」那一套 grid 行样式：
     .snap-part.fund / .snap-part.fund.head / .xr-det / .snap-twr，以及后来加的 .xr-grp 分组条。
     用户两次反馈「表格还是对不齐」——根因就在这里：细节行是用「 · 」连成的**自由文本**，
     同一行各字段的左边界随字数浮动（「91 天」与「120 天」之后的内容就错开了），
     13 行叠起来看着像没排过版。
     现已整体换成**真表格** .xr-tbl（见文件后部、紧挨 .chk-tbl 的那一段），
     与「操作体检」同一套语言：列宽由内容自动对齐、数字列右对齐 + 等宽、手机端落成
     「名称独占一行 + 分项等宽三列 ×2 行 + 备注分条」，两张表读法完全一致。 */
  .snap-part .strat-hint { align-self: center; }
  /* nowrap：标签一律单行（最长 4 字「本期盈亏」＝48px，列宽 58px 留 10px 余量），
     宁可让数值列窄一点也不折行——折行后整块表格的纵向对齐全乱。 */
  .snap-part .pn { font-weight: 600; color: var(--tx2); white-space: nowrap; }
  .snap-part .pv { font-family: var(--mono); font-size: var(--fs-sm); font-weight: 700; font-feature-settings: "tnum"; }
  /* 数值后紧跟的小注一律留 5px 间隙（与 .snap-subblock 同值）：10px 小注贴着 12px 等宽数字会糊成一串，
     原先靠 .snap-subblock 的 margin-left 提供，改用 .snap-sub 后就没有间隙了，故在此统一补上。 */
  .snap-part .snap-sub { margin-left: 5px; }
  /* ===== 本金与收益 · 顶部「本金 ＋ 累计收益 ＝ 总资产」三格条（2026-09-30 重做）=====
     原来这三行是普通 .snap-part 平铺，读者得自己在「本金 / 累计收益 / 总资产」之间**连出**那个等式；
     现在把等式直接画出来：三格 KPI + 两枚运算符（＋ / ＝）。运算符各占一个 auto 宽列，
     所以三格等宽、跨行对齐；格内是「标签 / 数值 / 小注」三行，与走势卡的 KPI 同一读法。
     ⚠ 与 .snap-part 不是一套：这里是有框格子（告诉读者「这是三个并列的合计」），
       .snap-part 是无框行式列表（告诉读者「这是一条条明细」）—— 两者的层级区分见 handoff §4.6。 */
  .prin-kpis { display: grid; align-items: stretch; margin: 3px 0 1px; gap: 6px;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); }
  .prin-kpis .pk { min-width: 0; padding: 7px 9px 6px; border-radius: 8px;
    background: var(--card2); border: 1px solid var(--line-soft); }
  .prin-kpis .pk-op { align-self: center; font-size: var(--fs-sm); font-weight: 700; color: var(--tx3); }
  .prin-kpis .pk-k { font-size: var(--fs-xxs); font-weight: 600; color: var(--tx3); letter-spacing: .04em; white-space: nowrap; }
  .prin-kpis .pk-v { margin-top: 1px; font-family: var(--mono); font-size: var(--fs-md); font-weight: 700;
    font-feature-settings: "tnum"; white-space: nowrap; }
  /* 小注一律单行 + 省略号：窄屏（390px）格宽只有 ~106px，长注宁可截断也不折行（折行会把三格高度拉不齐）。
     完整口径都在紧跟其后的 ? 浮层里（prin-q），所以截断不丢信息。 */
  .prin-kpis .pk-n { margin-top: 1px; font-size: var(--fs-xxs); color: var(--tx3); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .prin-kpis .pk-n .strat-hint { margin-left: 4px; vertical-align: -1px; }
  /* （2026-09-30 删除）原先这里是评级胶囊 .gr / .gr-a..e 的自带配色。
     评级已改为复用 .chk-tbl 的档位字母样式（.oc-a/b/c/d/na）—— 与「操作体检」的档位同色、同语义，
     两处不再各说各话，故这套胶囊样式随之退役。 */
  /* （2026-09-24 删除）原先这里是「银行进出」行内构成小账本的一整套样式：.snap-flow / .sf-led /
     .sf-row / .sf-k / .sf-det / .sfx / .sfp。随 snapFlowNote 一起退役 —— 构成与逐期·逐只明细现在
     只存在于「银行进出」的 ? 浮层里（见 snapFlowTip）。这条路走过两版（先铺开、后折叠），
     结论是行内只留三格 KPI，明细一律进浮层。 */
  /* 组成块与紧随其后的行（当日盈亏 / 当前浮亏）之间留分组间距 */
  .snap-parts + .snap-line, .snap-parts + .snap-part { margin-top: 6px; }
  /* 对照条里「本期 / 累计」的小注：跟在金额后面同一行（390px 下定长 224px ≤ 可用 239px）。
     整块 nowrap：窄屏（≤360px）放不下时整段折到第二行，绝不会在数字中间断开。 */
  .snap-parts .snap-subblock { margin-left: 5px; white-space: nowrap; }
  /* 区间累计卡：整段的总账，比逐期卡更重一档（描边更深 + 主题色渐变），并留更大下边距与下面第一张逐期卡分开 */
  .snap-item.snap-sum { background: linear-gradient(135deg, var(--accent-bg), transparent 55%); border-color: var(--line); padding: 11px 12px; margin: 4px 0 14px; }
  /* 期次解读：与「场内动作 / 持仓变化」**同级的小节**（原来是左侧竖线的引用块，看着像注脚）。
     标题行 = 期次解读 + 首段截断 + ⚠ 计数 / 全文字数，点开看全文；默认收起仍必要
     （各期备注平均 328 字、最新一期 942 字 ≈ 48 行，摊开把卡片撑长十几倍）。 */
  .snap-note-wrap { margin-top: 12px; min-width: 0; }
  .snap-note-wrap > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 5px; min-width: 0; font-size: var(--fs-xs); font-weight: 700; color: var(--tx2); letter-spacing: .06em; }
  .snap-note-wrap > summary::-webkit-details-marker { display: none; }
  .snap-note-wrap > summary .snap-note-key { flex: 0 0 auto; }
  .snap-note-wrap > summary .snap-note-meta { flex: 0 0 auto; white-space: nowrap; font-weight: 400; letter-spacing: 0; font-family: var(--mono); font-feature-settings: "tnum"; }   /* 字数 / ⚠ 计数与页面其他数字同一套等宽 */
  .snap-note-wrap > summary .snap-note-meta::after { content: " ▾"; }
  .snap-note-wrap[open] > summary .snap-note-meta::after { content: " ▴"; }
  /* 折叠态只留首段截断（一行省略号）；展开后隐去，免得与全文开头重复 */
  .snap-note-wrap > summary .snap-note-preview { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; letter-spacing: 0; }
  .snap-note-wrap[open] > summary .snap-note-preview { display: none; }
  /* 期次解读全文：颜色用 --tx2 而非最淡的 --tx3 —— 它是本期的实质内容，不是注脚 */
  .snap-note { font-size: var(--fs-xs); line-height: 1.75; color: var(--tx2); margin-top: 5px; min-width: 0; overflow-wrap: break-word; }
  /* ① 一句一行（原为整段文字流：平均每句 53 字、最长 144 字），并给每行编号：
     编号走 CSS 计数器（::before），不写进 HTML 文本，复制/打印/对账都不受影响。 */
  .snap-note-body { margin: 0; padding: 0; list-style: none; counter-reset: noteline; }
  .snap-note-p { position: relative; padding-left: 22px; margin: 0 0 4px; counter-increment: noteline; }
  .snap-note-p:last-child { margin-bottom: 0; }
  .snap-note-p::before { content: counter(noteline) "."; position: absolute; left: 0; top: 0; width: 16px; text-align: right; color: var(--tx3); font-family: var(--mono); font-size: var(--fs-xxs); font-feature-settings: "tnum"; }
  /* ③ 数字等宽：同一句里排开的金额串能对齐（不加边距，避免把中文行文打断） */
  .snap-num { font-family: var(--mono); font-feature-settings: "tnum"; }
  /* ② 口径提醒：含 ⚠ 的句子从正文抽出、条目化。左侧暖色竖线是唯一的强调（不画横线，与卡内零横线一致） */
  .snap-note-caveat { margin-top: 7px; padding: 5px 0 1px 9px; border-left: 2px solid var(--warn-line); }
  .snap-note-caveat .snap-note-caveat-h { font-size: var(--fs-xxs); font-weight: 700; color: var(--tx3); letter-spacing: .06em; margin-bottom: 4px; }
  .snap-note-caveat ol { margin: 0; padding-left: 15px; }   /* 口径条目自带 1. 2. 3. 序号（与正文分开计数，各自从 1 起） */
  .snap-note-caveat li { margin-bottom: 4px; }
  .snap-note-caveat li::marker { color: var(--tx3); font-family: var(--mono); font-size: var(--fs-xxs); }
  .snap-note-caveat li:last-child { margin-bottom: 0; }
  .snap-note .warn { color: var(--yellow); }

  /* ---- 标的替换回测（🔁 板块）：默认折叠成一行放结论，点开逐只候选。
     沿用全卡同一套层级语言：列头（淡）/ 行（细线）/ 你的那行高亮；数字统一 mono。 ---- */
  .alt-wrap > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 5px 0; font-size: var(--fs-sm); font-weight: 600; }
  .alt-wrap > summary::-webkit-details-marker { display: none; }
  .alt-wrap > summary .alt-key::after { content: " ▾"; font-weight: 400; color: var(--tx3); }
  .alt-wrap[open] > summary .alt-key::after { content: " ▴"; }
  .alt-wrap > summary .alt-meta { font-size: var(--fs-xxs); font-weight: 400; color: var(--tx3); font-family: var(--mono); }
  .alt-grp { margin: 8px 0 2px; }
  .alt-grp + .alt-grp { border-top: 1px solid var(--line); padding-top: 10px; }
  .alt-grp-head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-bottom: 5px; }
  .alt-grp-head b { font-size: var(--fs-sm); }
  .alt-grp-head span { font-size: var(--fs-xxs); color: var(--tx3); font-family: var(--mono); }
  /* 列宽随字号收：数字与左列同为 10px（--fs-xxs），数值列只需要 66/78px，多出的宽度全给名称列 */
  .alt-col, .alt-row { display: grid; grid-template-columns: 1fr 66px 78px; gap: 7px; align-items: baseline; }
  .alt-col { font-size: var(--fs-xxs); font-weight: 400; color: var(--tx3); letter-spacing: .06em; padding-bottom: 3px; border-bottom: 1px solid var(--line); }
  .alt-col span:not(:first-child) { text-align: right; }
  /* 数字与左列（名称/费率）同字号：层级不再靠字号，只靠【颜色】（结论）与【灰度】（主数值/辅助）。
     铁律沿用页面既有约定：涨跌一律 var(--up)/var(--down)（见 :root 注释）；
     10px 小注里不用一级色 --tx（色阶倒挂）——所以主数值走 --tx2，不用 --tx。 */
  .alt-row { padding: 3px 0; border-bottom: 1px solid var(--line-soft); font-size: var(--fs-xxs); }
  .alt-row .alt-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tx2); }
  .alt-row .alt-name i { font-style: normal; color: var(--tx3); margin-left: 4px; }
  .alt-row .alt-name em { font-style: normal; color: var(--blue); border: 1px solid var(--accent-line); background: var(--accent-bg); border-radius: 999px; padding: 0 5px; margin-left: 4px; }
  .alt-row .alt-v, .alt-row .alt-d { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .alt-row .alt-v { color: var(--tx2); }   /* 主数值：中性（不是结论，不上色） */
  /* 差值：结论只靠【颜色】表达，不加粗 —— 数字一律等宽常规字重，粗体会让整列发闷、也压掉字号层级 */
  .alt-row .alt-d { font-weight: 400; }
  .alt-row .alt-d s { text-decoration: none; color: var(--tx3); font-weight: 400; font-size: var(--fs-xxs); margin-left: 3px; }
  /* 不构成行动的项目整行降级：不可换的持仓只作背景信息，不参与视线竞争 */
  .alt-row.dim .alt-name, .alt-row.dim .alt-v, .alt-row.dim .alt-d { color: var(--tx3); }
  /* 数字列里放文字说明时：不参与「结论加粗」，退回三级灰小字 */
  .alt-row .alt-d .mut { font-weight: 400; font-size: var(--fs-xxs); color: var(--tx3); }
  .alt-row.mine { background: var(--accent-bg); }
  .alt-row.otc .alt-name, .alt-row.otc .alt-v { color: var(--tx3); }
  /* 「你持有」与「你的（基准行）」用小胶囊区分：前者中性灰（只是事实），后者主题色（是基准） */
  .alt-row .alt-name em.alt-held { color: var(--tx2); border-color: var(--line); background: var(--card2); font-weight: 400; }
  .alt-sub { margin: 7px 0 0; font-size: var(--fs-xxs); color: var(--tx3); letter-spacing: .06em; line-height: 1.6; }
  .alt-sub b { color: var(--tx2); }
  .alt-sub-note { color: var(--tx3); letter-spacing: 0; }
  /* 费率体检：可换项用「两行一组」而不是三列表 —— 上行现在、下行换成它，箭头把方向讲死；
     替代产品的代码/名称/费率都露出来，不用悬停去猜。 */
  .alt-swap { padding: 5px 0; border-bottom: 1px solid var(--line-soft); }
  .alt-swap .row1 { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; font-size: var(--fs-xxs); }
  .alt-swap .row2 { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: baseline; font-size: var(--fs-xxs); margin-top: 2px; }
  /* 上行＝现状（三级灰，最淡）、下行＝建议（二级灰，稍亮）；箭头用主题色（表达路径，不表达盈亏） */
  .alt-swap .from { color: var(--tx3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .alt-swap .to { color: var(--tx2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .alt-swap .from i, .alt-swap .to i { font-style: normal; color: var(--tx3); margin-left: 4px; }
  .alt-swap .arw { color: var(--blue); font-family: var(--mono); }
  .alt-swap .mv, .alt-swap .sv { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .alt-swap .mv { color: var(--tx2); }
  .alt-swap .sv { font-weight: 400; }                                  /* 结论数字：只用颜色区分，不加粗 */
  .alt-swap .sv.up { color: var(--up); }                               /* 换成它 = 对你是收益 → 绿 */
  .alt-swap .sv.down { color: var(--down); }
  .alt-swap .sv s { text-decoration: none; font-weight: 400; font-size: var(--fs-xxs); color: var(--tx3); margin-left: 4px; }
  .alt-swap .lbl { color: var(--tx3); font-weight: 400; margin-right: 3px; }
  .alt-swap-total { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--line); font-size: var(--fs-xxs); color: var(--tx2); }
  /* 合计行的数字：与正文行同为 10px、同为常规字重，所以这里也不能用一级色 --tx（色阶倒挂铁律），
     结论的分量交给 .up/.down 上色那一个数。 */
  .alt-swap-total .num { font-family: var(--mono); font-weight: 400; color: var(--tx2); font-variant-numeric: tabular-nums; }

  /* ---- ⓘ 说明徽标 + 共用浮层（全页可复用）：口径这类长文不进正文，点开看 ----
     「说明类的、不重要的、太长的」一律走这里，正文只留结论与徽标。
     浮层固定在底部（手机友好），点别处 / 再点同一个 / Esc 关闭。 */
  .tip { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; padding: 0; margin-left: 4px;
    position: relative;   /* 热区扩展的锚点，见下方 .tip::after */
    border-radius: 50%; border: 1px solid var(--line); background: var(--card2); color: var(--tx3);
    font: italic var(--fs-xxs)/1 var(--mono); cursor: pointer; vertical-align: middle; }   /* 9px → 10px（原低于全站最小字号一档） */
  .tip:hover, .tip:focus-visible { color: var(--blue); border-color: var(--accent-line); }
  /* 弹层（2026-09-30 改）：用户「index.html 的 ? 点击弹窗更好看，可以借鉴到 positions」→ 照搬它的观感：
     深色卡片（#1a2436）+ 蓝色光环描边 + 12px 圆角 + 入场动画 + backdrop 模糊；浅色主题单独覆盖
     （与 index 的 body.light .hint-pop 同一组色值）。
     ⚠ 位置也从「屏幕底部居中」改成**贴着按钮弹出**：JS 里用 getBoundingClientRect 定位，
       下方盛不下就翻到按钮上方、左右做视口夹取 —— 与 index 同一套行为（见本文件的 click 委托）。
     ⚠ 保留 white-space: pre-line：本页不少 tip 文案是多行的（逐只表的备注就是"一条一行"）。 */
  .tip-pop { position: fixed; z-index: 99999; width: min(340px, 92vw); max-height: 46vh; overflow-y: auto;
    background: #1a2436; border: 1px solid #33415e; border-radius: 12px; padding: 10px 13px;
    box-shadow: 0 14px 44px -8px rgba(0, 0, 0, .75), 0 0 0 1px rgba(91, 163, 255, .18);
    font-size: 11.5px; line-height: 1.65; color: var(--tx); white-space: pre-line;
    animation: tipIn .15s ease; backdrop-filter: blur(6px); }
  body.light .tip-pop { background: #fff; border-color: #cbd5e1;
    box-shadow: 0 14px 44px -8px rgba(15, 23, 42, .18), 0 0 0 1px rgba(91, 163, 255, .22); }
  @keyframes tipIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .tip-pop .tip-x { float: right; margin-left: 8px; padding: 0 2px; border: 0; background: none; color: var(--tx3); font-size: var(--fs-xs); cursor: pointer; }
  /* 弹层里的**结论头**（2026-09-30 加）：逐只表「说明」列的调用方会传一句结论 ——
     先给结论、再给依据；加粗 + 下方虚线与正文隔开。不传 head 的其它 ⓘ 观感不变。 */
  .tip-pop .tip-head { font-weight: 700; color: var(--tx); margin: 0 0 7px; padding-bottom: 7px;
    border-bottom: 1px dashed var(--line); }
  /* 徽标：一个词说明一档事实（假设 / 已是最低 / 你持有），比整句说明省 80% 宽度 */
  .pill { display: inline-block; padding: 0 5px; margin-left: 4px; border: 1px solid var(--line); background: var(--card2);
    border-radius: 999px; font-size: var(--fs-xxs); font-weight: 400; color: var(--tx2); white-space: nowrap; }
  .alt-swap-total .mut { color: var(--tx3); }
  /* 费率体检：不可行动的那一段只用两列（说明不再逐行重复，改挂徽标 + title） */
  .alt-col.fee, .alt-row.fee { grid-template-columns: 1fr 66px; }
  .alt-feesum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 2px 0 7px; }
  .alt-feesum > div { background: var(--card2); border: 1px solid var(--line-soft); border-radius: 8px; padding: 4px 6px; }
  .alt-feesum .k { font-size: var(--fs-xxs); color: var(--tx3); }
  .alt-feesum .v { font-family: var(--mono); font-size: var(--fs-sm); font-weight: 400; font-variant-numeric: tabular-nums; }
  .alt-facts { margin: 8px 0 0; padding-left: 16px; font-size: var(--fs-xxs); line-height: 1.7; color: var(--tx3); }
  .alt-facts b { color: var(--tx2); }
  .alt-note { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: var(--fs-xxs); line-height: 1.7; color: var(--tx3); }
  @media (max-width: 400px) {
    .alt-col, .alt-row { grid-template-columns: 1fr 58px 70px; }
  }

  /* ===== 区块标题 ===== */
  .sec-title { font-size: var(--fs-md); font-weight: 700; margin: 20px 2px 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; scroll-margin-top: 44px; }
  .sec-title .cnt { font-size: var(--fs-xs); color: var(--tx3); font-weight: 400; }
  /* 「工具」一节里两张卡各自的小标题（2026-09-30）：原先是两个独立小节标题，合并成「🔧 工具」后
     降为卡上方的小标题行 —— 徽章 id 不变（alt-cnt / fee-cnt），故渲染逻辑零改动。 */
  .tool-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: var(--fs-sm); font-weight: 600; color: var(--tx2); margin: 14px 2px 6px; }
  .tool-head .cnt { font-size: var(--fs-xs); color: var(--tx3); font-weight: 400; }

  /* ===== 页内锁点导航：顶栏 sticky，手机端可横滑 =====
     1 页 8 个区块，无导航时从“盈亏总览”跳回“资产走势”要手动滚 3–4 屏。
     不靠 JS：原生 <a href="#id"> + html { scroll-behavior: smooth } 即可。 */
  .sec-nav {
    position: sticky; top: 6px; z-index: 20;
    display: flex; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding: 6px 14px; margin: 0 -14px 12px;
    background: var(--bg); border-bottom: 1px solid var(--line-soft);
    scrollbar-width: none;
  }
  .sec-nav::-webkit-scrollbar { display: none; }
  .sec-nav-link {
    flex: none; font-family: var(--mono); font-size: var(--fs-xxs);
    color: var(--tx2); text-decoration: none; padding: 4px 9px;
    border-radius: 999px; border: 1px solid var(--line);
    white-space: nowrap; background: var(--card);
    transition: color .15s, border-color .15s;
  }
  .sec-nav-link:hover, .sec-nav-link:focus-visible { color: var(--blue); border-color: var(--blue); }
  .sec-nav-link.current { color: var(--blue); border-color: var(--accent-line); background: var(--accent-bg); font-weight: 600; }

  /* ===== 持仓卡（场内/场外共用骨架） ===== */
  .pos-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pos-name { font-size: var(--fs-lg); font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .code { font-family: var(--mono); font-size: var(--fs-xs); color: var(--tx3); border: 1px solid var(--line); border-radius: var(--radius-xs); padding: 1px 6px; }
  .idx-badge { font-family: var(--mono); font-size: var(--fs-xxs); font-weight: 700; border-radius: var(--radius-xs); padding: 2px 7px; white-space: nowrap; }
  .idx-badge.ndx { background: var(--accent-bg); color: var(--blue); border: 1px solid var(--accent-line); }   /* 与 .alloc-seg.ndx 对齐——同数据不两色 */
  .idx-badge.spx { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple-line); }
  .idx-badge.kr { background: var(--info-bg); color: var(--cyan); border: 1px solid var(--info-line); }
  .idx-badge.n225 { background: var(--warn-bg); color: var(--yellow); border: 1px solid var(--warn-line); }
  .idx-badge.hkus { background: var(--up-bg); color: var(--green); border: 1px solid var(--up-line); }
  .idx-badge.global { background: var(--tint); color: var(--tx2); border: 1px solid var(--tint-line); }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 14px; font-size: var(--fs-sm); margin-bottom: 8px; }
  .stat-grid .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line-soft); min-width: 0; }
  .stat-grid .row b { font-family: var(--mono); font-feature-settings: "tnum"; font-weight: 700; white-space: nowrap; }

  /* ===== 三点水位梯：高点/现价/成本 ===== */
  .ladder { position: relative; margin: 0 0 8px; }
  .ladder::before { content: ""; position: absolute; left: 4px; top: 14px; bottom: 14px; width: 2px; border-radius: 1px; background: var(--line); }
  /* 「成本 / 现价 / 高点」三档读数（2026-09-23：原水位梯三行 ＋ 三根迷你轨道合并成这一行）
     —— 原来它与下面的分位条是同一份「区间位置」的两种画法，合计占 219px（整卡 46%）；
     位置信息统一交给分位条，这里只给数值与结论 chip（点的配色与条上三个标记一致 ✓）。
     原来按值排序的三行（高点/现价/成本）现按固定顺序平铺，窄屏自动换行。 */
  .lad-line { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; padding: 3px 0 5px; font-size: var(--fs-xs); color: var(--tx2); font-family: var(--mono); font-feature-settings: "tnum"; }
  .lad-line .lad-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .lad-line .lad-item b { color: var(--tx); font-weight: 700; }
  .lad-line .lad-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; box-shadow: 0 0 0 3px var(--card); }
  .lad-name { font-size: var(--fs-xs); color: var(--tx3); flex: none; }
  .lad-val { font-family: var(--mono); font-size: var(--fs-md); font-weight: 700; font-feature-settings: "tnum"; }
  /* 关系链（2026-09-23）：三档由「并列罗列」改为按值排序的链 —— 跨度直接写在相邻两项之间，
     左→右阅读即「从这个数涨/跌多少到下一个数」，与下方分位条的左右方向一致。 */
  .lad-chain { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .lad-hop { display: inline-flex; align-items: center; gap: 6px; }   /* 跨度＋箭头＋目标项：整组不可拆，折行只发生在跳与跳之间 */
  .lad-gap { font-weight: 700; font-feature-settings: "tnum"; }
  .lad-gap.up { color: var(--green); }
  .lad-gap.down { color: var(--red); }
  .lad-gap.warn { color: var(--yellow); }
  .lad-arrow { color: var(--tx3); }
  .lad-chips { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .lad-chip { font-family: var(--mono); font-size: var(--fs-xxs); font-weight: 700; border-radius: var(--radius-xs); padding: 1px 6px; border: 1px solid; white-space: nowrap; font-feature-settings: "tnum"; }
  .lad-chip.up { color: var(--up); border-color: var(--up-line); background: var(--up-bg); }
  .lad-chip.warn { color: var(--warn); border-color: var(--warn-line); background: var(--warn-bg); }
  .lad-chip.down { color: var(--down); border-color: var(--down-line); background: var(--down-bg); }
  .lad-chip.dip { color: var(--blue); border-color: var(--accent-line); background: var(--accent-bg); }   /* DCA 加仓档用蓝：避免与青色「成本位」混淆 */

  /* ===== 场内溢价行 ===== */
  .prem-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: var(--fs-xs); color: var(--tx3); margin: -6px 0 10px; min-width: 0; }
  .prem-row b { font-family: var(--mono); font-weight: 700; font-feature-settings: "tnum"; }
  .prem-row b.prem-ok { color: var(--tx2); }
  .prem-row b.prem-warn { color: var(--yellow); }
  .prem-row b.prem-high { color: var(--red); }
  .prem-row b.prem-disc { color: var(--green); }
  .prem-row .prem-tag { font-size: var(--fs-xs); }
  .prem-row .prem-note { color: var(--tx3); }

  /* ===== 成本位置条 ===== */
  .bar-wrap { margin: 2px 0 10px; }
  .bar-title { font-size: var(--fs-xs); color: var(--tx3); margin-bottom: 14px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .bar-title b { color: var(--tx2); font-size: var(--fs-sm); }   /* 分位数字略强调，档位标签弱化形成层级 */
  /* 中性底（不再用误导性固定渐变）；红/绿只在现价↔成本间的 .seg 区间带出现，颜色即「浮亏/浮盈」 */
  /* 胶囊轨道 + 内阴影质感（"轨道"而不是"色块"，配合游标 marker 读位置） */
  .bar-track { position: relative; height: 12px; border-radius: 999px; background: var(--line-soft); box-shadow: var(--shadow-inset); }
  .bar-track .seg { position: absolute; top: 0; bottom: 0; border-radius: 4px; pointer-events: none; overflow: hidden; }
  /* 斜纹填充：盈亏区间有质感，且与纯色游标区分开 */
  .bar-track .seg.gain { background: repeating-linear-gradient(135deg, var(--up-fill) 0 4px, var(--up-bg) 4px 9px); }
  .bar-track .seg.loss { background: repeating-linear-gradient(135deg, var(--down-fill) 0 4px, var(--down-bg) 4px 9px); }
  /* 区间带剪成箭头形：平端 = 成本位，尖角端 = 指向现价位（现价在右 s-r、在左 s-l）；无字符、方向藏在形状里 */
  .bar-track .seg.s-r { clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%); }
  .bar-track .seg.s-l { clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%); }
  /* 游标形态（替代细竖线）：成本=青圆、现价=白圆（略大，代表"当下"），都带描边+光晕 */
  .bar-marker { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: 50%; border: none; padding: 0; margin: 0; cursor: pointer; }
  .bar-marker.cost { background: var(--cyan); box-shadow: 0 0 0 2px var(--card), 0 0 9px var(--info-fill); }
  .bar-end { position: absolute; right: -2px; top: 50%; transform: translateY(-50%); width: 6px; height: 18px; border-radius: 3px; background: var(--yellow); box-shadow: 0 0 9px var(--warn-solid); }
  .bar-marker.now { width: 14px; height: 14px; background: var(--tx); box-shadow: 0 0 0 2px var(--card), 0 0 12px var(--tx-glow2); }
  .bar-marker.now::after, .bar-marker.cost::after { content: ""; position: absolute; left: -7px; top: -10px; width: 26px; height: 32px; }   /* 可点区从 26×42 缩到 26×32：上一版向上溢出 15px 刚好压在 .buy-layer 买点标记上，手机误触会先弹现价浮层 */
  .idx-pop {
    position: absolute; bottom: 18px; z-index: 50; width: max-content; max-width: 250px;
    background: var(--pop-bg); border: 1px solid var(--pop-line); border-radius: var(--radius-sm);
    padding: 9px 12px; box-shadow: var(--pop-shadow), 0 0 0 1px var(--accent-line);
    font-size: var(--fs-xs); line-height: 1.7; animation: ipIn .15s ease;
  }
  .idx-pop .ip-title { font-weight: 700; margin-bottom: 3px; }
  .idx-pop .ip-row { display: flex; justify-content: space-between; gap: 14px; color: var(--tx2); }
  .idx-pop .ip-row b { font-family: var(--mono); font-weight: 700; color: var(--tx); font-feature-settings: "tnum"; }
  .idx-pop .ip-row .ip-sub { color: var(--tx3); font-weight: 400; font-family: var(--sans); }
  .idx-pop .ip-tip { margin-top: 5px; font-size: var(--fs-xs); color: var(--tx2); line-height: 1.65; border-top: 1px dashed var(--line); padding-top: 5px; }
  .idx-pop .ip-note { margin-top: 4px; font-size: var(--fs-xxs); color: var(--tx3); }
  @keyframes ipIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .strat-row { margin-top: 8px; font-size: var(--fs-xs); color: var(--tx3); line-height: 1.6; overflow-wrap: break-word; }
  .strat-row .lad-chip { margin-left: 6px; vertical-align: 1px; }   /* 加仓档 chip 自 2026-09-23 起挂在这一行（原挂三档读数行） */
  .held { font-family: var(--mono); font-size: var(--fs-xxs); color: var(--tx3); font-feature-settings: "tnum"; }
  /* 数据新鲜度的**相对时间**文字（今日 / N 天前）与「同步 X/8」计数：
     它们修饰的是旁边那枚 .date-chip，本身不是来源日期，故保持文字、不用胶囊。 */
  .sync-cnt, .fresh-ok, .fresh-stale, .fresh-old { font-family: var(--mono); font-size: var(--fs-xxs); font-feature-settings: "tnum"; }
  .fresh-ok { color: var(--green); }
  .fresh-stale { color: var(--yellow); }
  .fresh-old { color: var(--red); }
  .sync-cnt { color: var(--tx3); }
  /* （原 .nav-tag 已并入 .date-chip.nav —— 场外逐只净值日：同一枚胶囊、灰色）
     它答「市值算到哪天」，与左边的同步胶囊（答「截图是哪天」）是两件事，常不同：QDII 发布节奏。 */
  .sync-cnt.ok { color: var(--green); }
  .strat-hint { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; margin-left: 4px; border: 1px solid var(--line); border-radius: 50%; background: none; color: var(--tx3); font-size: var(--fs-xxs); font-family: var(--sans); cursor: pointer; vertical-align: 1px; padding: 0; }
  /* 移动端点击热区（2026-09-23）：这些「?」只有 14×14px（全页 64 个 .strat-hint + 若干 .sum-info/.tip），
     手指根本点不准 ✗。用透明 ::after 把热区扩到 26×26（= 14 + 6×2），**视觉零变化**；
     只取 6px 而不是 8px —— 相邻行间距约 22px，扩太多会越过行界、误触上一行的说明。 */
  .strat-hint, .sum-info, .tip { position: relative; }
  .strat-hint::after, .sum-info::after, .tip::after { content: ""; position: absolute; top: -6px; right: -6px; bottom: -6px; left: -6px; }
  .strat-note { display: none; font-size: var(--fs-xs); color: var(--tx3); margin-top: 6px; line-height: 1.55; padding: 7px 9px; border: 1px dashed var(--line-soft); border-radius: 8px; }
  .strat-note.open { display: block; }
  .bar-labels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: var(--fs-xxs); color: var(--tx3); margin-top: 8px; font-feature-settings: "tnum"; }
  .bar-legend { display: flex; gap: 10px; margin-top: 6px; font-size: var(--fs-xxs); color: var(--tx3); flex-wrap: wrap; opacity: .85; }
  .bar-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
  /* 买入位置分布 */
  .buy-layer { position: relative; height: 38px; margin-bottom: 1px; }
  .buy-layer:empty { display: none; }
  .buy-mark, .sell-mark { position: absolute; bottom: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; background: none; border: none; padding: 0; cursor: pointer; }
  .bar-track.pops { cursor: pointer; touch-action: manipulation; }
  .bar-track.pops::before { content: ""; position: absolute; inset: -7px 0; }
  button.bar-marker { pointer-events: none; }
  .buy-mark b { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 5px var(--up-fill); }
  .buy-mark.flash b { animation: buyflash .5s ease-in-out 3; }
  @keyframes buyflash { 0%, 100% { transform: scale(1); box-shadow: 0 0 5px var(--up-fill); } 50% { transform: scale(1.9); box-shadow: 0 0 14px var(--up-solid); } }
  .log-item.linkable { cursor: pointer; }
  .log-item.linkable:hover .log-date { color: var(--green); }
  /* 盈亏总览行的渠道来源标签（场内=场内券商；场外=基金公司/第三方平台） */
  /* 渠道：斜杠紧凑式（无边框 chip），省下的横向空间留给长名称；空间不足时省略名称、渠道始终完整 */
  /* 渠道＋口径日期：移到第二行左端（原来与名称同行，挤占名称宽度） */
  .pl-src { font-size: var(--fs-xxs); font-weight: 400; font-family: var(--sans); color: var(--tx3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .buy-mark i { width: 1.5px; background: var(--up-line); }
  /* 卖出标记：红空心圈（与买入绿实心对称，空心=已离场）；不堆叠，笔数少时更清爽 */
  .sell-mark b { border-radius: 50%; background: transparent; border: 1.5px solid var(--red); box-shadow: 0 0 4px var(--down-fill); box-sizing: border-box; }
  .sell-mark i { width: 1.5px; background: var(--down-line); }
  .sell-mark.flash b { animation: sellflash .5s ease-in-out 3; }
  @keyframes sellflash { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.9); box-shadow: 0 0 14px var(--down-solid); } }
  .buy-tip { position: fixed; z-index: 60; transform: translate(-50%, -100%); background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: var(--fs-xs); font-family: var(--mono); color: var(--tx); white-space: nowrap; box-shadow: var(--tip-shadow); pointer-events: none; font-feature-settings: "tnum"; }
  .pos-tier { display: inline-block; font-size: var(--fs-xxs); font-weight: 700; border-radius: var(--radius-xs); padding: 1px 7px; margin-left: 6px; font-family: var(--sans); white-space: nowrap; }
  .pos-tier.t-low { background: var(--up-bg); color: var(--green); border: 1px solid var(--up-line); }
  .pos-tier.t-mid { background: var(--tint); color: var(--tx2); border: 1px solid var(--tint-line); }   /* 中性位 = 无信号，走灰调 */
  .pos-tier.t-high { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); }   /* 偏高 = 预警而非危险，与 strat “减仓” / 水位梯 “已达加仓档” 共用 --warn */

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .kpi-row.kpi3 { grid-template-columns: repeat(3, 1fr); }   /* 场内卡 3 格版：浮盈并入市值格，与竖梯 chips 去重 */
  .kpi-row.kpi2 { grid-template-columns: repeat(2, 1fr); }   /* 场内卡 2 格版（2026-09-30）：没卖出的标的没有第三格，别留空位 */
  /* KPI 卡片统一为一套：原 8px 4 / 10px 8 / 8px 6 三种 padding 同位不同高，列内行高不齐 */
  .kpi, .sum-cell, .sw-kpi { padding: 10px 8px; border-radius: var(--radius-md); }
  .kpi { background: var(--card2); border: 1px solid var(--line-soft); text-align: center; min-width: 0; }
  .kpi .k-label { font-size: var(--fs-xxs); color: var(--tx3); margin-bottom: 3px; }
  .kpi .k-val { font-family: var(--mono); font-size: var(--fs-md); font-weight: 700; font-feature-settings: "tnum"; }
  .kpi .k-sub { font-family: var(--mono); font-size: var(--fs-xxs); margin-top: 2px; font-feature-settings: "tnum"; }
  .kpi .k-sub.up { color: var(--up); } .kpi .k-sub.down { color: var(--down); }
  .up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); } .info { color: var(--info); }
  /* 场外卡口径小注 */
  .otc-note { font-size: var(--fs-xs); color: var(--tx3); margin-top: 8px; line-height: 1.6; border-top: 1px dashed var(--line-soft); padding-top: 7px; }

  /* ---- 场外定投 · 操作记录（2026-10-04 加；见 positions.html 里 renderOtcLog 的注释）----
     不照搬场内那种「一笔一行 + 备注」的研究型长表：场外 391 笔里 61% 是金额完全相同的机械定投，
     照搬就是流水账。本块只留三样：体检表（静默 + 状态）、异常笔、可折叠的逐笔明细。 */
  table.dca-tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-xs); margin-top: 2px; }
  table.dca-tbl th { text-align: left; font-weight: 700; color: var(--tx3); font-size: 10px; padding: 0 0 5px; border-bottom: 1px solid var(--line); }
  table.dca-tbl th .e-th2 { font-weight: 400; color: var(--tx3); font-size: var(--fs-xxs); }
  table.dca-tbl th.n, table.dca-tbl td.n { text-align: right; white-space: nowrap; padding-left: 12px; }
  table.dca-tbl td { padding: 6px 0; border-bottom: 1px dashed var(--line-soft); vertical-align: top; }
  table.dca-tbl tr.sum td { border-bottom: none; border-top: 1px solid var(--line); font-weight: 700; padding-top: 7px; }
  table.dca-tbl .f-nm { font-weight: 600; color: var(--tx); }
  /* 名字下第二行：笔数 / 异常数 / 末笔日 / 主力金额档（等宽，便于竖着比） */
  table.dca-tbl .f-meta { display: block; font-size: 10px; color: var(--tx3); font-family: var(--mono); margin-top: 1px; }
  table.dca-tbl .f-inv, table.dca-tbl .f-gain { font-family: var(--mono); }
  /* ── 窄屏：场外定投表 → 卡片（2026-10-09 加；**复用** .chk-tbl 那一套约定，不另造）─────────────
     为什么现在才做：桌面 3~4 列的表格在 390px 下每列只剩 ~90px，
     「+22,611」这类数字与列名挤在一起、右对齐的列还会把数字推到贴边 ✗
     做法与 .chk-tbl 完全同构（隐表头 → 行块化 → 单元格 inline-block → 预埋列名显示出来 ✓）：
       · 名称行独占一行（它本来就有 f-nm + f-meta 两行 ✓）
       · 数字列两列一行（50%），列名用小标签放在数字上方 → 手机上没有表头也能读 ✓
     ⚠ 依赖渲染侧预埋 <i class="c-lb">列名</i>（与 .chk-tbl 同一个类名 ✓ 见 renderOtcLog）：
       没预埋就像没表头一样认不出哪个数字是什么 ✗ */
  table.dca-tbl .c-lb { display: none; }
  @media (max-width: 767px) {
    table.dca-tbl thead { display: none; }
    table.dca-tbl, table.dca-tbl tbody, table.dca-tbl tr, table.dca-tbl td { display: block; }
    table.dca-tbl tr { padding: 8px 0; border-bottom: 1px dashed var(--line-soft); }
    table.dca-tbl td { padding: 0; border: none; }
    table.dca-tbl td.n { display: inline-block; width: 50%; text-align: left; padding: 4px 0 0; white-space: normal; }
    table.dca-tbl td.n .c-lb { display: block; font-style: normal; color: var(--tx3); font-size: var(--chk-fs-mini); }
    table.dca-tbl tr.sum { border-top: 1px solid var(--line); border-bottom: none; font-weight: 700; }
    table.dca-tbl tr.sum td.n { width: 50%; }
  }
  /* ── 窄屏：场外当日预估（.est-tbl，3 列）与回本阶梯（.rb-tbl，5 列）→ 卡片（2026-10-09 加）──────
     与 .dca-tbl 同构、与 .chk-tbl 同源（隐表头 → 行块化 → 数字列两列一行 + 预埋列名）✓
     ⚠ 这两张表的数字列**桌面是右对齐**（.est-tbl td 与 .rb-tbl td.num），
       卡片模式下必须改左对齐 —— 否则每格里"标签在左、数字被推到格子最右"会散架 ✗ */
  table.est-tbl .c-lb, table.rb-tbl .c-lb { display: none; }
  @media (max-width: 767px) {
    table.est-tbl thead, table.rb-tbl thead { display: none; }
    table.est-tbl, table.est-tbl tbody, table.est-tbl tr, table.est-tbl td,
    table.rb-tbl, table.rb-tbl tbody, table.rb-tbl tr, table.rb-tbl td { display: block; }
    table.est-tbl tr, table.rb-tbl tr { padding: 8px 0; border-bottom: 1px dashed var(--line-soft); }
    table.est-tbl td, table.rb-tbl td { padding: 0; border: none; text-align: left; white-space: normal; }
    table.est-tbl td.e-mid, table.est-tbl td.e-amt,
    table.rb-tbl td.num { display: inline-block; width: 50%; padding: 4px 0 0; text-align: left; white-space: nowrap; }
    table.est-tbl td .c-lb, table.rb-tbl td .c-lb { display: block; font-style: normal; color: var(--tx3); font-size: var(--chk-fs-mini); }
    /* 回本阶梯的「首列」是档位（0%（回本）/ +20%…）：它是这一格的**标题**，不加列名、整行占满 ✓ */
    table.rb-tbl tr.rb-more td { padding: 6px 0 0; color: var(--tx3); }
  }
  .dca-chip { font-size: 9px; border-radius: 999px; padding: 0 5px; margin-left: 5px; border: 1px solid var(--line); color: var(--tx3); white-space: nowrap; }
  .dca-chip.ok { color: var(--green); }
  .dca-chip.warn { color: var(--warn); }
  .dca-chip.bad { color: var(--red); }
  .dca-anom { margin-top: 9px; font-size: var(--fs-xs); color: var(--tx3); }
  .dca-anom ul { margin: 3px 0 0; padding: 0; }
  .dca-anom li { list-style: none; padding: 2px 0; font-family: var(--mono); font-size: 10px; }
  .dca-funds { margin-top: 9px; border-top: 1px dashed var(--line-soft); padding-top: 6px; }
  .dca-funds > details { border-bottom: 1px dashed var(--line-soft); }
  .dca-funds > details:last-child { border-bottom: none; }
  .dca-funds > details > summary { cursor: pointer; font-size: var(--fs-xs); padding: 5px 0; color: var(--tx2); list-style: none; }
  .dca-funds > details > summary::-webkit-details-marker { display: none; }
  .dca-funds > details > summary::before { content: "▸ "; color: var(--tx3); }
  .dca-funds > details[open] > summary::before { content: "▾ "; }
  .dca-list { margin: 2px 0 6px; padding: 0; }
  .dca-list li { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; font-family: var(--mono); font-size: 10px; padding: 2px 0 2px 12px; color: var(--tx3); }
  /* 备注与限购退回（2026-10-12 加）：这一行本来就有 6 列，再塞两列在 380px 下必然挤成一团 ✗
     → 让它们**换行**到第二行（flex-wrap ✓）；备注给整行宽、限购信息留在首行末尾 ✓ */
  .dca-list li .d-req { color: var(--warn); white-space: nowrap; }
  .dca-list li .d-note { flex: 1 0 100%; color: var(--tx3); font-style: italic; }
  .dca-list li .d-a { flex: 1; color: var(--tx2); }
  .dca-list li .d-m { color: var(--tx2); }
  .dca-list li .d-s { color: var(--warn); }
  /* 逐笔盈亏（2026-10-04 加）：明细每行末两栏 —— 当日净值 / 该笔至今盈亏 */
  .dca-list li .d-nav { color: var(--tx3); min-width: 52px; text-align: right; }
  .dca-list li .d-pl { min-width: 52px; text-align: right; }
  .dca-sec { margin-top: 10px; padding-top: 7px; border-top: 1px dashed var(--line-soft);
    font-size: var(--fs-xs); color: var(--tx2); font-weight: 600; }
  .dca-sec .e-th2 { font-weight: 400; color: var(--tx3); font-size: var(--fs-xxs); }
  .dca-legend { font-size: 10px; color: var(--tx3); line-height: 1.6; margin: 2px 0 4px; }
  @media (max-width: 400px) { .dca-list li { gap: 6px; } }

  /* ---- 场外净值水位（2026-10-04 加；见 positions.html 里 renderOtcLevel 的注释）----
     场内有「三点水位梯」，场外一直没有 —— 本块的轨道 ＝ 该只净值的 52 周区间（左低右高），
     轨道上两个点：实心＝现价、青空心＝成本净值。用 grid 两栏（名字＋收益 / 元信息 / 轨道整行），
     与「账户年度排行」第三版同一套版式（手机上轨道独占整行，点才不会挤在一起）。 */
  .lvl-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 10px; color: var(--tx3); margin: 2px 0 7px; align-items: center; }
  .lvl-legend b.lvl-mk { position: static; display: inline-block; transform: none; margin: 0 2px; vertical-align: -1px; }
  .lvl-row { display: grid; grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "hd val" "meta meta" "track track"; column-gap: 8px; row-gap: 3px;
    padding: 7px 0; border-bottom: 1px dashed var(--line-soft); }
  .lvl-row:last-child { border-bottom: none; }
  .lvl-hd { grid-area: hd; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .lvl-row .n { grid-area: val; font-family: var(--mono); font-size: var(--fs-sm); }
  .lvl-meta { grid-area: meta; font-size: 10px; color: var(--tx3); font-family: var(--mono); line-height: 1.5; }
  .lvl-track { grid-area: track; position: relative; height: 5px; background: var(--card2); border-radius: 3px; margin: 4px 0 1px; }
  .lvl-mk { position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%; transform: translate(-50%, -50%); box-sizing: border-box; }
  .lvl-mk.now { background: var(--tx); border: 2px solid var(--card); }
  .lvl-mk.cost { background: var(--card); border: 2px solid var(--cyan); }

  /* ===== 流水条目（现嵌在各持仓卡的「操作记录」折叠区内） ===== */
  .log-item { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 9px; padding: 8px 2px; border-bottom: 1px dashed var(--line-soft); min-width: 0; }
  .log-item:last-child { border-bottom: none; }
  .log-date { font-family: var(--mono); font-size: var(--fs-xs); color: var(--tx3); font-feature-settings: "tnum"; }
  .log-sym { font-weight: 600; font-size: var(--fs-sm); }
  .log-nums { font-family: var(--mono); font-size: var(--fs-xs); color: var(--tx2); font-feature-settings: "tnum"; min-width: 0; }
  /* 逐笔流水的「成本价变化」（2026-09-23 加）：这一笔之后摊薄成本价变成多少、变了多少。
     卖出是按净回款冲减成本 → 成本价下降是常态，且下降是**好事** → 差值用 up 色，别按「跌=红」读。
     数值为全流水复算值（与 App 可能有 <0.01 尾差），悬停给口径。
     ⚠ 2026-09-27：只靠颜色会被读成「涨跌色用反了」（用户就是这么报上来的 —— 而且同一张卡里
     「调仓 / 顺T」那几行确实按符号上色，两种规则并存更难分辨）。现在行尾加方向符号：
       **↓ 成本被摊薄（绿）· ↑ 成本被抬高（红）** —— 方向由箭头直说、颜色只作辅助。
     「波段复盘」的 Δ成本 列同语义，已同步加箭头。 */
  .log-cost { font-family: var(--mono); font-size: var(--fs-xxs); color: var(--tx3); font-feature-settings: "tnum"; white-space: nowrap; cursor: help; }
  .log-cost b { font-weight: 700; }
  /* 卖出行的「减仓幅度」（2026-09-25 方案 B）：紧跟份数显示，读作「卖了 3,000 份（−58.8%）」。
     弱一档色（tx3）—— 它与成本价的百分比是两件事（一个讲减了多少仓、一个讲成本怎么变），
     且卖出行的成本 chip 已刻意不给百分比，这里也不上红绿，避免与盈亏色争视线。 */
  .log-cut { font-style: normal; color: var(--tx3); }
  /* 波段复盘表新增列：这趟往返对摊薄成本的影响（元/份）；颜色由 .up/.down 给（下降=绿） */
  .sw-cost { font-family: var(--mono); font-size: var(--fs-xxs); white-space: nowrap; cursor: help; }
  .log-note { width: 100%; font-family: var(--sans); color: var(--tx3); font-size: var(--fs-xs); line-height: 1.5; overflow-wrap: break-word; }
  /* 配对角标：同一回路的买入行与卖出行同号（⇄①）；悬停给出配对双方的成交明细 */
  .log-pair { font-family: var(--mono); font-size: var(--fs-xxs); font-weight: 700; border-radius: var(--radius-xs); padding: 1px 5px; white-space: nowrap; cursor: help; }
  .log-pair.sw { background: var(--up-bg); color: var(--green); border: 1px solid var(--up-line); }
  .log-pair.tr { background: var(--tint); color: var(--tx2); border: 1px solid var(--line); }
  .sw-no { color: var(--tx3); font-weight: 700; }
  /* 卡内操作记录折叠区：summary 先回答「现在赚亏多少」，展开才看逐笔明细 */
  .pos-log { margin-top: 10px; border-top: 1px dashed var(--line-soft); padding-top: 7px; }
  /* 操作体检条（2026-09-27 加）：每只持仓卡的操作记录区最上方一行、**不折叠** ——
     展开明细之前就能看到结论。形态＝标签 + 三个分项（字母档 + 数字）+ 一句人话结论，
     完整口径都在 title 里（悬停可读）。为什么不给单一总分：见 opCheckupHtml 的说明。 */
  .op-chk { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-top: 9px;
    padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card2);
    font-size: var(--fs-xs); color: var(--tx2); cursor: help; }
  .op-chk .oc-h { font-weight: 700; color: var(--tx); letter-spacing: .06em; }
  .op-chk .oc-i { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; }
  .op-chk .oc-i i { font-style: normal; color: var(--tx3); }
  .op-chk .oc-i b { font-family: var(--mono); font-weight: 800; padding: 0 4px; border-radius: 4px; }
  .op-chk .oc-i em { font-style: normal; font-family: var(--mono); font-size: var(--fs-xxs); color: var(--tx3); }
  .op-chk .oc-a { color: var(--green); background: var(--up-bg); }
  .op-chk .oc-b { color: var(--up); }
  .op-chk .oc-c { color: var(--yellow); }
  .op-chk .oc-d { color: var(--red); }
  .op-chk .oc-na { color: var(--tx3); }
  .op-chk .oc-note { color: var(--tx3); }
  /* 「盈亏总览」场外行里的紧凑版体检（2026-09-27 方案 A）：一行放得下，形态压弱一档，
     不跟右边的「本金 / 收益率」争视线；完整口径在 title 里。 */
  /* ⚠ 项内每个原子各自 nowrap、整块可折行 —— 整块 nowrap 会在 390px 撑出横向溢出（实测 4px） */
  .oc-brief { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 2px 4px;
    font-size: var(--fs-xxs); color: var(--tx3); cursor: help; }
  .oc-brief > * { white-space: nowrap; }
  .oc-brief b { font-family: var(--mono); font-weight: 800; padding: 0 3px; border-radius: 3px; }
  .oc-brief b.oc-a { color: var(--green); background: var(--up-bg); }
  .oc-brief b.oc-b { color: var(--up); }
  .oc-brief b.oc-c { color: var(--yellow); }
  .oc-brief b.oc-d { color: var(--red); }
  .oc-brief b.oc-na { color: var(--tx3); }
  /* 「操作体检」表（2026-09-27）：13 只集中对比。表头小而弱、行间细虚线（与盈亏总览同一套视觉），
     档位字母沿用 .oc-* 那套色；手机隐去「买点」列 —— 那里场内基本都是 C，信息量最低。 */
  /* ⚠ 本表字号走**局部变量**，不要改全站的 --fs-xs / --fs-xxs（分别被引用 58 / 70 次，
     牵连图例、小注、来源行等处）。--chk-fs 管正文与数字，--chk-fs-mini 管表头 / 列内小标签 / ⓘ / gap 小字。
     2026-09-27 用户要求「再小一点」：11→10、10→9；手机端的 .c-note / .c-lb 也从 mini 取，一并变小。 */
  /* ⚠ 2026-10-09：--chk-fs / --chk-fs-mini 已提到 :root（全页数据表共用）→ 这里不再重复声明 ✓
     值未变（10/9），故 .chk-tbl 自身的观感**零变化** ✓ */
  .chk-tbl {
    width: 100%; border-collapse: collapse; font-size: var(--chk-fs); }
  .chk-tbl th { text-align: left; font-weight: 700; color: var(--tx3); font-size: var(--chk-fs-mini);
    letter-spacing: .06em; padding: 0 8px 7px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .chk-tbl td { padding: 7px 8px 7px 0; border-bottom: 1px dashed var(--line-soft); vertical-align: baseline; }
  .chk-tbl tr:last-child td { border-bottom: none; }
  .chk-tbl .c-nm { font-weight: 600; color: var(--tx); }
  .chk-tbl b { font-family: var(--mono); font-weight: 800; padding: 0 4px; border-radius: 4px; }
  .chk-tbl b.oc-a { color: var(--green); background: var(--up-bg); }
  .chk-tbl b.oc-b { color: var(--up); }
  .chk-tbl b.oc-c { color: var(--yellow); }
  .chk-tbl b.oc-d { color: var(--red); }
  .chk-tbl b.oc-na { color: var(--tx3); font-weight: 400; }
  .chk-tbl .c-note { color: var(--tx3); line-height: 1.55; }
  /* 「数据不全」标记（2026-09-27 加）：3 项里有的"不适用/无记录"时给个 ⓘ ——
     这类行的档位来自更少的证据，但排序照旧（数据少不等于操作好），只提示、不降级。 */
  .chk-tbl .chk-partial { margin-left: 4px; color: var(--tx3); font-size: var(--chk-fs-mini); cursor: help; vertical-align: 1px; }
  /* 成本列尾部的 gap 小字（2026-09-27 加）：它是本表的**排序依据**（同档内按它升序），
     摆出来就不必"现价位 − 成本位"心算。刻意压小压淡 —— 主信息仍是「成本位 → 现价位」，gap 只当量级提示。
     ⚠ 成本价超区间、或 gap 算不出的行不显示（那些值语义无意义）。
     ⚠ 余量曾很紧：本行字号 10→9 之前，390px 下成本列 110px、内容 104px 只剩 6px；
       缩小后压力缓解，但余量仍不多 —— 若再调大字号/margin、或让 gap 变成 3 位数，
       **必须重测手机端是否溢出**（实测方法见 git 历史里的四档检查）。 */

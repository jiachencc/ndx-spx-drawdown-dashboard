# Validate the full history before the scheduled updater can commit anything.
# Manual GitHub Pages branch deployments are separate; this workflow does not change Pages settings.
name: update-data

on:
  schedule:
    - cron: "47 21 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "positions.html"
      - "data.js"
      - "scripts/**"
      - ".github/workflows/update-data.yml"
  pull_request:
    paths:
      - "index.html"
      - "positions.html"
      - "data.js"
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: read

concurrency:
  group: update-data-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regression tests (synthetic, offline)
        run: node --test scripts/test-dashboard.mjs
      - name: Validate actual schema and all historical snapshots
        run: node scripts/check-data.mjs

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch, validate and atomically update
        run: node scripts/fetch_and_update.mjs
      - name: Final audit
        run: node scripts/check-data.mjs
      - name: Commit only validated business-data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data.js; then
            echo "no business data change"
            exit 0
          fi
          git add data.js
          git commit -m "data(auto): validated source update"
          git push

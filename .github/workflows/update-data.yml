# Validate the full history before the scheduled updater can commit anything.
# Manual GitHub Pages branch deployments are separate; this workflow does not change Pages settings.
name: update-data

on:
  schedule:
    # 主跑：UTC 21:47 = 北京次日 05:47（美股 16:00 收盘后 5 小时 47 分）
    - cron: "47 21 * * 1-5"
    # 补跑：UTC 02:00 = 北京 10:00（同日早上的第二次机会）。
    # 2026-10-17 事故：主跑那次没留下任何提交，页面静默停在 10-15 一整天；
    # 单点定时 + 失败只发邮件，用户手机上根本感知不到 → 加一次纯冗余的重跑。
    # 无业务变化时 fetch_and_update 自己不会提交（stableBusiness），不会产生空提交。
    - cron: "0 2 * * 2-6"
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "positions.html"
      - "data.js"
      - "scripts/**"
      - ".github/workflows/update-data.yml"
  pull_request:
    paths:
      - "index.html"
      - "positions.html"
      - "data.js"
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: read

concurrency:
  group: update-data-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Regression tests (synthetic, offline)
        run: node --test scripts/test-dashboard.mjs
      # 门禁单一真源：与 pre-commit 钩子调同一个脚本（eslint / dom-check 缺失时自动跳过）
      - name: All data gates (scripts/verify-all.mjs)
        run: node scripts/verify-all.mjs

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Fetch, validate and atomically update
        run: node scripts/fetch_and_update.mjs
      # 费率表（FEES）：抓东财基金档案，来源与行情无关，失败保留旧值。
      - name: Fee table (FEES)
        continue-on-error: true
        run: node scripts/fetch-fees.mjs
      # 标的替换回测依赖同一批行情（腾讯日K + 东财净值），跑在行情之后、终审之前，让终审同时覆盖它写入的块。
      # 不阻断日更：它失败时脚本不会写入 data.js（先校验后原子写），行情更新照常提交；页面 ?debug 会提示期末日期落后。
      - name: Ticker-substitution backtest (ALT_BACKTEST)
        continue-on-error: true
        run: node scripts/alt-etf-backtest.mjs
      # 同节奏基准（BENCH）依赖快照日期：新一期快照落盘后补上该日的纳指收盘，
      # 走势图那条「同节奏纳指」虚线才能画到最后一点。只插入缺失日期：
      # 已有值不覆盖，块内手写注释与排版也不动（原实现重建整块，会把注释冲掉）。
      # 数据源优先在线抓 ^NDX（复用本 job 上面用过的 Yahoo 源，CI 里可用），
      # 拿不到才退回同仓库子目录 fed-cycle/fed-data.json（本地常有、CI 里没有）。
      # continue-on-error：补不上只是那条线停在前一天，不影响日更与其它数据。
      # 加息周期看板（fed-cycle）自己的数据 —— 它不在主流程里，靠本步刷新。
      # 放在 sync-bench 之前：sync-bench 拿不到在线序列时会**退回读它的 series.json**，先刷新 = 兜底数据也新。
      # continue-on-error：它的抓取源（historyofmarket.com 等）都在境外 —— 本机常常不通，CI 反而稳。
      # 路径守卫（2026-10-06 改名 fed-cycle-dashboard → fed-cycle）：这个文件是 pages 真正加载的产物，
      # 一旦路径被改坏，下面的更新步骤是 continue-on-error、提交步骤又会静默跳过 —— 只有本步会响。
      - name: Fed-cycle path guard
        run: test -f fed-cycle/fed-data.js || { echo "✗ fed-cycle/fed-data.js 缺失（路径被改过？）"; exit 1; }

      - name: Fed-cycle dashboard data (cycles.js)
        continue-on-error: true
        run: sh fed-cycle/update.sh

      # 各标的累计盈亏曲线（2026-10-18 加）：5 只 × 1 次日K，写 data.js 的 HOLD_HIST
      - name: Per-holding P&L history (HOLD_HIST)
        continue-on-error: true
        run: node scripts/fetch-hold-history.mjs

      - name: Fill missing benchmark levels (BENCH)
        continue-on-error: true
        run: node scripts/sync-bench.mjs
      # 2026-10-16 删：原第 ⑥ 步「OTC nowcast inputs (NOWCAST)」—— 页面上的「场外当日预估」模块整体下线、
      # 数据侧已无消费者，故 fetch-nowcast.mjs 与 NOWCAST / NOWCAST_LOG 两块一并移除 ✓（连这一步一起拔掉）。
      - name: Final audit
        run: node scripts/check-data.mjs
      - name: Commit only validated business-data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data.js fed-cycle/fed-data.js; then
            echo "no business data change"
            exit 0
          fi
          git add data.js fed-cycle/fed-data.js
          git commit -m "data(auto): validated source update"
          git push

      # 失败可见化（2026-10-17 加）：此前抓数/校验失败只会让整条 workflow 变红，
      # 通知默认只发邮件；手机上不打开 GitHub 就完全无感知（10-17 就是这么静默停了一天的）。
      # 这里额外写一条 error annotation + Summary，至少在看 Actions 时一眼能读到「该怎么办」。
      - name: Failure notice
        if: failure()
        run: |
          echo "::error::update-data 失败：行情可能仍停在上一交易日。请到 Actions → update-data → Run workflow 手动补跑。"
          {
            echo "### update-data 失败"
            echo ""
            echo "行情数据可能仍停在上一交易日（页面页头会显示「行情停在 MM-DD，落后 N 个交易日」）。"
            echo ""
            echo "处理：先看上面失败的步骤 → 修复后点本页右上角 Run workflow 重跑。"
          } >> "$GITHUB_STEP_SUMMARY"
